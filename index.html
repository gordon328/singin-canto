<script>
(function(){
"use strict";
const $=s=>document.querySelector(s);
const HAN=PACK.HAN;
const TJ=(()=>{const g=window.ToJyutping;if(!g)return null;if(typeof g.getJyutpingList==="function")return g;if(g.default&&typeof g.default.getJyutpingList==="function")return g.default;return null})();
const au=$("#au");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=t=>{if(!isFinite(t)||t<0)t=0;const m=Math.floor(t/60),s=Math.floor(t%60);return m+":"+String(s).padStart(2,"0")};
const toneOf=jp=>{const m=/([1-6])$/.exec(jp||"");return m?m[1]:""};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);

/* ---------- toast ---------- */
let toastT;
function toast(msg,ms=2600){const el=$("#toast");el.textContent=msg;el.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>el.hidden=true,ms)}

/* ---------- 出错记录：调试面板里显示完整的错误名和信息（localStorage yc-errlog，最近 20 条） ---------- */
function logErr(where,e){
  const r={t:new Date().toLocaleString(),where,name:(e&&e.name)||"Error",msg:(e&&e.message)||String(e)};
  try{const a=JSON.parse(localStorage.getItem("yc-errlog")||"[]");a.push(r);localStorage.setItem("yc-errlog",JSON.stringify(a.slice(-20)))}catch(_){}
  try{renderSim()}catch(_){}
  return r;
}
// 给人看的原因：只有 QuotaExceededError 才说空间不够，其他按实际错误说，后面带错误名
function errText(e){
  const n=(e&&e.name)||"Error";
  const why={QuotaExceededError:"手机存储空间不够",InvalidStateError:"和数据库的连接断开了，请把 App 关掉重新打开",UnknownError:"浏览器数据库出错了，请把 App 关掉重新打开再试",
    DataCloneError:"有一部分数据没法保存",VersionError:"数据库版本对不上",TransactionInactiveError:"保存超时了",AbortError:"保存被中断了",NotFoundError:"数据库里少了一张表"}[n]||"出了点问题";
  return `${why}（错误代码：${n}）`;
}
function saveFailed(where,e){logErr(where,e);toast("保存失败："+errText(e),8000)}

/* ---------- storage (IndexedDB, falls back to memory) ---------- */
// songs + cards（记忆卡片）+ meta（杂项）+ snapshot（数据格式升级前的快照）。升级只加表，绝不删表、清空表（docs/数据兼容规则.md）
// 打开时不写死版本号：先按现有版本打开，缺表才把版本加一补上。这样以后回退到旧代码也不会因为版本号对不上打不开
// had：打开前数据库里已经有哪些表（判断没记 dataVersion 的老数据是第几版）
const STORES={songs:"id",cards:"w",meta:"key",snapshot:"key"};
const DB={db:null,mem:{songs:new Map(),cards:new Map(),meta:new Map(),snapshot:new Map()},ok:false,had:null,
  open(){return new Promise(res=>{const go=ver=>{try{const r=ver?indexedDB.open("yuechang",ver):indexedDB.open("yuechang");
    r.onupgradeneeded=()=>{const db=r.result;if(!this.had)this.had=[...db.objectStoreNames];for(const [name,keyPath] of Object.entries(STORES))if(!db.objectStoreNames.contains(name))db.createObjectStore(name,{keyPath})};
    r.onsuccess=()=>{const db=r.result;if(!this.had)this.had=[...db.objectStoreNames];
      if(Object.keys(STORES).some(n=>!db.objectStoreNames.contains(n))){const v=db.version+1;db.close();go(v);return}
      this.db=db;db.onversionchange=()=>db.close();this.ok=true;res()};r.onerror=()=>res();
    r.onblocked=()=>toast("请先关闭其他打开着的唱学粤语页面",6000)}catch(e){res()}};go(0)})},
  // 写数据：同一个事务，要么全写进去，要么一条都不写。d = {songs, cards, meta, snapshot}（数组）。失败时 reject 真正的错误
  // 歌曲：数据库里已经有这首歌就用数据库里的音频——内存里的音频在 iPhone 切到后台后会失效，写回去浏览器会拒绝（v0.30「保存失败」）。
  //   只有 opt.newAudio（编辑歌曲换了音频）才写内存里的音频；新歌用自己带的音频
  // 连接断了（iPhone 切后台后常见）：重新打开数据库再试一次
  async write(d,opt={}){
    if(!this.ok)throw new DOMException("数据库没有打开","InvalidStateError");
    try{return await this._write(d,opt)}
    catch(e){if(!["InvalidStateError","UnknownError","TransactionInactiveError"].includes(e&&e.name))throw e;logErr("写入失败，重新打开数据库再试",e);await this.reopen();return this._write(d,opt)}
  },
  _write(d,opt){return new Promise((res,rej)=>{
    const names=Object.keys(d).filter(n=>STORES[n]&&d[n]&&d[n].length);if(!names.length){res();return}
    let err=null,tx;const fail=e=>{err=err||e};
    try{tx=this.db.transaction(names,"readwrite");
      const put=(n,o)=>{const r=tx.objectStore(n).put(o);r.onerror=()=>fail(r.error)};
      for(const n of names)for(const o of d[n]){
        if(n!=="songs"||opt.newAudio){put(n,o);continue}
        const g=tx.objectStore("songs").get(o.id);g.onerror=()=>fail(g.error);
        g.onsuccess=()=>{try{put("songs",{...o,audio:g.result?(g.result.audio??null):(o.audio??null)})}catch(e){fail(e);try{tx.abort()}catch(_){}}};
      }
    }catch(e){try{tx&&tx.abort()}catch(_){}rej(e);return}
    tx.oncomplete=()=>res();tx.onabort=()=>rej(err||tx.error||new DOMException("写入没有完成","AbortError"));
  })},
  reopen(){try{this.db&&this.db.close()}catch(e){}this.ok=false;this.db=null;return this.open()},
  _st(store,m){return this.db.transaction(store,m).objectStore(store)},
  fresh(key,store="songs"){if(!this.ok)return Promise.resolve(null);return new Promise(res=>{try{const r=this._st(store,"readonly").get(key);r.onsuccess=()=>res(r.result||null);r.onerror=()=>res(null)}catch(e){res(null)}})},
  all(store="songs"){const mem=this.mem[store];if(!this.ok)return Promise.resolve([...mem.values()]);return new Promise(res=>{try{const r=this._st(store,"readonly").getAll();r.onsuccess=()=>res(r.result||[]);r.onerror=()=>res([...mem.values()])}catch(e){res([...mem.values()])}})},
  // 存一条（内存先更新）。失败时按真正的原因提示，返回 false
  async put(o,store="songs",opt={}){this.mem[store].set(o[STORES[store]],o);if(!this.ok)return true;
    try{await this.write({[store]:[o]},opt);return true}catch(e){saveFailed("保存（"+store+"）",e);return false}},
  del(key,store="songs"){this.mem[store].delete(key);if(!this.ok)return Promise.resolve();return new Promise(res=>{try{const r=this._st(store,"readwrite").delete(key);r.onsuccess=()=>res();r.onerror=()=>res()}catch(e){res()}})}
};

let songs=[];
let cards=new Map(), metaRecs=new Map(), booted=false;
let cur=null, view=[], curIdx=-1, loopIdx=null, raf=0, rate=1, objURL=null, audioBlob=null, userScrollAt=0;
const prefs={jp:true,zh:true};
try{const p=JSON.parse(localStorage.getItem("yc-prefs")||"{}");Object.assign(prefs,p)}catch(e){}
function savePrefs(){try{localStorage.setItem("yc-prefs",JSON.stringify(prefs))}catch(e){}}

/* ---------- views ---------- */
const views=["home","importView","syncView","playerView","proofView","settingsView","studyView","wordsView","calendarView","changelogView","skinsView","devView","redeemView","packView"];
const DEPTH={home:0,importView:1,syncView:1,playerView:1,settingsView:1,studyView:1,calendarView:1,proofView:2,wordsView:2,changelogView:2,skinsView:2,devView:2,redeemView:2,packView:2};
// 右滑返回：Safari 和主屏幕模式都用 iOS 系统自带的（系统手势触发 popstate，App 直接切页，不再播自己的动画）。
// 页面按层级：首页(0) → 导入/打轴/播放(1) → 编辑歌曲(2)。往深一层用 pushState，同层跳转用 replaceState，所以返回总是回上一层
let curView="home",navAnim=false,navTimer=0,navPending=false;
const reduceMotion=()=>matchMedia("(prefers-reduced-motion: reduce)").matches;
// 常驻按钮：只在自己那一页显示（「＋ 导入新歌」多选模式下也隐藏）
function pageButtons(){document.querySelectorAll("[data-page]").forEach(e=>e.hidden=e.dataset.page!==curView||(e.id==="btnAdd"&&selectMode))}
// 底部模糊层高度 = 按钮高度 + 按钮离底部的距离（含安全区），按钮改大小、转屏时跟着变；按钮隐藏时（多选模式）保持原样
function fitEdgeBlur(){const a=$("#btnAdd");if(!a.offsetHeight)return;$(".edge-blur").style.height=a.offsetHeight+parseFloat(getComputedStyle(a).bottom)+"px"}
new ResizeObserver(fitEdgeBlur).observe($("#btnAdd"));addEventListener("resize",fitEdgeBlur);
function show(id,dir){
  const from=$("#"+curView),to=$("#"+id),y=scrollY;
  clearTimeout(navTimer);document.body.classList.remove("navigating");views.forEach(v=>{const el=$("#"+v);el.classList.remove("nav-layer","enter-fwd","leave-fwd","enter-back","leave-back");el.style.cssText=""});
  views.forEach(v=>$("#"+v).hidden=v!==id);window.scrollTo(0,0);curView=id;
  clearPressed();closeMenu(true);if(document.activeElement&&document.activeElement!==document.body&&!document.activeElement.dataset.kb)document.activeElement.blur();
  // 浮动播放条：页面滑入之后再从下方滑入（没有切页动画时马上滑入；减弱动态效果时只淡入）
  pageButtons();renderDbg();if(id==="home"&&booted)checkUnlocks();
  if(id==="redeemView")focusRedeem();else dropKeyboardHolder(); // 回到首页检查解锁（学习中间解锁的、完成页很快离开的，在这里弹）
  const BARS=".player,.study-foot";
  document.querySelectorAll(BARS).forEach(p=>p.classList.remove("bar-in"));
  const bars=to.querySelectorAll(BARS),barIn=()=>bars.forEach(x=>x.classList.add("bar-in"));
  if(!dir||from===to||reduceMotion()){barIn();return}
  // 旧页面暂时固定在原位，和新页面一起播动画
  document.body.classList.add("navigating");
  from.hidden=false;from.classList.add("nav-layer",dir==="fwd"?"leave-fwd":"leave-back");from.style.top=-y+"px";from.style.zIndex=dir==="fwd"?1:3;
  to.style.position="relative";to.style.zIndex=2;to.classList.add(dir==="fwd"?"enter-fwd":"enter-back");
  navTimer=setTimeout(()=>{from.hidden=true;from.classList.remove("nav-layer","leave-fwd","leave-back");from.style.cssText="";to.classList.remove("enter-fwd","enter-back");to.style.cssText="";document.body.classList.remove("navigating");barIn()},340);
}
// 按下效果用 JS 控制（不用 CSS :active，iPhone 上切页回来 :active 会卡住）：手指按下加 .is-pressed，抬起、取消、移出、滚动时立刻去掉
const PRESSABLE=".btn,.tones .key,.song,.ib,.res,.streak,.cal-grid .cal-day,.sgrp .cell,.skin-card";
let pressedEl=null;
function clearPressed(){document.querySelectorAll(".is-pressed").forEach(e=>e.classList.remove("is-pressed"));pressedEl=null}
document.addEventListener("pointerdown",e=>{
  clearPressed();if(outsideLayer(e.target))return;// 点外面只是关掉菜单或弹层，下面的按钮不显示按下
  const t=e.target.closest&&e.target.closest(PRESSABLE);
  if(t&&!t.disabled){t.classList.add("is-pressed");pressedEl=t;if(t.id==="btnSettings")t.classList.add("turn")}
},{passive:true,capture:true});
// 齿轮：取消点击（手指移开、滚动、系统取消）转回原位；抬手后 350ms 还没开始跳转（没有 click），也转回去
const gearBack=()=>{const g=$("#btnSettings");if(g&&!navPending&&curView==="home")g.classList.remove("turn")};
document.addEventListener("pointercancel",gearBack,{passive:true,capture:true});
document.addEventListener("pointerup",()=>setTimeout(gearBack,350),{passive:true,capture:true});
["pointerup","pointercancel"].forEach(ev=>document.addEventListener(ev,clearPressed,{passive:true,capture:true}));
document.addEventListener("pointermove",e=>{
  if(!pressedEl)return;const r=pressedEl.getBoundingClientRect();
  if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom){clearPressed();gearBack()}
},{passive:true});
window.addEventListener("scroll",()=>{if(pressedEl){clearPressed();gearBack()}},{passive:true,capture:true});
window.addEventListener("pageshow",clearPressed);
// 所有跳转都走这里：先松开按钮，等两帧（确认"松开"已经画到屏幕上）再等弹回动画（--dur-fast 120ms）播完，才 pushState 切页。
// 原因：系统右滑返回显示的是离开这一页时拍的快照，抬手后马上跳转的话快照里按钮还是按下的（2026-10-30 调试面板 v18 实测）
const RELEASE_MS=120;
const afterPaint=fn=>requestAnimationFrame(()=>requestAnimationFrame(fn));
const afterRelease=fn=>{clearPressed();afterPaint(()=>setTimeout(fn,reduceMotion()?0:RELEASE_MS))};
function go(view,data={}){
  if(navPending)return;
  if(curView==="home"&&view!=="home"){commitDelete();selectMode=false;selected.clear();restNote=null}
  navPending=true;
  afterRelease(()=>{
    navPending=false;dbgNote("跳转→"+view);
    const st={view,...data};
    if(DEPTH[view]>DEPTH[curView])history.pushState(st,"");else history.replaceState(st,"");
    show(view,"fwd");
  });
}
function goBack(){
  if(navAnim||navPending||curView==="home")return;if(curView==="proofView"&&proof&&proof.dirty){dirtyPrompt();return}
  navAnim=true;setTimeout(()=>{navAnim=false},1200);
  afterRelease(()=>{dbgNote("返回按钮");history.back()});
}
window.addEventListener("popstate",e=>{
  clearPressed();
  const st=e.state||{view:"home"},anim=navAnim?"back":null;navAnim=false;
  // 校对页有改动没保存，却被系统右滑返回了：回到校对页，弹出保存提示
  if(curView==="proofView"&&proof&&proof.dirty&&st.view!=="proofView"){history.pushState({view:"proofView",songId:proof.song.id},"");dirtyPrompt();return}
  closeSheet();
  if(curView==="proofView"){au.pause();if(proof)proof.stopAt=null}
  if(curView==="studyView"){stopStudyAudio();try{speechSynthesis.cancel()}catch(e){}stopVoice();study=null}
  if(curView==="wordsView"&&st.view!=="wordsView"){commitWordDel();wSelMode=false;wSel.clear()}
  if(st.view==="settingsView"){renderSettings();show("settingsView",anim);return}
  if(st.view==="wordsView"){renderWords();show("wordsView",anim);return}
  if(st.view==="calendarView"){renderCalendar();show("calendarView",anim);return}
  if(st.view==="changelogView"){renderChangelog();show("changelogView",anim);return}
  if(st.view==="skinsView"){renderSkins();show("skinsView",anim);return}
  if(st.view==="redeemView"){show("redeemView",anim);return}
  if(st.view==="packView"){if(cur&&cur.id===st.songId){renderPack();show("packView",anim);return}history.replaceState({view:"playerView",songId:st.songId},"");if(songs.some(s=>s.id===st.songId)){openSong(st.songId,{restore:true,anim});return}}
  if(st.view==="devView"){if(!devOn){history.replaceState({view:"settingsView"},"");renderSettings();show("settingsView",anim);return}renderDev();show("devView",anim);return}
  if((st.view==="playerView"||st.view==="proofView")&&songs.some(s=>s.id===st.songId)){if(st.view==="proofView")history.replaceState({view:"playerView",songId:st.songId},"");openSong(st.songId,{restore:true,anim});return}
  if(st.view!=="home")history.replaceState({view:"home"},"");
  // 回到首页：停掉播放，放开音频文件占的内存
  const back=curView!=="home";
  if(back){au.pause();loopIdx=null;cancelAnimationFrame(raf);setAudio(null)}
  freshHome();show("home",anim);renderHome();
  if(back)dbgReturn(anim?"返回按钮":"系统右滑/其他");
});
document.querySelectorAll("[data-back]").forEach(b=>b.addEventListener("click",goBack));
// 首页的固定按钮回首页时会被换成新元素，所以点击统一在 document 上按 id 分发
function onClick(id,fn){document.addEventListener("click",e=>{if(e.target.closest&&e.target.closest("#"+id))fn(e)})}
// 回到首页：放掉焦点，把首页固定按钮换成新元素（不带任何旧状态）。歌曲卡片、声调键帽、今天的学习在 renderHome 里本来就是新生成的
const HOME_BTNS=["btnDone","btnSettings","btnToneNext","btnSelect","btnDelSel","snackUndo","btnAdd","streak"];
function freshHome(){
  if(document.activeElement&&document.activeElement!==document.body)document.activeElement.blur();
  HOME_BTNS.forEach(id=>{const o=$("#"+id),n=o.cloneNode(true);n.classList.remove("is-pressed","spin","turn");o.replaceWith(n)});
}

/* ---------- 调试面板：连点 3 下首页底部版本号打开，再点 3 下关掉 ---------- */
// 查「回到首页后按钮还像按下」：记下离开首页前点的按钮，回首页后 0/100/500/1000/3000ms 各量一次它的状态；另外记最近 10 个触摸事件
// App 版本号：每次上线 +1（v0.30、v0.31……v0.99 之后是 v0.100），开发者说「发布正式版」才改成 v1.0。首页底部、设置页、sw.js 的 VERSION、CHANGELOG.md 同步改
const APP_VERSION="v0.38";
const dbg={on:false,open:false,last:null,ret:null,log:[],taps:0,tapAt:0};
// 开发者模式（开发规格 7.10.5）：调试面板、模拟日期只在开发者模式下有效。真的记录在 meta devMode；localStorage yc-dev 是启动时就能读的副本，读完数据库后 syncDev() 以数据库为准
let devOn=false;try{devOn=localStorage.getItem("yc-dev")==="1"}catch(e){}
try{dbg.on=devOn&&localStorage.getItem("yc-debug")==="1"}catch(e){}
// 模拟日期：App 的「现在」= 真实时间 + simDays 天（localStorage yc-simdays）。只在调试面板打开时生效，关掉面板就清零
// 模拟日期会把打卡、复习、学习进度按模拟的日子写进数据库，所以主屏幕 App（开发者的真实数据）里不能用，只能在 Safari 里用
const simAllowed=!navigator.standalone;
let simDays=0;
try{if(devOn&&simAllowed)simDays=parseInt(localStorage.getItem("yc-simdays"),10)||0}catch(e){}
function appNow(){return Date.now()+simDays*86400000}
function setSimDays(n){
  simDays=devOn&&simAllowed?n:0;
  try{if(simDays)localStorage.setItem("yc-simdays",String(simDays));else localStorage.removeItem("yc-simdays")}catch(e){}
  renderSim();onDayChange();
}
// 日期变了（模拟日期、第二天切回 App）：处理休息卡，刷新首页
function onDayChange(){processCheckin();if(curView==="home")renderHome()}
const dayNum=d=>Date.UTC(+d.slice(0,4),+d.slice(5,7)-1,+d.slice(8,10))/86400000;
// 调试面板「数据」：数据格式版本、最近的错误（完整的错误名和信息）
function renderDbgData(){
  const box=$("#dbgData");box.hidden=!dbg.on;if(box.hidden){box.innerHTML="";return}
  let log=[];try{log=JSON.parse(localStorage.getItem("yc-errlog")||"[]")}catch(e){}
  box.innerHTML=`<span class="lbl"><b>数据</b> · 数据格式第 ${metaRecs.get("dataVersion")?.v??"?"} 版 · ${DB.ok?"数据库正常":"数据库没打开（只存在内存里）"}</span>

let voices=[];
function loadVoices(){try{voices=speechSynthesis.getVoices()||[]}catch(e){voices=[]}}
if("speechSynthesis" in window){loadVoices();speechSynthesis.onvoiceschanged=loadVoices}
let warnedVoice=false;
function speak(text,r=0.8){
  if(!("speechSynthesis" in window)){toast("这个浏览器不支持朗读");return}
  au.pause();stopVoice();
  try{speechSynthesis.cancel()}catch(e){}
  const u=new SpeechSynthesisUtterance(text);u.lang="zh-HK";u.rate=r;
  const v=voices.find(v=>/zh[-_]HK|yue/i.test(v.lang))||voices.find(v=>/Sinji|Cantonese|粵|粤/i.test(v.name));
  if(v)u.voice=v;else if(!warnedVoice&&voices.length){warnedVoice=true;toast("没找到粤语语音。iPhone：设置 › 辅助功能 › 朗读内容 › 声音 › 中文（香港），下载后再试",6000)}
  speechSynthesis.speak(u);
}
/* 标准发音先用单音节录音（voice.js，Hiujin），有音节没录音时整个词用系统朗读 speak()。
   用 Web Audio 拼接，才能精确控制字之间停多久；静音开关打开时也要有声音，所以 audioSession 设成 playback */
let actx=null,voiceSrcs=[],voiceToken=0;const voiceBufs=new Map();
function audioCtx(){
  const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;
  if(!actx){actx=new C();try{if(navigator.audioSession)navigator.audioSession.type="playback"}catch(e){}}
  if(actx.state!=="running")actx.resume().catch(()=>{});
  return actx;
}
function voiceBuf(s){
  if(!voiceBufs.has(s)){
    const p=fetch(VOICE.url(s)).then(r=>{if(!r.ok)throw new Error(r.status);return r.arrayBuffer()})
      .then(a=>new Promise((ok,no)=>actx.decodeAudioData(a,ok,no)))
      .then(b=>{const [a,z]=VOICE.trimRange(b.getChannelData(0),b.sampleRate);return {b,off:a/b.sampleRate,dur:(z-a)/b.sampleRate}});
    p.catch(()=>voiceBufs.delete(s));voiceBufs.set(s,p);
  }
  return voiceBufs.get(s);
}
function stopVoice(){voiceToken++;voiceSrcs.forEach(s=>{try{s.stop()}catch(e){}});voiceSrcs=[]}
async function voicePlay(list,gap){
  const my=voiceToken,items=await Promise.all(list.map(voiceBuf));
  if(my!==voiceToken)return;
  let t=actx.currentTime+0.02;
  for(const it of items){const s=actx.createBufferSource();s.buffer=it.b;s.connect(actx.destination);s.start(t,it.off,it.dur);voiceSrcs.push(s);t+=it.dur+gap}
}
// text 汉字，jp 空格分隔的粤拼；mode "word" 连着读（字间 0.05 秒），"each" 逐字听（0.3 秒）；rate 是退回系统朗读时的语速
function say(text,jp,mode="word",rate=0.8){
  au.pause();try{speechSynthesis.cancel()}catch(e){}stopVoice();
  const list=VOICE.plan(jp);
  if(!list||!audioCtx()){speak(text,mode==="each"?0.6:rate);return}
  const my=voiceToken;
  voicePlay(list,VOICE.GAP[mode]).catch(()=>{if(my===voiceToken)speak(text,mode==="each"?0.6:rate)});
}
// 没网时也能听：提前把这些读音的录音下载好（sw.js 存进缓存），一次 4 个，已经下载过的跳过
const voiceFetched=new Set();let voiceQueue=[],voiceBusy=0;
function prefetchVoice(jps){
  for(const jp of jps)for(const s of VOICE.sylls(jp))if(VOICE.HAS.has(s)&&!voiceFetched.has(s)){voiceFetched.add(s);voiceQueue.push(s)}
  while(voiceBusy<4&&voiceQueue.length){voiceBusy++;const s=voiceQueue.shift();fetch(VOICE.url(s)).catch(()=>voiceFetched.delete(s)).finally(()=>{voiceBusy--;prefetchVoice([])})}
}

/* ---------- LRC ---------- */
function parseLRC(txt){
  const raw=[];
  for(const line of txt.split(/\r?\n/)){
    const tags=[...line.matchAll(/\[(\d{1,3}):(\d{1,2}(?:[.:]\d{1,3})?)\]/g)];
    if(!tags.length)continue;
    const text=line.replace(/\[[^\]]*\]/g,"").trim();
    for(const m of tags)raw.push({t:+m[1]*60+parseFloat(m[2].replace(":",".")),text});
  }
  raw.sort((a,b)=>a.t-b.t);
  raw.forEach((l,i)=>l.end=i+1<raw.length?raw[i+1].t:null);
  return raw.filter(l=>l.text);
}
function finishEnds(lines,dur){lines.forEach((l,i)=>{if(l.end==null||l.end<=l.t)l.end=i+1<lines.length?lines[i+1].t:(isFinite(dur)&&dur>l.t?dur:l.t+6)});return lines}

  const u=URL.createObjectURL(f);const a=new Audio();a.preload="metadata";
  a.onloadedmetadata=()=>{imp.dur=a.duration;$("#audioInfo").innerHTML=`<span class="ok">✓ ${esc(f.name)}</span> · ${fmt(a.duration)}`;URL.revokeObjectURL(u)};

function setAudio(blob){
  audioBlob=blob||null;

/* ---------- 播放和自动恢复 ----------
   iPhone 把 App 放在后台久了会回收内存，音频的 object URL（甚至从数据库读出的 Blob）可能读不出来。
   播放失败或 4 秒没播起来：从 IndexedDB 重新读这首歌的音频、换新地址再试一次；还失败才提示，提示里带错误代码。
   必须在点击里直接调用 playAu（iOS 要求 play() 由点击触发）。at：重新加载后要跳回的位置；onFail：彻底失败时收拾界面 */
let playReq=null,reloading=null;
function playAu(opts={}){
  const req={opts,started:false,done:false};playReq=req;
  if(opts.retried&&opts.at!=null){if(au.readyState>=1)au.currentTime=opts.at;else au.addEventListener("loadedmetadata",()=>{if(playReq===req)au.currentTime=opts.at},{once:true})}
  au.play().then(()=>{req.started=true;if(playReq===req)playReq=null}).catch(e=>{
    if(playReq!==req)return;
    if(e&&e.name==="AbortError"){playReq=null;return} // 被暂停或换音频打断，不算失败
    audioFailed(e);
  });
  setTimeout(()=>{if(playReq===req&&!req.started&&!au.paused)audioFailed(null,"timeout")},4000);
}
au.addEventListener("playing",()=>{if(playReq){playReq.started=true;playReq=null}});
au.addEventListener("error",()=>{if(playReq)audioFailed(null)});
async function audioFailed(e,why){
  const req=playReq;if(!req||req.done)return;req.done=true;playReq=null;
  const code=audioErrCode(e,why);
  if(!req.opts.retried&&await reloadAudio()){playAu({...req.opts,retried:true});return}
  if(!au.paused)au.pause();
  if(req.opts.onFail)req.opts.onFail();
  toast(audioErrMsg(e,why,req.opts.retried)+"（错误代码 "+code+"）",8000);
}
// 错误代码：MediaError 的 code（1 中断 2 读取 3 解码 4 读不出来/不支持）、play() 的错误名、超时时的 readyState/networkState
function audioErrCode(e,why){
  const parts=[];
  if(au.error)parts.push(String(au.error.code));
  if(e&&e.name)parts.push(e.name);
  if(why==="timeout")parts.push("T"+au.readyState+au.networkState);
  return parts.join(" · ")||"未知";
}
function audioErrMsg(e,why,retried){
  const c=au.error&&au.error.code,n=e&&e.name;
  if(n==="NotAllowedError")return retried?"iPhone 拦住了播放：音频已经重新加载好了，请再点一次":"iPhone 拦住了播放，请再点一次";
  if(why==="timeout")return "音频没有播出来，再点一次试试。一直这样的话，完全关掉 App 再打开";
  if(c===3)return "音频解码失败。可以在「编辑歌曲」里换成 mp3 或 m4a";
  return "音频读不出来。可以完全关掉 App 再打开；还不行就在「编辑歌曲」里重新选一次音频";
}
// 从数据库重新读当前音频所属的歌，换新地址（不自动播放，位置不变）。成功返回 true
function reloadAudio(){
  if(reloading)return reloading;
  reloading=(async()=>{
    const s=audioBlob&&songs.find(x=>x.audio===audioBlob);if(!s)return false;
    const rec=await DB.fresh(s.id),blob=rec&&rec.audio;if(!blob)return false;
    try{await blob.slice(0,16).arrayBuffer()}catch(e){return false}
    s.audio=blob; // songs 里的对象原地更新（cur、study.song 指向它）
    const t=au.currentTime;setAudio(blob);
    if(t>0)au.addEventListener("loadedmetadata",()=>{au.currentTime=t},{once:true});
    return true;
  })().finally(()=>{reloading=null});
  return reloading;
}
// 回到前台：检查音频还读不读得出来，读不出来就重新加载
async function checkAudio(){
  if(!objURL||!audioBlob||!au.paused)return;
  let ok=!au.error;
  if(ok)try{await audioBlob.slice(0,16).arrayBuffer();const r=await fetch(objURL);ok=r.ok;try{r.body&&r.body.cancel()}catch(e){}}catch(e){ok=false}
  if(!ok)await reloadAudio();
}

function charHTML(it,ci,words){
  if(it.space)return `<span class="sp"></span>`;
  const w=it.word>=0?words[it.word]:null;
  const cls=["c"];if(!it.han)cls.push("punct");if(w&&w.key)cls.push("key");if(it.ov)cls.push("ov");
  return `<span class="${cls.join(" ")}" data-ci="${ci}"${it.word>=0?` data-w="${it.word}"`:""}><span class="jp t${toneOf(it.jp)}">${esc(it.jp||"")}</span><span class="hz">${esc(it.ch)}</span></span>`;

// 把一句拆成不能再拆开的小组：标点跟前一个字（开引号跟后一个字），同一个词的字在一组，最后两组合并（避免最后一行只剩一个字）
const OPEN_PUNCT=/[「『（(《〈“‘【\[]/;
function wrapGroups(items){
  const g=[];let open=null;
  items.forEach((it,ci)=>{
    if(it.space){g.push({sp:true,cis:[ci]});return}
    const last=g[g.length-1];
    if(!it.han&&OPEN_PUNCT.test(it.ch)){open=open||[];open.push(ci);return}
    if(open){g.push({cis:[...open,ci],word:it.word});open=null;return}
    if(last&&!last.sp&&(!it.han||(it.word>=0&&last.word===it.word)))last.cis.push(ci);
    else g.push({cis:[ci],word:it.word});
  });
  if(open)g.push({cis:open});
  const words=g.map((x,i)=>x.sp?-1:i).filter(i=>i>=0);
  if(words.length>=2){const a=words[words.length-2],z=words[words.length-1];g.splice(a,z-a+1,{cis:g.slice(a,z+1).flatMap(x=>x.cis)})}
  return g.map(x=>x.cis);
}

}

async function proofOp(i,name,card){
  const L=proof.lines;
  if(name==="insert"){proof.lines=PROOF.insertAfter(L,i);proof.dirty=true;openProofLine(i+1,true);return}
  if(name==="split"){
    const inp=card.querySelector(".pl-text"),cut=[...inp.value.slice(0,inp.selectionStart||0)].length;
    const n=PROOF.split(L,i,cut);if(!n){toast("把光标放到要拆开的位置，再点「从这里拆开」");return}

  }

    if(L.length<=1){toast("至少要留一句歌词");return}
    if(!await confirmSheet({title:"删除这句？",body:"「"+(L[i].text.trim()||"（空的一句）")+"」"}))return;
    proof.lines=PROOF.remove(proof.lines,i);proof.dirty=true;proof.open=-1;renderProof();
  }
}
function shiftProof(d){
  const n=PROOF.shiftAll(proof.lines,d);if(!n){toast("已经到最前面了");return}
  proof.lines=n;proof.offset=Math.round((proof.offset+d)*10)/10;proof.dirty=true;renderProof();
}

$("#proofList").addEventListener("click",e=>{

async function saveProof(){
  const empty=proof.lines.findIndex(l=>!l.text.trim());
  if(empty>=0){openProofLine(empty,false);toast(`第 ${empty+1} 句是空的`);return false}
  const s=proof.song;
  // 按时间排好；改了文字的句子清掉手动读音；学会记录和卡片出处的行号跟着插入/拆开/合并/删除更新
  const r=PROOF.toSong(proof.lines);
  s.lines=r.lines;s.overrides=r.overrides;
  s.progress={...STUDY.progressOf(s),learned:r.learned};
  s.title=$("#prTitle").value.trim()||"未命名";s.artist=$("#prArtist").value.trim();
  const newAudio=!!proof.newAudio;
  if(proof.newAudio){s.audio=proof.newAudio.blob;s.audioName=proof.newAudio.name;s.duration=proof.newAudio.dur}
  s.updated=appNow();
  // 错别字更正已经写进歌词里了，清空它，免得又把你改回来的字改掉
  if(s.pack&&Array.isArray(s.pack.fix)&&s.pack.fix.length)s.pack={...s.pack,fix:[]};
  await DB.put(s,"songs",{newAudio});
  for(const c of cards.values()){
    if(!c.sources.some(x=>x.songId===s.id))continue;
    const seen=new Set(),src=[];
    for(const x of c.sources){const y=x.songId!==s.id?x:(r.map[x.li]!=null?{...x,li:r.map[x.li]}:null);if(y&&!seen.has(y.songId+":"+y.li)){seen.add(y.songId+":"+y.li);src.push(y)}}
    if(JSON.stringify(src)!==JSON.stringify(c.sources)){c.sources=src;c.updated=appNow();await DB.put(c,"cards")}
  }
  proof.dirty=false;toast("已保存");return true;
}
$("#proofSave").addEventListener("click",async()=>{if(await saveProof())goBack()});

  };
}

// 返回 Promise：点「删除」→ true；点「取消」或往下拖关闭 → false。确认类弹窗点外面不关（系统返回时也算取消）
let confirmDone=null;
function confirmSheet({title,body,ok="删除",danger=true}){
  if(confirmDone)confirmDone(false);
  return new Promise(res=>{
    confirmDone=v=>{confirmDone=null;res(v)};
    openSheet(`<h3>${esc(title)}</h3>${body?`<p class="note">${esc(body)}</p>`:""}
      <button class="btn ${danger?"danger-fill":"primary"} block" type="button" data-confirm="ok">${esc(ok)}</button>
      <button class="btn block" type="button" data-confirm="cancel">取消</button>`,{modal:true});
    $("#sheetBody").onclick=e=>{
      const b=e.target.closest("[data-confirm]");if(!b)return;
      const done=confirmDone;confirmDone=null;closeSheet();if(done)done(b.dataset.confirm==="ok");
    };
  });
}

/* ---------- sheet ---------- */
// 弹出层不使用暗幕（设计规范 5.6）。所有弹窗都有拖动条；modal：确认类弹窗，点外面不关，往下拖关闭等于取消
let sheetTimer=0,sheetModal=false;
const sheetOpen=()=>$("#sheet").classList.contains("open");
let sheetOnClose=null;
function openSheet(html,{modal=false,onClose=null}={}){
  const sh=$("#sheet");clearTimeout(sheetTimer);sheetModal=modal;sheetOnClose=onClose;
  $("#sheetBody").innerHTML=`<div class="grab"></div>`+html;
  if(sh.hidden||!sh.classList.contains("open")){stopSpring();sh.hidden=false;sh.scrollTop=0;sh.style.transform="";sh.style.transitionDuration="";void sh.offsetHeight;sh.classList.add("open")}
}
function closeSheet(){
  if(confirmDone)confirmDone(false);
  if(sheetOnClose){const f=sheetOnClose;sheetOnClose=null;setTimeout(f,360)}
  const sh=$("#sheet");
  document.querySelectorAll(".c.sel").forEach(x=>x.classList.remove("sel"));
  if(sh.hidden)return;
  stopSpring();sh.classList.remove("open","dragging");sh.style.transform="";
  clearTimeout(sheetTimer);sheetTimer=setTimeout(()=>{sh.hidden=true;sh.style.transitionDuration=""},320);
}
// 点外面关闭下拉菜单或弹层。用 pointerdown/up 判断（iPhone 上点普通文字不一定有 click），手指移动超过 10px 算滚动，不关。
// 这一下只用来关闭，后面跟着的 click 吞掉，不会顺便点到下面的按钮或字
let outsideAt=null,eatClickAt=-1;
const outsideLayer=t=>(menuOpen()&&!songMenu.contains(t))||(sheetOpen()&&!$("#sheet").contains(t));
document.addEventListener("pointerdown",e=>{eatClickAt=-1;outsideAt=outsideLayer(e.target)?{x:e.clientX,y:e.clientY}:null},{passive:true,capture:true});
document.addEventListener("pointercancel",()=>{outsideAt=null},{passive:true,capture:true});
document.addEventListener("pointerup",e=>{
  const o=outsideAt;outsideAt=null;if(!o||Math.hypot(e.clientX-o.x,e.clientY-o.y)>10)return;
  eatClickAt=e.timeStamp;
  if(menuOpen())closeMenu();else if(!sheetModal)closeSheet();
},{passive:true,capture:true});
document.addEventListener("click",e=>{if(eatClickAt>=0&&e.timeStamp-eatClickAt<600){eatClickAt=-1;e.stopPropagation();e.preventDefault()}},true);
// 往下拖关闭：只从拖动条和弹层顶部 48px 开始。弹窗跟着手指走，往上拖有橡皮筋阻力；
// 松手时拖过 1/3 高度或往下甩得够快就顺势滑下关闭，否则用弹簧（GESTURE.springOffset，带松手时的速度）弹回原位
let drag=null,springRaf=0;
const sheetY=y=>{$("#sheet").style.transform=y?`translateY(${y}px)`:""};
function stopSpring(){cancelAnimationFrame(springRaf);springRaf=0}
function springBack(x0,v0){
  const sh=$("#sheet");stopSpring();
  if(reduceMotion()||Math.abs(x0)<0.5){sh.classList.remove("dragging");sheetY(0);return}
  const t0=performance.now();
  const step=now=>{
    const t=now-t0,x=GESTURE.springOffset(x0,v0,t);
    if(t>=GESTURE.SPRING.DUR*2||(t>GESTURE.SPRING.DUR&&Math.abs(x)<0.5)){springRaf=0;sh.classList.remove("dragging");sheetY(0);return}
    sheetY(x);springRaf=requestAnimationFrame(step);
  };
  springRaf=requestAnimationFrame(step);
}
$("#sheet").addEventListener("touchstart",e=>{
  const sh=$("#sheet"),y=e.touches[0].clientY;
  if(y-sh.getBoundingClientRect().top>48||sh.scrollTop>0){drag=null;return}
  // 弹回途中又按住：从现在的位置接着拖
  const m=/translateY\((-?[\d.]+)px\)/.exec(sh.style.transform||""),at=m?+m[1]:0;stopSpring();
  drag={y0:y-Math.max(0,at),y,t:e.timeStamp,vy:0};sh.classList.add("dragging");
},{passive:true});
$("#sheet").addEventListener("touchmove",e=>{
  if(!drag)return;const y=e.touches[0].clientY,dt=e.timeStamp-drag.t;
  if(dt>0)drag.vy=(y-drag.y)/dt;drag.y=y;drag.t=e.timeStamp;
  const d=y-drag.y0;sheetY(d>=0?d:-GESTURE.rubberBand(-d,$("#sheet").offsetHeight));
  if(d!==0)e.preventDefault();
},{passive:false});
$("#sheet").addEventListener("touchend",()=>{
  if(!drag)return;const sh=$("#sheet"),d=drag.y-drag.y0,dy=Math.max(0,d),vy=drag.vy;drag=null;
  if(GESTURE.dragDismissDecision(dy,sh.offsetHeight,vy)){
    // 顺势滑下：按松手时的速度算剩下这段要多久（120–320ms）
    const left=sh.offsetHeight-dy,ms=Math.round(Math.min(320,Math.max(120,left/Math.max(vy,1.2))));
    sh.style.transitionDuration=ms+"ms";sh.classList.remove("dragging");closeSheet();return;
  }
  springBack(d>=0?dy:-GESTURE.rubberBand(-d,sh.offsetHeight),d>=0?vy:0);
});
$("#sheet").addEventListener("touchcancel",()=>{if(!drag)return;const d=drag.y-drag.y0;drag=null;springBack(d>=0?d:-GESTURE.rubberBand(-d,$("#sheet").offsetHeight),0)});
document.addEventListener("keydown",e=>{if(e.key!=="Escape")return;if(menuOpen())closeMenu();else if(sheetOpen()&&!sheetModal)closeSheet()});

function openWord(li,ci){
  const v=view[li],it=v.items[ci];if(!it||it.space)return;
  const w=it.word>=0?v.words[it.word]:null;
  // 只取点到的那一处：同一句里同一个词出现两次时，不把两处拼在一起
  let a=ci,z=ci;if(w){while(a>0&&v.items[a-1].word===it.word)a--;while(z<v.items.length-1&&v.items[z+1].word===it.word)z++}
  const idxs=Array.from({length:z-a+1},(_,k)=>a+k);
  document.querySelectorAll(".c.sel").forEach(x=>x.classList.remove("sel"));
  const lineEl=$("#lyrics").children[li];idxs.forEach(i=>lineEl.querySelector(`[data-ci="${i}"]`)?.classList.add("sel"));
  const wordText=idxs.map(i=>v.items[i].ch).join("");
  const shown=idxs.map(i=>v.items[i].jp).filter(Boolean).join(" ");
  let ttsNote="";
  if(TJ&&shown&&!VOICE.plan(shown)){const guess=TJ.getJyutpingText(wordText);if(guess&&guess.replace(/\s+/g," ").trim()!==shown)ttsNote=`<div class="warn">系统朗读可能读成 <b>${esc(guess)}</b>。以上面的粤拼为准。</div>`}
  const cands=it.han&&TJ?(TJ.getJyutpingCandidates(it.ch)[0]||[null,[]])[1].slice(0,8):[];
  if(it.han&&it.jp&&!cands.includes(it.jp))cands.unshift(it.jp);
  const orig=computeLineNoOverride(li).items[ci];
  const card=cards.get(wordText);
  const allRead=idxs.every(i=>!v.items[i].han||v.items[i].jp); // 每个字都有读音才能建卡
  const cardRow=!(it.han&&shown&&allRead)?"":card
    ?`<div class="wc-known">已在生词本 · ${card.known?"已认识":esc(SRS.dueLabel(card.srs.due,appNow()))+"复习"}</div>`
    :`<button class="btn block add-dashed" type="button" data-addcard="1">＋ 加入生词</button>`;
  openSheet(`
    <div class="wc-top${idxs.length>3?" long":""}">
      <div class="wc-square">${idxs.map(i=>{const x=v.items[i];return `<span class="wc-ch" data-say="${esc(x.ch)}" data-jp="${esc(x.jp||"")}"><span class="jp t${toneOf(x.jp)}">${esc(x.jp||"")}</span><span class="hz">${esc(x.ch)}</span></span>`}).join("")}</div>
      <div class="wc-side">
        ${w&&w.zh?`<div class="wc-mean">${esc(w.zh)}</div>`:""}
        <div class="wc-tags">${idxs.map(i=>{const n=toneOf(v.items[i].jp);return n?`<span class="tone-tag" style="--tc:var(--t${n})">第 ${n} 声 · ${TONE_NAMES[n]}</span>`:""}).join("")}</div>
        ${w&&w.oral?'<div><span class="chip">粤语口语字</span></div>':""}
      </div>
    </div>
    ${w&&w.tip?`<div class="wc-tip">${esc(w.tip)}</div>`:""}
    <div class="wc-btns"><button class="btn primary" type="button" data-say="${esc(wordText)}" data-jp="${esc(shown)}">听标准发音</button><button class="btn soft" type="button" data-orig="${li}">播放原唱这句</button></div>
    ${idxs.length>1?'<div class="note">点上面单个字可以听单字</div>':""}
    ${cardRow}
    ${ttsNote}
    ${!cur.pack?'<div class="note">导入词汇包后，重点词会显示普通话意思和记忆提示。</div>':(!w?'<div class="note">这个字不在词汇包里，读音是自动生成的。可以重新生成词汇包。</div>':"")}
    ${it.han&&cands.length?`<div class="field"><div class="label">「${esc(it.ch)}」读错了？选正确读音</div><div class="cands">${cands.map(c=>`<button class="cand" type="button" data-set="${esc(c)}" aria-pressed="${c===it.jp}"><span class="t${toneOf(c)}">${esc(c)}</span></button>`).join("")}${it.ov?`<button class="cand" type="button" data-reset="1">恢复为 ${esc(orig&&orig.jp||"")}</button>`:""}</div></div>`:""}
  `);
  $("#sheetBody").onclick=async e=>{
    const s=e.target.closest("[data-say]");if(s){say(s.dataset.say,s.dataset.jp,"word",s.dataset.say.length>1?0.75:0.7);return}
    const o=e.target.closest("[data-orig]");if(o){closeSheet();playLine(li);return}
    if(e.target.closest("[data-addcard]")){
      if(!cards.has(wordText)){

      cur.updated=appNow();await DB.put(cur);rebuildLine(li);if(loopIdx===li)$("#lyrics").children[li].classList.add("loop");openWord(li,ci);toast("读音已修改");
    }
  };
}

$("#wAct").addEventListener("click",async e=>{
  const b=e.target.closest("[data-wact]");if(!b||b.disabled)return;
  const sel=[...wSel].map(w=>cards.get(w)).filter(Boolean),now=appNow();if(!sel.length)return;

    if(!await confirmSheet({title:`删除 ${sel.length} 个词？`,body:"删除后它们不会再出现在学习和复习里。"}))return;
    setWordSel(false);deleteWords(sel.map(c=>c.w));return;
  }
  // 标为认识：known=true；取消认识：known=false，复习进度和新学的词一样（明天凌晨 4 点开始复习）。状态没变的词不动

  setWordSel(false);

// 删除生词：先从列表拿掉，5 秒内可以撤销；5 秒后、离开这一页、或 App 切到后台时才真正从数据库删除
function deleteWords(ws){
  commitWordDel();
  const del=ws.map(w=>cards.get(w)).filter(Boolean);if(!del.length)return;
  del.forEach(c=>cards.delete(c.w));
  wPendingDel={cards:del,timer:setTimeout(commitWordDel,5000)};
  $("#wSnackMsg").textContent=`已删除 ${del.length} 个词`;$("#wSnack").hidden=false;
  renderWords();
}
async function commitWordDel(){
  const p=wPendingDel;if(!p)return;
  wPendingDel=null;clearTimeout(p.timer);$("#wSnack").hidden=true;
  for(const c of p.cards)if(!cards.has(c.w))await DB.del(c.w,"cards");
}
$("#wSnackUndo").addEventListener("click",()=>{
  const p=wPendingDel;if(!p)return;
  wPendingDel=null;clearTimeout(p.timer);$("#wSnack").hidden=true;
  p.cards.forEach(c=>cards.set(c.w,c));renderWords();
});
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden")commitWordDel()});
window.addEventListener("pagehide",()=>commitWordDel());

    <div class="row"><button class="btn primary" type="button" data-say>🔊 听发音</button><button class="btn soft" type="button" data-known>${c.known?"取消已认识":"标记为已认识"}</button></div>

/* ---------- 皮肤页（设计规范 5.13）：卡片和预览都按皮肤文件里的颜色画，组件不认识任何皮肤 ---------- */
const MODE_TEXT={"auto":"跟随系统深浅色","dark-only":"始终深色","light-only":"始终浅色"};
const sysDark=()=>matchMedia("(prefers-color-scheme: dark)").matches;
// 皮肤预览：底色、主色卡片、六个声调色、两条卡片。size：small 皮肤页 / large 解锁弹窗（多一条标题、声调画成小键帽）
function skinPreview(def,size="small"){
  const c=SKIN.colorsFor(def,sysDark());
  const v=[["bg",c.bg],["surface",c.surface],["accent",c.accent],...c.tones.map((t,i)=>["t"+(i+1),t])].map(([k,x])=>`--p-${k}:${x}`).join(";");
  return `<span class="skin-prev ${size}" style="${esc(v)}" aria-hidden="true">${size==="large"?'<i class="p-title"></i>':""}<i class="p-hero"></i><span class="p-tones">${c.tones.map((_,i)=>`<i class="p-tone" style="--p-t:var(--p-t${i+1})"></i>`).join("")}</span><i class="p-card"></i><i class="p-card"></i></span>`;
}
function skinCtx(){return UNLOCK.context({checkin:getCheckin(),songs,cards:[...cards.values()],today:SRS.today(appNow())})}
// 两组：「已拥有」在上、「未解锁」在下，每组都按皮肤的 order 固定排序（不按解锁时间），位置稳定。
// asLocked：这些已经解锁的先放在「未解锁」里（刚解锁、还没在这页看过的，等一下再移过去）
function renderSkins({asLocked=[]}={}){
  const ci=getCheckin(),cur=document.documentElement.dataset.skin,ctx=skinCtx();
  const all=Object.values(SKIN_DEFS).sort((a,b)=>a.order-b.order);
  const owned=all.filter(d=>ci.unlocked.includes(d.id)&&!asLocked.includes(d.id)),locked=all.filter(d=>!owned.includes(d));
  const card=d=>{
    const rule=UNLOCK.RULES[d.unlock.type],v=d.unlock.value,have=ci.unlocked.includes(d.id),use=d.id===cur;
    let cond;
    if(d.unlock.type==="default")cond=`<span class="skin-cond">${esc(rule.label(v))}</span>`;
    else if(have)cond=`<span class="skin-cond ok">${esc(rule.label(v).replace(/解锁$/,""))} · 已解锁</span>`;
    else{const p=rule.progress(ctx,v);cond=`<span class="skin-cond">${esc(rule.label(v))}</span>`+(p?`<span class="skin-prog"><span class="skin-bar"><i style="width:${(p.cur/p.max*100).toFixed(1)}%"></i></span><span class="num">${p.cur}/${p.max}</span></span>`:"")}
    const pill=use?'<span class="skin-pill on">使用中 ✓</span>':have?'<span class="skin-pill">使用</span>':'<span class="skin-pill off">未解锁</span>';
    return `<button class="skin-card${use?" current":""}${have?"":" locked"}" type="button" data-skin-id="${esc(d.id)}">${skinPreview(d)}<span class="skin-main"><span class="skin-head"><b class="skin-name">${esc(d.name)}</b><span class="skin-mode">${MODE_TEXT[d.modes]}</span></span>${cond}</span>${pill}</button>`;
  };
  const sec=(title,group,list)=>list.length?`<section class="skins-sec"><div class="sgrp-t">${title}</div><div class="skins-group" data-group="${group}">${list.map(card).join("")}</div></section>`:"";
  $("#skinsList").innerHTML=sec("已拥有","owned",owned)+sec("未解锁","locked",locked);
}
// 进皮肤页：上次看过这页之后新解锁的皮肤，先在「未解锁」里，页面滑进来后移到「已拥有」（位置过渡动画）。
// 看过哪些记在 localStorage yc-skins-owned（只是显示用，丢了就不播动画）
let skinsMoveT=0;
function openSkinsPage(){
  const ci=getCheckin();let seen=null;
  try{seen=JSON.parse(localStorage.getItem("yc-skins-owned"))}catch(e){}
  const fresh=Array.isArray(seen)?ci.unlocked.filter(id=>!seen.includes(id)&&SKIN_DEFS[id]):[];
  clearTimeout(skinsMoveT);
  renderSkins({asLocked:fresh});
  try{localStorage.setItem("yc-skins-owned",JSON.stringify(ci.unlocked))}catch(e){}
  if(fresh.length)skinsMoveT=setTimeout(()=>{if(curView==="skinsView")flipSkins(()=>renderSkins())},500);
}
// 重新排好后，每张卡片从原来的位置滑到新位置（减弱动态效果时直接换）
function flipSkins(render){
  const top=()=>new Map([...document.querySelectorAll("#skinsList .skin-card")].map(e=>[e.dataset.skinId,e.getBoundingClientRect().top]));
  const before=top();render();if(reduceMotion())return;
  document.querySelectorAll("#skinsList .skin-card").forEach(e=>{
    const t=before.get(e.dataset.skinId);if(t==null)return;const dy=t-e.getBoundingClientRect().top;if(Math.abs(dy)<1)return;
    e.animate([{transform:`translateY(${dy}px)`},{transform:"none"}],{duration:450,easing:"cubic-bezier(.2,.8,.2,1)"});
  });
}
/* ---------- 解锁皮肤（开发规格 7.9.5.4、7.10.3） ---------- */
// 检查所有皮肤的解锁条件（启动、回到首页、完成页打卡动画之后、恢复备份后）：新达成的记进打卡记录（来源、日期），
// 还没弹过窗的记在 checkin.unseen（App 被关掉也不会丢），然后弹窗
async function checkUnlocks(){
  if(typeof UNLOCK==="undefined"||typeof SKIN_DEFS!=="object")return;
  let rec=getCheckin();const today=SRS.today(appNow());
  const fresh=UNLOCK.newlyUnlocked(SKIN_DEFS,skinCtx(),rec.unlocked);
  if(fresh.length){
    for(const u of fresh)rec=CHECKIN.unlock(rec,u.id,u.by,today);
    rec={...rec,unseen:[...new Set([...(rec.unseen||[]),...fresh.map(u=>u.id)])]};
    await saveCheckin(rec);
  }
  showUnlocks();
}
// 一次只弹一个，弹出时从 unseen 里拿掉，关掉后弹下一个。已经有别的弹窗时等它关掉；学词、整句中间不弹，回到首页或完成页再弹
function showUnlocks(){
  const rec=getCheckin(),ids=(rec.unseen||[]).filter(x=>typeof x==="string");
  if(!ids.length){if(redeemReturn&&$("#sheet").hidden){redeemReturn=false;if(curView==="redeemView")goBack()}return}
  if(!$("#sheet").hidden){setTimeout(showUnlocks,400);return}
  if(curView==="studyView"&&!$("#stBody .st-done"))return;
  const id=ids[0],d=SKIN_DEFS[id];
  saveCheckin({...rec,unseen:ids.slice(1)});
  if(!d||!rec.unlocked.includes(id)){showUnlocks();return}
  const rule=UNLOCK.RULES[d.unlock.type],byCode=(rec.unlockedInfo||{})[id]&&rec.unlockedInfo[id].by==="code";
  openSheet(`<div class="unlock" data-skin-id="${esc(id)}">
    <div class="unlock-why">${byCode?`解锁新皮肤「${esc(d.name)}」`:esc(rule.reached(d.unlock.value))}</div>
    <h3 class="unlock-title">${byCode?"兑换成功":`解锁新皮肤「${esc(d.name)}」`}</h3>
    ${skinPreview(d,"large")}
    <p class="unlock-intro">${esc(d.intro)}</p>
    <button class="btn primary block" type="button" data-unlock="use">立即使用</button>
    <button class="btn text block" type="button" data-unlock="later">以后再说</button>
  </div>`,{onClose:showUnlocks});
}

let redeemReturn=false;
let redeeming=false;
async function doRedeem(){
  const inp=$("#rdIn");if(!inp||redeeming)return;
  const say=t=>{const m=$("#rdMsg");if(m)m.textContent=t},n=REDEEM.normalize(inp.value);
  if(!n){say(REDEEM.MESSAGES.empty);return}
  redeeming=true;
  try{
    const hash=await REDEEM.sha256(n),entry=REDEEM.find(typeof SKIN_CODES==="object"?SKIN_CODES:[],hash);
    const red=metaRecs.get("redeemed"),list=red&&Array.isArray(red.list)?red.list:[];
    const r=REDEEM.plan(entry,{unlocked:getCheckin().unlocked,devMode:devOn,redeemed:list.map(x=>x.hash),skinIds:Object.keys(SKIN_DEFS)});
    if(r.status!=="ok"){say(REDEEM.MESSAGES[r.status]);return}
    const today=SRS.today(appNow());let rec=getCheckin();
    for(const id of r.skins)rec=CHECKIN.unlock(rec,id,"code",today);
    if(r.skins.length)await saveCheckin({...rec,unseen:[...new Set([...(rec.unseen||[]),...r.skins])]});
    const rr={key:"redeemed",list:[...list.filter(x=>x.hash!==hash),{hash,at:today,rewards:entry.rewards}]};
    metaRecs.set("redeemed",rr);await DB.put(rr,"meta");
    if(r.dev)await setDevMode(true);
    inp.value="";inp.blur();renderSettings(); // 收起键盘
    if(r.dev)toast("开发者模式已开启：在设置页最下面",4000);
    if(r.skins.length){redeemReturn=true;showUnlocks()}else goBack(); // 有皮肤：弹「兑换成功」，关掉后回设置页
  }catch(e){logErr("兑换",e);say("兑换出错了："+errText(e))}
  finally{redeeming=false}
}

/* ---------- 版本记录：显示 CHANGELOG.md（设置页「关于」进入，DEPTH 2） ---------- */
// 只认几种写法：## 版本标题、### 小标题、- 列表、含 ⚠️ 的行醒目显示、**粗体**。# 大标题不显示（顶栏已经有）
function changelogHTML(md){
  const inl=t=>esc(t).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>");
  let html="",card=false,list=false;
  const endList=()=>{if(list){html+="</ul>";list=false}};
  const endCard=()=>{endList();if(card){html+="</div>";card=false}};
  for(const raw of String(md).split(/\r?\n/)){
    const line=raw.trim();if(!line||/^# /.test(line))continue;
    if(/^## /.test(line)){endCard();html+=`<div class="card field"><h3>${inl(line.slice(3))}</h3>`;card=true;continue}
    if(!card){html+='<div class="card field">';card=true}
    const warn=line.includes("⚠️");
    if(/^### /.test(line)){endList();html+=`<h4>${inl(line.slice(4))}</h4>`}
    else if(/^[-*] /.test(line)){if(!list){html+="<ul>";list=true}html+=`<li${warn?' class="cl-warn"':""}>${inl(line.slice(2))}</li>`}
    else{endList();html+=`<p${warn?' class="cl-warn"':""}>${inl(line)}</p>`}
  }
  endCard();return html;
}

// 恢复结果和出错都用弹出提示（不留在页面上）
async function restoreFromFile(f){
  const fail=t=>toast(t,6000);
  if(f.size>50*1024*1024){fail("文件太大，不像唱学粤语的备份文件");return}
  let text;try{text=await f.text()}catch(e){logErr("读备份文件",e);fail("读不出这个文件，请再选一次");return}
  const r=BACKUP.parse(text);
  if(!r.ok){fail(r.err);return}
  // 旧版本的备份：先升到现在的数据格式，再和本机数据合并
  let obj;try{obj=DATA.upgradeBackup(r.obj)}catch(e){logErr("备份格式升级",e);fail("这个备份的格式升级失败，没有导入。请把备份文件发给开发者看看");return}
  const sm=BACKUP.summary(obj);
  if(!await confirmSheet({title:"从这个备份恢复？",ok:"恢复",danger:false,
    body:`备份日期：${sm.date||"未知"} · ${sm.songs} 首歌 · ${sm.cards} 张卡片。会和本机的数据合并，不会删掉本机已有的歌和生词。备份里没有音频。`}))return;
  let res;
  try{res=await restoreBackup(obj)}
  catch(e){logErr("恢复备份",e);renderSettings();toast("恢复失败，本机数据没有改动："+errText(e),8000);return}
  renderSettings();
  if(res.problems.length){logErr("恢复后核对",new Error(res.problems.join("；")));toast("恢复完了，但核对时发现不一致："+res.problems[0]+"。请告诉开发者",8000);return}
  toast(`已恢复 ${res.n} 首歌、${cards.size} 个生词，核对无误`,4000);
  checkUnlocks();
}
// 恢复备份：先在内存里算好要写的所有记录，再用一个事务写进数据库——要么全部成功，要么本机一点不改（失败时抛出真正的错误）。
// 写完从数据库读回来核对：备份里的每首歌、每个生词、每个打卡日子、每天几句都在
async function restoreBackup(obj){
  await commitDelete(); // 先把还能撤销的删除真正做完，免得稍后把刚恢复的歌又删掉
  const today=SRS.today(appNow()),same=(x,y)=>JSON.stringify(x)===JSON.stringify(y);
  const W={songs:[],cards:[],meta:[]};
  // 歌：同一时间只有一首"正在学"，本机已经有的话，备份里新加的歌不标正在学。和本机一模一样的歌不用重写
  const hasCurrent=songs.some(x=>STUDY.progressOf(x).current),valid=obj.songs.filter(s=>s&&s.id&&Array.isArray(s.lines));
  const songPlan=[];
  for(const s of valid){const ex=songs.find(x=>x.id===s.id);const m={...stripAudio(s)};
    if(ex)m.progress=STUDY.mergeProgress(ex.progress,s.progress,m.lines.length);else if(hasCurrent)m.progress={...STUDY.progressOf(m),current:false};
    // 比较时进度按读出来的样子比（旧歌没有 progress 字段和空进度算一样）
    const norm=x=>({...stripAudio(x),progress:STUDY.progressOf(x)});
    if(!ex||!same(norm(ex),norm(m))){W.songs.push(m);songPlan.push([ex,m])}}
  // 生词：合并后有变化的才写
  const mergedCards=SRS.mergeCards([...cards.values()],obj.cards,appNow());
  for(const c of mergedCards)if(!same(cards.get(c.w),c))W.cards.push(c);
  // meta：daily 用备份里的每天几句（今天的计数留本机的）；打卡合并；其他只恢复本机还没有的记录
  for(const m of Array.isArray(obj.meta)?obj.meta:[]){if(!m||typeof m.key!=="string")continue;
    if(m.key==="daily")W.meta.push(STUDY.mergeDaily(metaRecs.get("daily"),m,today));
    // 打卡：这台设备还没打过卡（新设备、清空过）就直接用备份里的，不然新记录送的 1 张休息卡会被算进去
    else if(m.key==="checkin"){const loc=getCheckin();W.meta.push(CHECKIN.normalize(Object.keys(loc.days).length?CHECKIN.merge(loc,m):{...m,...CHECKIN.mergeUnlocked(loc,m),unseen:loc.unseen||[]},today))}
    // 兑换记录：按哈希合并，同一个码留兑换得早的
    else if(m.key==="redeemed"){const a=metaRecs.get("redeemed"),list=[...(a&&Array.isArray(a.list)?a.list:[])];
      for(const x of Array.isArray(m.list)?m.list:[]){if(!x||typeof x.hash!=="string")continue;const i=list.findIndex(y=>y.hash===x.hash);if(i<0)list.push(x);else if((x.at||"")<(list[i].at||""))list[i]=x}
      W.meta.push({key:"redeemed",list})}
    else if(!BACKUP.DEVICE_ONLY.includes(m.key)&&!metaRecs.has(m.key))W.meta.push(m)}
  // 新设备从备份恢复：这份备份就是"上次备份"
  const exp=Date.parse(obj.exported);
  if(!metaRecs.get("backup")&&isFinite(exp))W.meta.push({key:"backup",at:exp});
  if(DB.ok)await DB.write(W);
  // 数据库写成功了，再更新内存
  for(const [ex,m] of songPlan){if(ex)Object.assign(ex,m);else songs.push({...m,audio:null})}
  cards=new Map(mergedCards.map(c=>[c.w,c]));
  for(const m of W.meta)metaRecs.set(m.key,m);
  processCheckin();syncSkin();renderHome(); // 新设备直接用备份里的打卡记录，正在用的皮肤也跟着换
  return {n:valid.length,problems:DB.ok?await verifyRestore(obj):[]};
}
// 从数据库读回来，和备份文件比数量
async function verifyRestore(obj){
  const p=[],dbSongs=await DB.all(),dbCards=new Set((await DB.all("cards")).map(c=>c.w)),dbMeta=new Map((await DB.all("meta")).map(m=>[m.key,m]));
  const want=obj.songs.filter(s=>s&&s.id&&Array.isArray(s.lines));
  const miss=want.filter(s=>{const d=dbSongs.find(x=>x.id===s.id);return !d||!Array.isArray(d.lines)||d.lines.length!==s.lines.length});
  if(miss.length)p.push(`有 ${miss.length} 首歌没恢复完整`);
  const wc=new Set((obj.cards||[]).filter(c=>c&&c.w).map(c=>c.w)),mc=[...wc].filter(w=>!dbCards.has(w));
  if(mc.length)p.push(`有 ${mc.length} 个生词没恢复`);
  const ci=(obj.meta||[]).find(m=>m&&m.key==="checkin");
  if(ci&&ci.days){const have=dbMeta.get("checkin")?.days||{};const md=Object.keys(ci.days).filter(k=>/^\d{4}-\d{2}-\d{2}$/.test(k)&&!have[k]);if(md.length)p.push(`有 ${md.length} 天打卡记录没恢复`)}
  const dy=(obj.meta||[]).find(m=>m&&m.key==="daily");
  if(dy&&STUDY.goalOf(dy)!==STUDY.goalOf(dbMeta.get("daily")))p.push("「每天新学几句」没恢复");
  return p;
}

/* ---------- 数据格式升级（docs/数据兼容规则.md）：meta dataVersion，迁移前存快照 ---------- */
// snapshot 表里只有一条 "last"：最近一次升级前的全部数据（不含音频）。只在后台用：升级失败时自动用它恢复，没有任何界面
const stripAudio=s=>{const o={...s};delete o.audio;return o};
function readPrefs(){try{return JSON.parse(localStorage.getItem("yc-prefs")||"{}")||{}}catch(e){return {}}}
// 没记 dataVersion 的老数据：打开前一张表都没有 = 新装；只有 songs 表 = 第一阶段（1）；有 meta 表 = M1 以后（2）
function storedVersion(){
  const r=metaRecs.get("dataVersion");if(r&&Number.isInteger(r.v))return r.v;
  const had=DB.had||[];
  return !had.includes("songs")?DATA.VERSION:had.includes("meta")?2:1;
}
async function reloadData(){songs=await DB.all();cards=new Map((await DB.all("cards")).map(c=>[c.w,c]));metaRecs=new Map((await DB.all("meta")).map(m=>[m.key,m]))}
// 启动时：数据比 App 旧就一步步升级。升级前先存快照；升级失败就用快照恢复并提示
async function upgradeData(){
  if(!DB.ok)return;
  const from=storedVersion(),mark={key:"dataVersion",v:DATA.VERSION};
  if(from>DATA.VERSION)return; // 回退到了旧版本的 App：数据比 App 新，不动它
  if(from===DATA.VERSION){if(!metaRecs.has("dataVersion")){metaRecs.set("dataVersion",mark);await DB.put(mark,"meta")}return}
  const before={songs:songs.map(stripAudio),cards:[...cards.values()],meta:[...metaRecs.values()],prefs:readPrefs()};
  const snap={key:"last",at:Date.now(),from,to:DATA.VERSION,app:APP_VERSION,data:before};
  try{await DB.write({snapshot:[snap]})}catch(e){logErr("保存升级前快照",e);toast("没能保存更新前的数据，这次先不升级数据格式："+errText(e),8000);return}
  try{
    const out=DATA.migrate(JSON.parse(JSON.stringify(before)),from).data;
    await DB.write({songs:out.songs,cards:out.cards,meta:[...out.meta.filter(m=>m&&m.key!=="dataVersion"),mark]});
    if(out.prefs){Object.assign(prefs,out.prefs);savePrefs()}
  }catch(e){
    logErr("升级数据格式",e);
    try{await putSnapshot(snap,from)}catch(e2){logErr("升级失败后恢复快照",e2)}
    toast("更新数据格式时出了问题，已经恢复到更新前的数据。可以正常使用，请告诉开发者",8000);
  }
  await reloadData();
}
// 把快照写回去（一个事务）：快照里有的歌、卡片、meta 用快照的（歌保留数据库里的音频），快照里没有的（更新后新加的）留着。dataVersion 回到快照那一版
async function putSnapshot(snap,from){
  const d=snap.data;
  await DB.write({songs:d.songs,cards:d.cards,meta:[...d.meta.filter(m=>m&&m.key!=="dataVersion"),{key:"dataVersion",v:from}]});
  try{localStorage.setItem("yc-prefs",JSON.stringify(d.prefs||{}))}catch(e){}
}

/* ---------- 每日学习 ---------- */
// 进度每一步立刻存：每个词点「会读了」就建卡，每句点「这句会了」就标记 learned。下次进来按规则算出断开的地方
let study=null;
async function startStudy(opts={}){
  const s=STUDY.currentSong(songs);if(!s)return;
  if(!STUDY.progressOf(s).current)await setCurrentSong(s.id);
  const d=getDaily();if(d.songId!==s.id)await saveDaily({...d,songId:s.id,done:[]});
  // 先复习到期的卡（规格 5.2），复习完再学新句子；reviewOnly（今天新句子学完了）复习完到完成页
  const queue=STUDY.reviewQueue(cards.values(),appNow());
  study={song:s,li:null,units:[],i:0,phase:queue.length?"review":"word",stopAt:null,loop:false,from:0,reviewOnly:!!opts.reviewOnly,
    review:{queue,i:0,requeued:new Set(),flipped:false,flippedAt:0}};
  setAudio(s.audio||null);
  go("studyView");
  if(queue.length)renderStudy(false);else if(study.reviewOnly)reviewDone(false);else studyNext(false);
}
async function studyNext(anim){
  const st=study,s=st.song,r=STUDY.nextLine(lineTexts(s),STUDY.progressOf(s).learned);
  // 副歌重复句、没有汉字的句子：自动标记学会，不占今天的数量
  if(r.skip.length){let p=STUDY.progressOf(s);for(const li of r.skip)p=STUDY.withLearned({...s,progress:p},li);s.progress=p;await saveSong(s);if(study!==st)return}
  if(r.li===null||STUDY.remaining(getDaily())===0){study.phase="done";study.finished=r.li===null;renderStudy(anim);return}
  study.li=r.li;study.units=STUDY.lineUnits(computeLineFor(s,r.li)).filter(u=>!cards.has(u.w));study.i=0;
  study.phase=study.units.length?"word":"line";renderStudy(anim);
}
function renderStudy(anim){

async function gradeCard(grade){

function playLineOf(s,li,loop){
  const L=s.lines[li],next=s.lines[li+1];

  try{speechSynthesis.cancel()}catch(e){}stopVoice();
  if(audioBlob!==s.audio)setAudio(s.audio);
  study.from=L.t;study.stopAt=next?next.t:L.end;study.loop=loop;
  au.defaultPlaybackRate=au.playbackRate=0.8;

    const r=study.review,w=r.queue[r.i];
    if(a==="flip"){if(!r.flipped){r.flipped=true;r.flippedAt=performance.now();renderReview();try{say(w,cards.get(w)?.jp)}catch(e){}}}
    else if((a==="say"||a==="orig")&&study.busy)return; // 评完分、切换动画里旧卡片的按钮还在：不读下一张的词
    else if(a==="say")say(w,cards.get(w)?.jp);
    else if(a==="orig"){const src=STUDY.firstSource(cards.get(w)||{},songs);if(src)playLineOf(src.song,src.li,false)}
    else if(["again","hard","good"].includes(a))gradeCard(a);
    return;
  }
  const u=study.units[study.i];
  if(a==="say")say(u.w,u.jp);else if(a==="slow")say(u.w,u.jp,"each");else if(a==="orig")playStudyLine(false);
  else if(a==="got")learnWord(false);else if(a==="known")learnWord(true);
  else if(a==="slowline"){stopStudyAudio();const v=computeLineFor(study.song,study.li);say(PACK.fixText(study.song,study.song.lines[study.li].text),v.items.filter(it=>!it.space&&it.jp).map(it=>it.jp).join(" "),"each");refreshLoop()}
  else if(a==="loop"){if(study.loop&&!au.paused)stopStudyAudio();else playStudyLine(true);refreshLoop()}
  else if(a==="lineok")lineLearned();
  else if(a==="more"){const st=study,d=getDaily();saveDaily({...d,extra:d.extra+2}).then(()=>{if(study===st)studyNext(true)})}
  else if(a==="home")goBack();else if(a==="pick")openPickNext();
}
$("#studyView").addEventListener("click",e=>{const b=e.target.closest("[data-act]");if(b)studyAct(b.dataset.act)});

/* ---------- boot ---------- */
history.replaceState({view:"home"},"");
(async()=>{
  await DB.open();songs=await DB.all();
  cards=new Map((await DB.all("cards")).map(c=>[c.w,c]));
  metaRecs=new Map((await DB.all("meta")).map(m=>[m.key,m]));
  await upgradeData();
  syncDev();
  if(!metaRecs.has("daily"))await saveDaily(getDaily());
  // 申请持久存储：手机空间紧张时浏览器不会自动清掉 App 的数据
  try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist().catch(()=>{})}catch(e){}
  processCheckin();syncSkin();booted=true;checkUnlocks();
  renderHome();renderDbgShell();renderDbg();renderSim();
  hideSplash();maybeA2hs();
  setTimeout(()=>prefetchVoice([...LESSONS.TONE_SETS.flatMap(t=>[1,2,3,4,5,6].map(k=>t.syl+k)),...[...cards.values()].map(c=>c.jp)]),3000);
})();
// iOS 切到后台再回来，声音会被暂停：下一次点按时恢复
document.addEventListener("click",()=>{if(actx&&actx.state!=="running")actx.resume().catch(()=>{})},true);
if("serviceWorker" in navigator&&location.protocol==="https:")navigator.serviceWorker.register("sw.js").catch(()=>{});
})();
</script>
