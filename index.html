<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>唱学粤语</title>
<meta name="theme-color" content="#F7F6FB" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#15131F" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="唱学粤语">
<style>
/* Outfit 字体自带（OFL，见 fonts/OFL.txt），只用于粤拼、数字、时间 */
@font-face{font-family:"Outfit";font-weight:500;font-display:swap;src:url(fonts/outfit-500.woff2) format("woff2")}
@font-face{font-family:"Outfit";font-weight:600;font-display:swap;src:url(fonts/outfit-600.woff2) format("woff2")}
@font-face{font-family:"Outfit";font-weight:700;font-display:swap;src:url(fonts/outfit-700.woff2) format("woff2")}
/* 「丁香」设计变量（docs/设计规范.md）。组件里只用变量，不写颜色值 */
:root{
  --bg:#F7F6FB; --surface:#FFFFFF; --surface-press:#F1EFFA; --ink:#221F33; --ink-2:#45405C; --muted:#6E6A82; --rule:#E2DFEE;
  --accent:#5B4BDB; --accent-press:#4536B8; --accent-soft:#ECE9FD; --on-accent:#FFFFFF;
  --inverse:#221F33; --on-inverse:#FFFFFF; --seg-current:#B7AEF2; --danger:#C2413A; --on-accent-veil:rgba(255,255,255,.14);
  --t1:#D9443B; --t2:#C67312; --t3:#2B8A56; --t4:#2F6BD6; --t5:#8A4FD8; --t6:#0F7F8E;
  --sq1-bg:#ECE9FD; --sq1-ink:#5B4BDB; --sq2-bg:#FDEDE3; --sq2-ink:#C2581A; --sq3-bg:#E3F4EA; --sq3-ink:#2B8A56; --sq4-bg:#E5EEFC; --sq4-ink:#2F6BD6;
  --shadow-1:0 2px 10px rgba(34,31,51,.05); --shadow-2:0 10px 30px rgba(34,31,51,.08); --shadow-3:0 12px 34px rgba(34,31,51,.12); --cur-glow:0 8px 24px rgba(91,75,219,.14);
  --shadow-sheet:0 -8px 40px rgba(34,31,51,.18),0 0 0 1px var(--rule); --shadow-menu:var(--shadow-3);
  --font-cjk:-apple-system,"PingFang HK","PingFang SC","Noto Sans CJK TC","Microsoft JhengHei",sans-serif;
  --font-latin:"Outfit",var(--font-cjk);
  --dur-fast:120ms; --dur:220ms; --dur-slow:320ms; --ease:cubic-bezier(.2,.8,.2,1); --nav-dim:rgba(0,0,0,.10);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#15131F; --surface:#1F1C2C; --surface-press:#2A2640; --ink:#F1EFF8; --ink-2:#CFCBE0; --muted:#9C97B3; --rule:#2E2A42;
  --accent:#8E80FF; --accent-press:#A79CFF; --accent-soft:#2B2550; --on-accent:#14112A;
  --inverse:#F1EFF8; --on-inverse:#15131F; --seg-current:#5A4FB0; --danger:#FF8A80; --on-accent-veil:rgba(20,17,42,.12);
  --t1:#FF7A70; --t2:#FFB547; --t3:#5FD38D; --t4:#6FA8FF; --t5:#B794FF; --t6:#4CC9DB;
  --sq1-bg:#2B2550; --sq1-ink:#A79CFF; --sq2-bg:#3A2618; --sq2-ink:#FFB27A; --sq3-bg:#17311F; --sq3-ink:#5FD38D; --sq4-bg:#182640; --sq4-ink:#6FA8FF;
  --shadow-1:none; --shadow-2:none; --shadow-3:none; --cur-glow:0 0 0 transparent; --shadow-sheet:0 -8px 40px rgba(0,0,0,.5),0 0 0 1px var(--rule);
  --shadow-menu:0 12px 34px rgba(0,0,0,.5),0 0 0 1px var(--rule);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#15131F; --surface:#1F1C2C; --surface-press:#2A2640; --ink:#F1EFF8; --ink-2:#CFCBE0; --muted:#9C97B3; --rule:#2E2A42;
  --accent:#8E80FF; --accent-press:#A79CFF; --accent-soft:#2B2550; --on-accent:#14112A;
  --inverse:#F1EFF8; --on-inverse:#15131F; --seg-current:#5A4FB0; --danger:#FF8A80; --on-accent-veil:rgba(20,17,42,.12);
  --t1:#FF7A70; --t2:#FFB547; --t3:#5FD38D; --t4:#6FA8FF; --t5:#B794FF; --t6:#4CC9DB;
  --sq1-bg:#2B2550; --sq1-ink:#A79CFF; --sq2-bg:#3A2618; --sq2-ink:#FFB27A; --sq3-bg:#17311F; --sq3-ink:#5FD38D; --sq4-bg:#182640; --sq4-ink:#6FA8FF;
  --shadow-1:none; --shadow-2:none; --shadow-3:none; --cur-glow:0 0 0 transparent; --shadow-sheet:0 -8px 40px rgba(0,0,0,.5),0 0 0 1px var(--rule);
  --shadow-menu:0 12px 34px rgba(0,0,0,.5),0 0 0 1px var(--rule);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100dvh;background:var(--bg);color:var(--ink);font-family:var(--font-cjk);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:720px;margin:0 auto}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button,a,label,input,textarea,select,[role=button]{touch-action:manipulation}
button:focus-visible,input:focus-visible,textarea:focus-visible,[role=button]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.t1{color:var(--t1)}.t2{color:var(--t2)}.t3{color:var(--t3)}.t4{color:var(--t4)}.t5{color:var(--t5)}.t6{color:var(--t6)}
.num,.jp{font-family:var(--font-latin);font-variant-numeric:tabular-nums}

/* 按钮：白色（默认）/ primary 主色 / inverse 深色 / soft 浅色 / text 文字 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:48px;padding:10px 18px;border-radius:16px;
  background:var(--surface);color:var(--ink);box-shadow:var(--shadow-1);font-size:16px;font-weight:600;line-height:1.2;text-align:center;
  transition:transform var(--dur-fast) var(--ease),background-color var(--dur-fast) var(--ease)}
.btn.is-pressed{transform:scale(.97);background:var(--surface-press)}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.primary.is-pressed{background:var(--accent-press)}
.btn.inverse{background:var(--inverse);color:var(--on-inverse)}
.btn.inverse.is-pressed{background:var(--ink-2)}
.btn.soft{background:var(--accent-soft);color:var(--accent);box-shadow:none}
.btn.soft.is-pressed{background:var(--surface-press)}
.btn.text{background:none;color:var(--muted);box-shadow:none}
.btn.text.is-pressed{background:none}
.btn.danger{color:var(--danger)}
.btn.danger-fill{background:var(--danger);color:var(--on-accent)}
.btn.danger-fill.is-pressed{background:var(--danger);opacity:.85}
.btn.small{min-height:44px;padding:8px 14px;border-radius:12px;font-size:15px}
.btn.block{display:flex;width:100%}
.btn.bottom{min-height:56px;border-radius:18px;font-size:17px}
.btn.icon{width:44px;min-height:44px;padding:0;border-radius:16px}
.btn:disabled{opacity:.45;cursor:default;transform:none}
.muted{color:var(--muted)}
.label{font-size:13px;color:var(--muted);font-weight:600}
input[type=text],textarea{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--surface);border:0;border-radius:14px;
  padding:12px 14px;box-shadow:var(--shadow-1),inset 0 0 0 1px var(--rule)}
input[type=text]:focus{outline:none;box-shadow:0 0 0 2px var(--accent)}
/* 输入框固定 7 行高，超出的在框里滚动；clip-path 保证文字不会画到框外（iPhone 上见过露出半行） */
textarea{display:block;height:calc(1.6em * 7 + 28px);padding:14px 16px;resize:none;overflow-y:auto;line-height:1.6;clip-path:inset(0 round 14px)}
textarea:focus{outline:none;box-shadow:inset 0 0 0 2px var(--accent)}
svg{display:block}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{transition-property:opacity!important;animation:none!important;scroll-behavior:auto!important}
  .is-pressed{transform:none!important}
  /* 减弱动态效果：播放条只淡入淡出 */
  .player.bar-in{animation:barFade var(--dur) var(--ease) both!important}
}

/* Home（首页左右边距 20px） */
.wrap.home{padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.home-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:calc(env(safe-area-inset-top,0px) + 28px);padding-bottom:22px}
.brand{font-weight:700;font-size:30px;margin:0;line-height:1.1}
/* 首页「今天的学习」卡片（设计规范 5.4） */
.today{background:var(--accent);color:var(--on-accent);border-radius:28px;padding:20px;margin-bottom:22px;box-shadow:var(--shadow-2)}
.today-head{font-size:17px;font-weight:700;margin-bottom:14px}
.today-cell{background:var(--on-accent-veil);border-radius:20px;padding:12px 16px}
.today-cell .lbl{display:block;font-size:13px;font-weight:600;opacity:.85}
.today .big{font-size:28px;font-weight:700;margin-right:4px}
.today-sub{font-size:13px;line-height:1.6;margin:12px 0 14px;opacity:.85}
.today .today-btn{width:100%;min-height:50px;background:var(--surface);color:var(--accent);font-size:16px}
.today .today-btn.is-pressed{background:var(--surface-press)}
.today-picks{display:flex;flex-direction:column;gap:8px}
.today-picks .today-btn{justify-content:flex-start;min-height:48px;font-size:15px;color:var(--ink)}
.sec-title{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px;font-size:15px;font-weight:600}
.sec-title .jp{font-weight:600}
.tones{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-bottom:22px}
/* 声调键帽（设计规范 5.2）：像实体按键，两层。底座（声调色）固定不动，平时露出键面下方 4px；
   按下时只有键面往下移 4px 盖住底座。按钮本身不移动，也不用 box-shadow 画底边 */
.tones .key{--tone:var(--muted);position:relative;height:66px;padding:0;border:0;background:none}
.tones .key-base{position:absolute;left:0;right:0;top:4px;bottom:0;border-radius:18px;background:var(--tone)}
.tones .key-face{position:absolute;left:0;right:0;top:0;bottom:4px;border-radius:18px;background:var(--surface);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  transition:transform 100ms var(--ease),background-color 100ms var(--ease)}
.tones .key.is-pressed .key-face{transform:translateY(4px);background:var(--surface-press)}
.tones .key .hz{font-size:22px;font-weight:600;line-height:1.1}
.tones .key .jp{font-size:12px;font-weight:600;color:var(--tone)}
.tones .key .hz,.tones .key .jp{transition:opacity var(--dur) var(--ease)}
.tones .key.fade .hz,.tones .key.fade .jp{opacity:0}
#btnToneNext.spin svg{animation:spin 400ms var(--ease)}
@keyframes spin{to{transform:rotate(360deg)}}
.songs{display:flex;flex-direction:column;gap:10px;padding-bottom:calc(110px + env(safe-area-inset-bottom,0px))}
.song{display:flex;align-items:center;gap:14px;padding:14px;border-radius:22px;background:var(--surface);box-shadow:var(--shadow-1);text-align:left;width:100%;
  cursor:pointer;transition:transform var(--dur-fast) var(--ease),background-color var(--dur-fast) var(--ease)}
.song.is-pressed{transform:scale(.98);background:var(--surface-press)}
.song .sq{flex:none;width:56px;height:56px;border-radius:18px;display:grid;place-items:center;font-size:24px;font-weight:700;background:var(--sq-bg);color:var(--sq-ink)}
.song .meta{flex:1;min-width:0}
.song .ttl{font-weight:600;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.song .sub{font-size:13px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* 多选删除：勾选框、选中的卡片、撤销提示条 */
.song .check{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;box-shadow:inset 0 0 0 2px var(--rule);color:var(--on-accent);transition:background-color var(--dur-fast) var(--ease)}
.song .check svg{opacity:0}
.song.selected{box-shadow:0 0 0 2px var(--accent),var(--cur-glow)}
.song.selected .check{background:var(--accent);box-shadow:none}
.song.selected .check svg{opacity:1}
#btnSelect{min-height:44px;margin:-10px -14px -10px 0}
.snack{position:fixed;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));bottom:calc(96px + env(safe-area-inset-bottom,0px));z-index:21;max-width:520px;margin:0 auto;
  display:flex;align-items:center;justify-content:space-between;gap:12px;padding:4px 6px 4px 18px;border-radius:18px;background:var(--inverse);color:var(--on-inverse);font-size:15px;box-shadow:var(--shadow-3)}
.snack .btn.text{color:var(--on-inverse);font-weight:700;text-decoration:underline;text-underline-offset:3px}
.chip{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);margin-right:4px}
.empty{padding:22px;border-radius:22px;background:var(--surface);box-shadow:var(--shadow-1)}
.empty ol{margin:10px 0 16px;padding-left:20px;display:grid;gap:6px;color:var(--ink-2);font-size:14px;line-height:1.6}
.fab{position:fixed;right:max(20px,env(safe-area-inset-right,0px));bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:20;
  min-height:56px;padding:0 24px;border-radius:999px;box-shadow:var(--shadow-3)}

/* 页面切换：前进时新页从右边滑入，旧页往左移并变暗；返回反过来 */
body > section{position:relative;background:var(--bg);min-height:100dvh}
.nav-layer{position:fixed!important;left:0;right:0;pointer-events:none}
.enter-fwd{animation:enterFwd var(--dur-slow) var(--ease) both}
.leave-fwd{animation:leaveFwd var(--dur-slow) var(--ease) both}
.enter-back{animation:enterBack var(--dur-slow) var(--ease) both}
.leave-back{animation:leaveBack var(--dur-slow) var(--ease) both}
@keyframes enterFwd{from{transform:translateX(30%);opacity:0}to{transform:none;opacity:1}}
@keyframes leaveFwd{from{transform:none}to{transform:translateX(-8%)}}
@keyframes enterBack{from{transform:translateX(-8%)}to{transform:none}}
/* 变暗用一层半透明遮罩（不用 filter：iPhone 上 filter 每一帧都要重画整页，会卡） */
.leave-fwd::after,.enter-back::after{content:"";position:absolute;inset:0;z-index:30;background:var(--nav-dim);pointer-events:none;animation:dimIn var(--dur-slow) var(--ease) both}
.enter-back::after{animation-name:dimOut}
@keyframes dimIn{from{opacity:0}to{opacity:1}}
@keyframes dimOut{from{opacity:1}to{opacity:0}}
@keyframes leaveBack{from{transform:none;opacity:1}to{transform:translateX(30%);opacity:0}}
body.navigating .player,body.navigating .fab,body.navigating .bottom-bar{opacity:0;transition:none}
/* 浮动播放条：页面滑入后从下方滑入并淡入（带一点回弹）；返回时没有消失动画，跟着切页直接隐藏 */
.player.bar-in{animation:barIn var(--dur-slow) var(--ease) both}
@keyframes barIn{0%{transform:translateY(120%);opacity:0}70%{transform:translateY(-6px);opacity:1}100%{transform:none;opacity:1}}
@keyframes barFade{from{opacity:0}to{opacity:1}}
.fab,.bottom-bar{transition:transform var(--dur-fast) var(--ease),background-color var(--dur-fast) var(--ease),opacity var(--dur) var(--ease)}

/* Top bar：不透明，避免 iOS 顶部模糊 */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg)}
.bar .wrap{display:flex;align-items:center;gap:10px;min-height:64px}
.bar .tt{flex:1;min-width:0}
.bar .tt b{display:block;font-size:17px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .tt span{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Lyrics：当前句白卡片 + 紫色描边，其他句 .6 透明度 */
.banner{margin-top:8px;padding:12px 14px;border-radius:18px;background:var(--accent-soft);color:var(--ink-2);font-size:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.lyrics{padding-block:10px calc(230px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:6px}
.line{position:relative;padding:22px 14px 12px;border-radius:22px;opacity:.6;
  transition:opacity var(--dur) var(--ease),background-color var(--dur) var(--ease),box-shadow var(--dur) var(--ease)}
.line.cur{opacity:1;background:var(--surface);box-shadow:0 0 0 2px var(--accent),var(--cur-glow)}
.line .ln{position:absolute;left:6px;top:0;height:44px;min-width:44px;padding:4px 8px 0;display:flex;align-items:flex-start;
  font-family:var(--font-latin);font-size:12px;font-weight:500;color:var(--muted);font-variant-numeric:tabular-nums}
.line.cur .ln{color:var(--accent);font-weight:600}
.line.loop .ln::after{content:" ↻";white-space:pre;color:var(--accent)}
.chars{position:relative;z-index:1;display:flex;flex-wrap:wrap;row-gap:6px;align-items:flex-end}
.grp{display:inline-flex;flex-wrap:nowrap;align-items:flex-end}
.c{display:inline-flex;flex-direction:column;align-items:center;padding:0 1px;border-radius:8px;min-width:1.15em}
.c .jp{font-size:12px;font-weight:600;line-height:16px;height:16px;white-space:nowrap}
.c .hz{font-size:22px;font-weight:500;line-height:1.3;transition:font-size var(--dur) var(--ease)}
.line.cur .c .hz{font-size:26px;font-weight:700}
.c.key .hz{text-decoration:underline wavy var(--accent);text-decoration-thickness:1.5px;text-underline-offset:6px}
.c.ov .jp{text-decoration:underline dotted}
.c.sel{background:var(--accent-soft)}
.c.punct .hz{color:var(--muted)}
.sp{width:.7em}
.summary{margin-top:8px;padding:14px 16px;border-radius:22px;background:var(--surface);box-shadow:var(--shadow-1);font-size:14px;line-height:1.6;color:var(--ink-2)}
.summary .label{display:block;margin-bottom:4px}
.hide-jp .c .jp{display:none}

/* 浮动播放条 */
.player{position:fixed;left:max(14px,env(safe-area-inset-left,0px));right:max(14px,env(safe-area-inset-right,0px));bottom:calc(30px + env(safe-area-inset-bottom,0px));
  z-index:25;max-width:700px;margin:0 auto;padding:12px 16px 10px;border-radius:30px;background:var(--surface);box-shadow:var(--shadow-3);
  display:flex;flex-direction:column;gap:8px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .player{box-shadow:0 0 0 1px var(--rule)}}
:root[data-theme="dark"] .player{box-shadow:0 0 0 1px var(--rule)}
.player .wrap{padding:0;display:flex;flex-direction:column;gap:8px;width:100%}
.prog{display:flex;align-items:center;gap:10px;font-family:var(--font-latin);font-size:12px;font-weight:500;color:var(--muted);font-variant-numeric:tabular-nums}
.prog input{flex:1;min-width:0;height:20px;margin:0;background:transparent;-webkit-appearance:none;appearance:none}
.prog input::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:linear-gradient(to right,var(--accent) var(--p,0%),var(--accent-soft) var(--p,0%))}
.prog input::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;margin-top:-4px;border-radius:50%;background:var(--accent);border:0}
.prog input::-moz-range-track{height:6px;border-radius:3px;background:var(--accent-soft)}
.prog input::-moz-range-progress{height:6px;border-radius:3px;background:var(--accent)}
.prog input::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:var(--accent);border:0}
.ctrls{display:flex;align-items:center;justify-content:space-between;gap:4px}
.ib{width:48px;height:48px;display:grid;place-items:center;border-radius:16px;color:var(--ink);transition:transform var(--dur-fast) var(--ease),background-color var(--dur-fast) var(--ease)}
.ib.is-pressed{transform:scale(.94);background:var(--surface-press)}
.ib.on{color:var(--accent);background:var(--accent-soft)}
.ib.play{width:58px;height:58px;border-radius:20px;background:var(--accent);color:var(--on-accent)}
.ib.play.is-pressed{background:var(--accent-press)}
.ib.rate{width:auto;min-width:56px;padding:0 10px;font-family:var(--font-latin);font-size:16px;font-weight:600;font-variant-numeric:tabular-nums}

/* Import + sync：每一步是一张白卡片，保存按钮固定在底部 */
.form{display:flex;flex-direction:column;gap:12px;padding-block:6px calc(110px + env(safe-area-inset-bottom,0px))}
.card{background:var(--surface);border-radius:22px;box-shadow:var(--shadow-1);padding:16px;scroll-margin-top:calc(env(safe-area-inset-top,0px) + 76px);transition:box-shadow var(--dur) var(--ease)}
.card.need{box-shadow:0 0 0 2px var(--accent),var(--cur-glow)}
.field{display:flex;flex-direction:column;gap:10px}
.seg{display:flex;gap:8px}
.seg .btn{flex:1}
.stepper{display:flex;align-items:center;justify-content:center;gap:16px;margin-top:4px}
.stepper .btn{font-size:22px;font-weight:600}
#goalNum{min-width:48px;text-align:center;font-size:28px;font-weight:700}
.field > textarea + .note{margin-top:4px}
.field > .note:empty{display:none}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row > *{min-width:0}
.filebox{display:flex;align-items:center;gap:12px;padding:12px;border-radius:18px;border:2px dashed var(--rule);cursor:pointer}
.filebox input{position:absolute;opacity:0;width:1px;height:1px}
.filebox .btn{flex:none;white-space:nowrap}
.note{font-size:13px;color:var(--muted);line-height:1.6}
.ok{color:var(--t3);font-weight:600}
.err{color:var(--t1);font-weight:600}
.results{display:flex;flex-direction:column;gap:8px}
.res{display:flex;justify-content:space-between;gap:8px;min-height:56px;padding:12px 14px;border-radius:18px;background:var(--bg);text-align:left;width:100%;
  transition:transform var(--dur-fast) var(--ease),background-color var(--dur-fast) var(--ease)}
.res.is-pressed{transform:scale(.98);background:var(--surface-press)}
.res b{font-weight:600}
.bottom-bar{position:fixed;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:20;max-width:688px;margin:0 auto}
.sync-list{display:flex;flex-direction:column;gap:6px;padding-block:10px calc(240px + env(safe-area-inset-bottom,0px))}
.sl{display:flex;gap:12px;padding:14px;border-radius:22px;font-size:18px;opacity:.6;transition:opacity var(--dur) var(--ease),box-shadow var(--dur) var(--ease)}
.sl .tm{font-family:var(--font-latin);font-size:12px;font-weight:500;color:var(--muted);width:46px;flex:none;padding-top:5px;font-variant-numeric:tabular-nums}
.sl.next{opacity:1;background:var(--surface);box-shadow:0 0 0 2px var(--accent),var(--cur-glow)}
.sl.done{opacity:.6}
.tapbig{flex:1;min-height:56px;font-size:17px;border-radius:18px}

/* 编辑歌曲（原「校对歌词」） */
.proof{display:flex;flex-direction:column;gap:10px;padding-block:6px calc(200px + env(safe-area-inset-bottom,0px))}
.shift-card{display:flex;align-items:center;gap:12px}
.sc-txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.sc-txt b{font-size:15px;font-weight:700}
.sc-ctl{display:flex;align-items:center;gap:8px}
.sc-ctl .btn{font-size:22px;font-weight:600}
#shiftVal{min-width:56px;text-align:center;font-weight:600}
.pl-list{display:flex;flex-direction:column;gap:10px}
.pl{background:var(--surface);border-radius:22px;box-shadow:var(--shadow-1);transition:box-shadow var(--dur) var(--ease)}
.pl.open{box-shadow:0 0 0 2px var(--accent),var(--cur-glow)}
.pl-head{display:flex;gap:14px;align-items:baseline;width:100%;min-height:56px;padding:16px;text-align:left}
.pl-time{flex:none;min-width:48px;font-family:var(--font-latin);font-size:13px;font-weight:500;color:var(--muted);font-variant-numeric:tabular-nums}
.pl.open .pl-time{color:var(--accent);font-weight:600}
.pl-txt{font-size:17px;min-width:0}
.pl-body{padding:0 16px 16px;display:flex;flex-direction:column;gap:10px}
.pl-nudge{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.pl-nudge .btn{padding:8px 0;font-family:var(--font-latin);font-weight:600}
.pl-act,.pl-ops{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.audio-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.audio-row .note{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.audio-row .btn{flex:none;position:relative}
.ctrls.solo{justify-content:center}
#prPlay .i-pause,#prPlay.playing .i-play{display:none}
#prPlay.playing .i-pause{display:block}

/* Sheet：从下面滑上来，可以往下拖关闭。
   弹出层不使用暗幕（设计规范 5.6）：Safari 的状态栏由它自己画，网页变暗时状态栏跟不上，会闪或者不协调。
   所以弹层后面不变暗，靠更明显的阴影 --shadow-sheet 浮在页面上；点外面关闭（确认类弹窗必须点按钮） */
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-width:720px;margin:0 auto;background:var(--surface);border-radius:34px 34px 0 0;
  max-height:88dvh;overflow:auto;overscroll-behavior-y:contain;box-shadow:var(--shadow-sheet);padding-bottom:env(safe-area-inset-bottom,0px);
  transform:translateY(100%);opacity:0;transition:transform var(--dur-slow) var(--ease),opacity var(--dur-slow) var(--ease)}
.sheet.open{transform:none;opacity:1}
.sheet.dragging{transition:none}
.sheet .wrap{padding-block:10px 24px;display:flex;flex-direction:column;gap:14px}
.grab{width:40px;height:5px;border-radius:3px;background:var(--rule);margin:2px auto 4px;flex:none}
.sheet h3{margin:0;font-size:17px;font-weight:700}
/* 下拉小菜单（设计规范 5.9）：挂在吸顶顶栏里，absolute 不是 fixed（顶部附近不能有带颜色的 fixed 元素，见 7.4），从「⋯」按钮的位置缩放淡入 */
.bar .wrap{position:relative}
.menu{position:absolute;z-index:30;min-width:200px;padding:6px;border-radius:16px;background:var(--surface);box-shadow:var(--shadow-menu);
  display:flex;flex-direction:column;transform-origin:top right;transform:scale(.92);opacity:0;
  transition:transform 180ms var(--ease),opacity 180ms var(--ease)}
.menu.open{transform:none;opacity:1}
.menu .btn{justify-content:flex-start;min-height:48px;border-radius:12px;background:none;box-shadow:none;font-weight:500}
.menu .btn.is-pressed{transform:none;background:var(--surface-press)}
.wc-top{display:flex;gap:16px;align-items:center}
.wc-top.long{flex-direction:column;align-items:stretch}
.wc-square{flex:none;display:flex;flex-wrap:wrap;max-width:100%;gap:6px;padding:16px 18px;border-radius:28px;background:var(--accent-soft)}
.wc-ch{display:flex;flex-direction:column;align-items:center;cursor:pointer}
.wc-ch .jp{font-size:20px;font-weight:700;line-height:1.2}
.wc-ch .hz{font-size:56px;font-weight:700;line-height:1.1}
.wc-side{display:flex;flex-direction:column;gap:8px;min-width:0}
.wc-mean{font-size:22px;font-weight:600;line-height:1.3}
.wc-tags{display:flex;flex-wrap:wrap;gap:6px}
.tone-tag{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;color:var(--tc);background:color-mix(in srgb,var(--tc) 12%,transparent)}
.wc-tip,.tip{padding:12px 14px;border-radius:18px;background:var(--accent-soft);color:var(--ink-2);font-size:14px;line-height:1.6}
.wc-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn.add-dashed{min-height:56px;border-radius:18px;background:none;box-shadow:none;color:var(--accent);border:2px dashed color-mix(in srgb,var(--accent) 40%,transparent)}
.btn.add-dashed.is-pressed{background:var(--accent-soft)}
.wc-known{min-height:56px;display:flex;align-items:center;justify-content:center;border-radius:18px;background:var(--bg);color:var(--muted);font-size:15px;font-weight:600}
.mean{font-size:17px}
.warn{padding:12px 14px;border-radius:18px;background:var(--accent-soft);color:var(--ink-2);font-size:13px;line-height:1.6}
.cands{display:flex;gap:6px;flex-wrap:wrap}
.cand{font-family:var(--font-latin);font-weight:600;font-size:15px;min-height:40px;padding:6px 12px;border-radius:12px;background:var(--bg)}
.cand[aria-pressed="true"]{background:var(--accent-soft);box-shadow:0 0 0 2px var(--accent)}
.steps{display:grid;gap:10px;counter-reset:s;margin:0;padding:0;list-style:none}
.steps li{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start}
.steps li::before{counter-increment:s;content:counter(s);width:24px;height:24px;border-radius:50%;background:var(--accent);color:var(--on-accent);font-family:var(--font-latin);display:grid;place-items:center;font-size:13px;font-weight:700;margin-top:1px}
.msgs{font-size:13px;display:grid;gap:4px;max-height:180px;overflow:auto}

.toast{position:fixed;left:50%;bottom:calc(160px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--inverse);color:var(--on-inverse);padding:12px 18px;border-radius:18px;font-size:14px;max-width:min(90vw,420px);text-align:center;box-shadow:var(--shadow-3)}
</style>
</head>
<body>

<audio id="au" preload="auto" playsinline></audio>

<!-- HOME -->
<section id="home">
  <div class="wrap home">
    <header class="home-head">
      <h1 class="brand">唱学粤语</h1>
      <button class="btn soft small" id="btnDone" type="button" hidden>完成</button>
      <button class="btn soft icon" id="btnSettings" type="button" aria-label="设置"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
    </header>
    <div id="today" hidden></div>
    <div class="sec-title"><span>六个声调 · <span class="jp" id="toneSyl">si</span></span><button class="btn soft small" id="btnToneNext" type="button"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v5h-5"/></svg>换一组</button></div>
    <div class="tones" id="tones"></div>
    <div class="sec-title"><span>我的歌</span><button class="btn text small" id="btnSelect" type="button" hidden>选择</button></div>
    <div class="songs" id="songs"></div>
  </div>
  <button class="btn inverse fab" id="btnAdd" type="button">＋ 导入新歌</button>
  <button class="btn danger-fill bottom bottom-bar" id="btnDelSel" type="button" hidden>删除（0）</button>
  <div class="snack" id="snack" hidden role="status"><span id="snackMsg"></span><button class="btn text small" id="snackUndo" type="button">撤销</button></div>
</section>

<!-- IMPORT -->
<section id="importView" hidden>
  <div class="bar"><div class="wrap">
    <button class="btn icon back" data-back type="button" aria-label="返回"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
    <div class="tt"><b>导入新歌</b><span>音频 + 歌词</span></div>
  </div></div>
  <div class="wrap form">
    <div class="field card">
      <div class="label">1 · 音频文件</div>
      <label class="filebox" for="fAudio">
        <input id="fAudio" type="file" accept="audio/*,.mp3,.m4a,.aac,.wav">
        <span class="btn soft small">选择音频</span>
        <span id="audioInfo" class="note">mp3 或 m4a。音乐 App 下载的加密文件不能用。</span>
      </label>
    </div>
    <div class="field card">
      <div class="label">2 · 歌名和歌手</div>
      <input id="fTitle" type="text" placeholder="歌名，例如：富士山下" autocomplete="off">
      <input id="fArtist" type="text" placeholder="歌手，例如：陳奕迅" autocomplete="off">
    </div>
    <div class="field card">
      <div class="label">3 · 歌词</div>
      <div class="row">
        <button class="btn soft small" id="btnSearch" type="button">在线搜索歌词</button>
        <label class="btn soft small" for="fLrc">选择 .lrc 文件<input id="fLrc" type="file" accept=".lrc,.txt,text/plain" style="position:absolute;opacity:0;width:1px;height:1px"></label>
      </div>
      <div id="searchOut" class="results"></div>
      <textarea id="fLyrics" placeholder="或者直接粘贴歌词。&#10;带时间轴的 LRC 格式，例如：[00:21.71] 第一句歌词&#10;没有时间轴的纯文本也可以，保存后边听边点来对齐。"></textarea>
      <div id="lyricsInfo" class="note"></div>
    </div>
    <button class="btn primary bottom bottom-bar" id="btnSave" type="button">保存</button>
  </div>
</section>

<!-- TAP SYNC -->
<section id="syncView" hidden>
  <div class="bar"><div class="wrap">
    <button class="btn icon back" data-back type="button" aria-label="返回"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
    <div class="tt"><b>打轴</b><span>每句歌词开始唱时，点一下大按钮</span></div>
  </div></div>
  <div class="wrap"><div class="sync-list" id="syncList"></div></div>
  <div class="player"><div class="wrap">
    <div class="prog"><span id="sCur">0:00</span><input id="sSeek" type="range" min="0" max="1" step="0.01" value="0" aria-label="播放进度"><span id="sDur">0:00</span></div>
    <div class="row" style="flex-wrap:nowrap">
      <button class="btn soft small" id="sPlay" type="button" style="flex:none">播放</button>
      <button class="btn soft small" id="sUndo" type="button" style="flex:none">撤销</button>
      <button class="btn primary tapbig" id="sTap" type="button">第 1 句开始</button>
    </div>
  </div></div>
</section>

<!-- PLAYER -->
<section id="playerView" hidden>
  <div class="bar"><div class="wrap">
    <button class="btn icon back" data-back type="button" aria-label="返回"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
    <div class="tt"><b id="pTitle"></b><span id="pArtist"></span></div>
    <button class="btn soft small" id="togJp" type="button" aria-pressed="true">粤拼 开</button>
    <button class="btn icon" id="btnMenu" type="button" aria-label="更多" aria-haspopup="menu" aria-expanded="false"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg></button>
    <div class="menu" id="songMenu" role="menu" hidden>
      <button class="btn" type="button" role="menuitem" data-menu="current">设为正在学</button>
      <button class="btn" type="button" role="menuitem" data-menu="proof">编辑歌曲</button>
      <button class="btn" type="button" role="menuitem" data-menu="pack">词汇包</button>
      <button class="btn danger" type="button" role="menuitem" data-menu="del">删除</button>
    </div>
  </div></div>
  <div class="wrap">
    <div id="pBanner"></div>
    <div id="pSummary"></div>
    <div class="lyrics" id="lyrics"></div>
  </div>
  <div class="player">
    <div class="prog"><span id="pCur">0:00</span><input id="pSeek" type="range" min="0" max="1" step="0.01" value="0" aria-label="播放进度"><span id="pDur">0:00</span></div>
    <div class="ctrls">
      <button class="ib" id="bLoop" type="button" aria-label="单句循环" title="单句循环"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 2l4 4-4 4"/><path d="M3 11V9a3 3 0 0 1 3-3h15"/><path d="M7 22l-4-4 4-4"/><path d="M21 13v2a3 3 0 0 1-3 3H3"/></svg></button>
      <button class="ib" id="bPrev" type="button" aria-label="上一句"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg></button>
      <button class="ib play" id="bPlay" type="button" aria-label="播放"><svg id="icPlay" width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg><svg id="icPause" width="24" height="24" viewBox="0 0 24 24" fill="currentColor" style="display:none"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg></button>
      <button class="ib" id="bNext" type="button" aria-label="下一句"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg></button>
      <button class="ib rate" id="bRate" type="button" aria-label="播放速度">1×</button>
    </div>
  </div>
</section>

<!-- PROOF -->
<section id="proofView" hidden>
  <div class="bar"><div class="wrap">
    <button class="btn icon back" data-back type="button" aria-label="返回"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
    <div class="tt"><b>编辑歌曲</b><span id="prSong"></span></div>
    <button class="btn primary small" id="proofSave" type="button">保存</button>
  </div></div>
  <div class="wrap proof">
    <div class="card field">
      <div class="label">歌名和歌手</div>
      <input id="prTitle" type="text" placeholder="歌名" autocomplete="off">
      <input id="prArtist" type="text" placeholder="歌手" autocomplete="off">
      <div class="label">音频</div>
      <div class="audio-row"><span id="prAudioInfo" class="note"></span><label class="btn soft small" for="prAudio">更换音频<input id="prAudio" type="file" accept="audio/*,.mp3,.m4a,.aac,.wav" style="position:absolute;opacity:0;width:1px;height:1px"></label></div>
      <div class="note">换音频时歌词、时间轴和学习进度都保留。</div>
    </div>
    <div class="card shift-card">
      <div class="sc-txt"><b>整首歌一起挪</b><span class="note">歌词整体比歌声早或晚时用</span></div>
      <div class="sc-ctl"><button class="btn soft icon" id="shiftMinus" type="button" aria-label="整首往前 0.2 秒">−</button><span id="shiftVal" class="num">0.0s</span><button class="btn soft icon" id="shiftPlus" type="button" aria-label="整首往后 0.2 秒">+</button></div>
    </div>
    <div class="pl-list" id="proofList"></div>
  </div>
  <div class="player">
    <div class="prog"><span id="prCur">0:00</span><input id="prSeek" type="range" min="0" max="1" step="0.01" value="0" aria-label="播放进度"><span id="prDur">0:00</span></div>
    <div class="ctrls solo"><button class="ib play" id="prPlay" type="button" aria-label="播放/暂停"><svg class="i-play" width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg><svg class="i-pause" width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg></button></div>
  </div>
</section>

<!-- SETTINGS -->
<section id="settingsView" hidden>
  <div class="bar"><div class="wrap">
    <button class="btn icon back" data-back type="button" aria-label="返回"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
    <div class="tt"><b>设置</b></div>
  </div></div>
  <div class="wrap form">
    <div class="card field">
      <div class="label">每天新学几句</div>
      <div class="seg" id="goalSeg"></div>

/* ---------- toast ---------- */

/* ---------- storage (IndexedDB, falls back to memory) ---------- */
// v2: songs + cards（记忆卡片）+ meta（杂项）。升级只加表，绝不动 songs
const STORES={songs:"id",cards:"w",meta:"key"};
const DB={db:null,mem:{songs:new Map(),cards:new Map(),meta:new Map()},ok:false,
  open(){return new Promise(res=>{try{const r=indexedDB.open("yuechang",2);
    r.onupgradeneeded=()=>{const db=r.result;for(const [name,keyPath] of Object.entries(STORES))if(!db.objectStoreNames.contains(name))db.createObjectStore(name,{keyPath})};
    r.onsuccess=()=>{this.db=r.result;this.db.onversionchange=()=>this.db.close();this.ok=true;res()};r.onerror=()=>res();
    r.onblocked=()=>toast("请先关闭其他打开着的唱学粤语页面",6000)}catch(e){res()}})},
  _st(store,m){return this.db.transaction(store,m).objectStore(store)},
  all(store="songs"){const mem=this.mem[store];if(!this.ok)return Promise.resolve([...mem.values()]);return new Promise(res=>{try{const r=this._st(store,"readonly").getAll();r.onsuccess=()=>res(r.result||[]);r.onerror=()=>res([...mem.values()])}catch(e){res([...mem.values()])}})},
  put(o,store="songs"){this.mem[store].set(o[STORES[store]],o);if(!this.ok)return Promise.resolve();return new Promise(res=>{try{const r=this._st(store,"readwrite").put(o);r.onsuccess=()=>res();r.onerror=()=>{toast("保存失败：手机存储空间可能不够");res()}}catch(e){res()}})},
  del(key,store="songs"){this.mem[store].delete(key);if(!this.ok)return Promise.resolve();return new Promise(res=>{try{const r=this._st(store,"readwrite").delete(key);r.onsuccess=()=>res();r.onerror=()=>res()}catch(e){res()}})}
};

/* ---------- views ---------- */

// 右滑返回：Safari 和主屏幕模式都用 iOS 系统自带的（系统手势触发 popstate，App 直接切页，不再播自己的动画）。
// 页面按层级：首页(0) → 导入/打轴/播放(1) → 编辑歌曲(2)。往深一层用 pushState，同层跳转用 replaceState，所以返回总是回上一层

function show(id,dir){

  views.forEach(v=>$("#"+v).hidden=v!==id);window.scrollTo(0,0);curView=id;
  clearPressed();closeMenu(true);if(document.activeElement&&document.activeElement!==document.body)document.activeElement.blur();
  // 浮动播放条：页面滑入之后再从下方滑入（没有切页动画时马上滑入；减弱动态效果时只淡入）
  document.querySelectorAll(".player").forEach(p=>p.classList.remove("bar-in"));
  const bar=to.querySelector(".player");
  if(!dir||from===to||reduceMotion()){if(bar)bar.classList.add("bar-in");return}
  // 旧页面暂时固定在原位，和新页面一起播动画
  document.body.classList.add("navigating");
  from.hidden=false;from.classList.add("nav-layer",dir==="fwd"?"leave-fwd":"leave-back");from.style.top=-y+"px";from.style.zIndex=dir==="fwd"?1:3;
  to.style.position="relative";to.style.zIndex=2;to.classList.add(dir==="fwd"?"enter-fwd":"enter-back");
  navTimer=setTimeout(()=>{from.hidden=true;from.classList.remove("nav-layer","leave-fwd","leave-back");from.style.cssText="";to.classList.remove("enter-fwd","enter-back");to.style.cssText="";document.body.classList.remove("navigating");if(bar)bar.classList.add("bar-in")},340);
}
// 按下效果用 JS 控制（不用 CSS :active，iPhone 上切页回来 :active 会卡住）：手指按下加 .is-pressed，抬起、取消、移出、滚动时立刻去掉
const PRESSABLE=".btn,.tones .key,.song,.ib,.res";
let pressedEl=null;
function clearPressed(){document.querySelectorAll(".is-pressed").forEach(e=>e.classList.remove("is-pressed"));pressedEl=null}
document.addEventListener("pointerdown",e=>{
  clearPressed();if(outsideLayer(e.target))return;// 点外面只是关掉菜单或弹层，下面的按钮不显示按下
  const t=e.target.closest&&e.target.closest(PRESSABLE);
  if(t&&!t.disabled){t.classList.add("is-pressed");pressedEl=t}
},{passive:true,capture:true});
["pointerup","pointercancel"].forEach(ev=>document.addEventListener(ev,clearPressed,{passive:true,capture:true}));
document.addEventListener("pointermove",e=>{
  if(!pressedEl)return;const r=pressedEl.getBoundingClientRect();
  if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)clearPressed();
},{passive:true});

window.addEventListener("pageshow",clearPressed);
// 跳转前先松开按钮，等页面画出"松开"的样子再切页（Safari 右滑返回时用的快照也是松开的）
const afterPaint=fn=>requestAnimationFrame(()=>requestAnimationFrame(fn));
function go(view,data={}){
  if(navPending)return;

  clearPressed();navPending=true;

    navPending=false;
    const st={view,...data};

    show(view,"fwd");
  });

function goBack(){

/* ---------- LRC ---------- */
function parseLRC(txt){
  const raw=[];
  for(const line of txt.split(/\r?\n/)){
    const tags=[...line.matchAll(/\[(\d{1,3}):(\d{1,2}(?:[.:]\d{1,3})?)\]/g)];
    if(!tags.length)continue;
    const text=line.replace(/\[[^\]]*\]/g,"").trim();
    for(const m of tags)raw.push({t:+m[1]*60+parseFloat(m[2].replace(":",".")),text});
  }
  raw.sort((a,b)=>a.t-b.t);
  raw.forEach((l,i)=>l.end=i+1<raw.length?raw[i+1].t:null);
  return raw.filter(l=>l.text);
}
function finishEnds(lines,dur){lines.forEach((l,i)=>{if(l.end==null||l.end<=l.t)l.end=i+1<lines.length?lines[i+1].t:(isFinite(dur)&&dur>l.t?dur:l.t+6)});return lines}

function charHTML(it,ci,words){
  if(it.space)return `<span class="sp"></span>`;
  const w=it.word>=0?words[it.word]:null;
  const cls=["c"];if(!it.han)cls.push("punct");if(w&&w.key)cls.push("key");if(it.ov)cls.push("ov");
  return `<span class="${cls.join(" ")}" data-ci="${ci}"${it.word>=0?` data-w="${it.word}"`:""}><span class="jp t${toneOf(it.jp)}">${esc(it.jp||"")}</span><span class="hz">${esc(it.ch)}</span></span>`;
}
// 把一句拆成不能再拆开的小组：标点跟前一个字（开引号跟后一个字），同一个词的字在一组，最后两组合并（避免最后一行只剩一个字）
const OPEN_PUNCT=/[「『（(《〈“‘【\[]/;
function wrapGroups(items){
  const g=[];let open=null;
  items.forEach((it,ci)=>{
    if(it.space){g.push({sp:true,cis:[ci]});return}
    const last=g[g.length-1];
    if(!it.han&&OPEN_PUNCT.test(it.ch)){open=open||[];open.push(ci);return}
    if(open){g.push({cis:[...open,ci],word:it.word});open=null;return}
    if(last&&!last.sp&&(!it.han||(it.word>=0&&last.word===it.word)))last.cis.push(ci);
    else g.push({cis:[ci],word:it.word});
  });
  if(open)g.push({cis:open});
  const words=g.map((x,i)=>x.sp?-1:i).filter(i=>i>=0);
  if(words.length>=2){const a=words[words.length-2],z=words[words.length-1];g.splice(a,z-a+1,{cis:g.slice(a,z+1).flatMap(x=>x.cis)})}
  return g.map(x=>x.cis);
}

}

}

  proof.open=i;renderProof();

async function proofOp(i,name,card){
  const L=proof.lines;
  if(name==="insert"){proof.lines=PROOF.insertAfter(L,i);proof.dirty=true;openProofLine(i+1,true);return}
  if(name==="split"){
    const inp=card.querySelector(".pl-text"),cut=[...inp.value.slice(0,inp.selectionStart||0)].length;
    const n=PROOF.split(L,i,cut);if(!n){toast("把光标放到要拆开的位置，再点「从这里拆开」");return}
    proof.lines=n;proof.dirty=true;openProofLine(i+1,false);return;
  }
  if(name==="merge"){proof.lines=PROOF.mergeUp(L,i);proof.dirty=true;openProofLine(i-1,false);return}
  if(name==="del"){
    if(L.length<=1){toast("至少要留一句歌词");return}
    if(!await confirmSheet({title:"删除这句？",body:"「"+(L[i].text.trim()||"（空的一句）")+"」"}))return;
    proof.lines=PROOF.remove(proof.lines,i);proof.dirty=true;proof.open=-1;renderProof();
  }
}
function shiftProof(d){
  const n=PROOF.shiftAll(proof.lines,d);if(!n){toast("已经到最前面了");return}
  proof.lines=n;proof.offset=Math.round((proof.offset+d)*10)/10;proof.dirty=true;renderProof();
}

$("#proofList").addEventListener("click",e=>{
  const card=e.target.closest(".pl");if(!card)return;const i=+card.dataset.i;
  if(e.target.closest(".pl-head")){proof.open=proof.open===i?-1:i;renderProof();return}
  const o=e.target.closest("[data-op]");if(o){proofOp(i,o.dataset.op,card);return}
  const nd=e.target.closest("[data-nudge]");
  if(nd){proof.lines=PROOF.setStart(proof.lines,i,proof.lines[i].t+parseFloat(nd.dataset.nudge));proof.dirty=true;renderProof();return}
  if(e.target.closest("[data-audition]")){
    if(!proofHasAudio()){toast("先加上音频");return}
    // 从这句开始播，播到下一句开始时停
    const L=proof.lines;au.currentTime=L[i].t;proof.stopAt=i<L.length-1?L[i+1].t:L[i].end;au.play().catch(()=>{});return;
  }
  if(e.target.closest("[data-mark]")){
    if(!proofHasAudio()){toast("先加上音频");return}
    // 边听边按：减去 0.15 秒反应时间
    proof.lines=PROOF.setStart(proof.lines,i,au.currentTime-0.15);proof.dirty=true;renderProof();
    toast("已对准："+PROOF.fmtT(proof.lines[i].t));
  }
});
$("#prPlay").addEventListener("click",()=>{
  if(!proofHasAudio()){toast("先加上音频");return}
  proof.stopAt=null;au.paused?au.play().catch(()=>{}):au.pause();
});
$("#prSeek").addEventListener("input",e=>{au.currentTime=+e.target.value;if(proof)proof.stopAt=null});
$("#proofList").addEventListener("input",e=>{
  const inp=e.target.closest(".pl-text");if(!inp)return;const card=inp.closest(".pl"),i=+card.dataset.i;
  proof.lines[i].text=inp.value;proof.dirty=true;card.querySelector(".pl-txt").textContent=inp.value;
});
async function saveProof(){
  const empty=proof.lines.findIndex(l=>!l.text.trim());
  if(empty>=0){openProofLine(empty,false);toast(`第 ${empty+1} 句是空的`);return false}
  const s=proof.song;
  // 按时间排好；改了文字的句子清掉手动读音；学会记录和卡片出处的行号跟着插入/拆开/合并/删除更新
  const r=PROOF.toSong(proof.lines);
  s.lines=r.lines;s.overrides=r.overrides;
  s.progress={...STUDY.progressOf(s),learned:r.learned};
  s.title=$("#prTitle").value.trim()||"未命名";s.artist=$("#prArtist").value.trim();
  if(proof.newAudio){s.audio=proof.newAudio.blob;s.audioName=proof.newAudio.name;s.duration=proof.newAudio.dur}
  s.updated=Date.now();
  // 错别字更正已经写进歌词里了，清空它，免得又把你改回来的字改掉
  if(s.pack&&Array.isArray(s.pack.fix)&&s.pack.fix.length)s.pack={...s.pack,fix:[]};
  await DB.put(s);
  for(const c of cards.values()){
    if(!c.sources.some(x=>x.songId===s.id))continue;
    const seen=new Set(),src=[];
    for(const x of c.sources){const y=x.songId!==s.id?x:(r.map[x.li]!=null?{...x,li:r.map[x.li]}:null);if(y&&!seen.has(y.songId+":"+y.li)){seen.add(y.songId+":"+y.li);src.push(y)}}
    if(JSON.stringify(src)!==JSON.stringify(c.sources)){c.sources=src;c.updated=Date.now();await DB.put(c,"cards")}
  }
  proof.dirty=false;toast("已保存");return true;
}
$("#proofSave").addEventListener("click",async()=>{if(await saveProof())goBack()});
function dirtyPrompt(){
  openSheet(`<h3>有改动还没保存</h3>
    <button class="btn primary block" type="button" data-dirty="save">保存</button>
    <button class="btn block" type="button" data-dirty="discard">不保存</button>
    <button class="btn block text" type="button" data-dirty="stay">继续编辑</button>`,{modal:true});
  $("#sheetBody").onclick=async e=>{
    if(e.target.closest('[data-dirty="stay"]')){closeSheet();return}
    if(e.target.closest('[data-dirty="save"]')){closeSheet();if(await saveProof())goBack();return}
    if(e.target.closest('[data-dirty="discard"]')){proof.dirty=false;closeSheet();goBack()}
  };
}

/* ---------- 删除前确认（样式和"有改动还没保存"一样） ---------- */
// 返回 Promise：点「删除」→ true；点「取消」→ false。确认类弹窗点外面不关，必须点按钮（系统返回时也算取消）
let confirmDone=null;
function confirmSheet({title,body,ok="删除"}){
  if(confirmDone)confirmDone(false);
  return new Promise(res=>{
    confirmDone=v=>{confirmDone=null;res(v)};
    openSheet(`<h3>${esc(title)}</h3>${body?`<p class="note" style="margin:0">${esc(body)}</p>`:""}
      <button class="btn danger-fill block" type="button" data-confirm="ok">${esc(ok)}</button>
      <button class="btn block" type="button" data-confirm="cancel">取消</button>`,{modal:true});
    $("#sheetBody").onclick=e=>{
      const b=e.target.closest("[data-confirm]");if(!b)return;
      const done=confirmDone;confirmDone=null;closeSheet();if(done)done(b.dataset.confirm==="ok");
    };
  });
}
const SONG_DEL_NOTE="音频、歌词和学习进度会被删除，学过的词会保留在复习里。";

/* ---------- more menu（「⋯」下拉小菜单，设计规范 5.9） ---------- */
const songMenu=$("#songMenu");let menuTimer=0;
const menuOpen=()=>songMenu.classList.contains("open");
function openMenu(){
  const b=$("#btnMenu");clearTimeout(menuTimer);
  songMenu.querySelector('[data-menu="pack"]').textContent=cur.pack?"词汇包 ✓":"词汇包";
  songMenu.querySelector('[data-menu="current"]').hidden=STUDY.progressOf(cur).current;
  // 右边和「⋯」按钮对齐，在按钮正下方
  songMenu.style.top=b.offsetTop+b.offsetHeight+6+"px";songMenu.style.right=b.offsetParent.clientWidth-b.offsetLeft-b.offsetWidth+"px";
  songMenu.hidden=false;void songMenu.offsetHeight;songMenu.classList.add("open");b.setAttribute("aria-expanded","true");
}
function closeMenu(now){
  clearTimeout(menuTimer);songMenu.classList.remove("open");$("#btnMenu").setAttribute("aria-expanded","false");
  if(now)songMenu.hidden=true;else menuTimer=setTimeout(()=>{songMenu.hidden=true},180);
}
$("#btnMenu").addEventListener("click",()=>{if(menuOpen())closeMenu();else openMenu()});
songMenu.addEventListener("click",async e=>{
  const m=e.target.closest("[data-menu]");if(!m)return;
  closeMenu();
  if(m.dataset.menu==="proof"){openProof();return}
  if(m.dataset.menu==="pack"){openPack();return}
  if(m.dataset.menu==="current"){await setCurrentSong(cur.id);toast("已设为正在学");return}
  const id=cur.id;
  if(!await confirmSheet({title:"删除这首歌？",body:SONG_DEL_NOTE}))return;

/* ---------- sheet ---------- */
// 弹出层不使用暗幕（设计规范 5.6）。modal：确认类弹窗，点外面、往下拖都不关，必须点按钮
let sheetTimer=0,sheetModal=false;
const sheetOpen=()=>$("#sheet").classList.contains("open");
function openSheet(html,{modal=false}={}){
  const sh=$("#sheet");clearTimeout(sheetTimer);sheetModal=modal;
  $("#sheetBody").innerHTML=(modal?"":`<div class="grab"></div>`)+html;
  if(sh.hidden||!sh.classList.contains("open")){sh.hidden=false;sh.scrollTop=0;sh.style.transform="";void sh.offsetHeight;sh.classList.add("open")}
}
function closeSheet(){
  if(confirmDone)confirmDone(false);
  const sh=$("#sheet");
  document.querySelectorAll(".c.sel").forEach(x=>x.classList.remove("sel"));
  if(sh.hidden)return;
  sh.classList.remove("open","dragging");sh.style.transform="";
  clearTimeout(sheetTimer);sheetTimer=setTimeout(()=>{sh.hidden=true},320);
}
// 点外面关闭下拉菜单或弹层。用 pointerdown/up 判断（iPhone 上点普通文字不一定有 click），手指移动超过 10px 算滚动，不关。
// 这一下只用来关闭，后面跟着的 click 吞掉，不会顺便点到下面的按钮或字
let outsideAt=null,eatClickAt=-1;
const outsideLayer=t=>(menuOpen()&&!songMenu.contains(t))||(sheetOpen()&&!$("#sheet").contains(t));
document.addEventListener("pointerdown",e=>{eatClickAt=-1;outsideAt=outsideLayer(e.target)?{x:e.clientX,y:e.clientY}:null},{passive:true,capture:true});
document.addEventListener("pointercancel",()=>{outsideAt=null},{passive:true,capture:true});
document.addEventListener("pointerup",e=>{
  const o=outsideAt;outsideAt=null;if(!o||Math.hypot(e.clientX-o.x,e.clientY-o.y)>10)return;
  eatClickAt=e.timeStamp;
  if(menuOpen())closeMenu();else if(!sheetModal)closeSheet();
},{passive:true,capture:true});
document.addEventListener("click",e=>{if(eatClickAt>=0&&e.timeStamp-eatClickAt<600){eatClickAt=-1;e.stopPropagation();e.preventDefault()}},true);
// 往下拖关闭：只从拖动条和弹层顶部 48px 开始
let drag=null;
$("#sheet").addEventListener("touchstart",e=>{
  const sh=$("#sheet"),y=e.touches[0].clientY;
  if(sheetModal||y-sh.getBoundingClientRect().top>48||sh.scrollTop>0){drag=null;return}
  drag={y0:y,y,t:e.timeStamp,vy:0};sh.classList.add("dragging");
},{passive:true});
$("#sheet").addEventListener("touchmove",e=>{
  if(!drag)return;const y=e.touches[0].clientY,dt=e.timeStamp-drag.t;
  if(dt>0)drag.vy=(y-drag.y)/dt;drag.y=y;drag.t=e.timeStamp;
  const dy=Math.max(0,y-drag.y0);$("#sheet").style.transform=`translateY(${dy}px)`;
  if(dy>0)e.preventDefault();
},{passive:false});
$("#sheet").addEventListener("touchend",()=>{
  if(!drag)return;const sh=$("#sheet"),dy=Math.max(0,drag.y-drag.y0);sh.classList.remove("dragging");
  if(GESTURE.dragDismissDecision(dy,sh.offsetHeight,drag.vy))closeSheet();else sh.style.transform="";
  drag=null;
});
$("#sheet").addEventListener("touchcancel",()=>{if(!drag)return;const sh=$("#sheet");sh.classList.remove("dragging");sh.style.transform="";drag=null});
document.addEventListener("keydown",e=>{if(e.key!=="Escape")return;if(menuOpen())closeMenu();else if(sheetOpen()&&!sheetModal)closeSheet()});

/* ---------- word card ---------- */
function openWord(li,ci){
  const v=view[li],it=v.items[ci];if(!it||it.space)return;
  const w=it.word>=0?v.words[it.word]:null;
  // 只取点到的那一处：同一句里同一个词出现两次时，不把两处拼在一起
  let a=ci,z=ci;if(w){while(a>0&&v.items[a-1].word===it.word)a--;while(z<v.items.length-1&&v.items[z+1].word===it.word)z++}
  const idxs=Array.from({length:z-a+1},(_,k)=>a+k);
  document.querySelectorAll(".c.sel").forEach(x=>x.classList.remove("sel"));
  const lineEl=$("#lyrics").children[li];idxs.forEach(i=>lineEl.querySelector(`[data-ci="${i}"]`)?.classList.add("sel"));
  const wordText=idxs.map(i=>v.items[i].ch).join("");
  const shown=idxs.map(i=>v.items[i].jp).filter(Boolean).join(" ");
  let ttsNote="";
  if(TJ&&shown){const guess=TJ.getJyutpingText(wordText);if(guess&&guess.replace(/\s+/g," ").trim()!==shown)ttsNote=`<div class="warn">系统朗读可能读成 <b>${esc(guess)}</b>。以上面的粤拼为准。</div>`}
  const cands=it.han&&TJ?(TJ.getJyutpingCandidates(it.ch)[0]||[null,[]])[1].slice(0,8):[];
  if(it.han&&it.jp&&!cands.includes(it.jp))cands.unshift(it.jp);
  const orig=computeLineNoOverride(li).items[ci];
  const card=cards.get(wordText);
  const allRead=idxs.every(i=>!v.items[i].han||v.items[i].jp); // 每个字都有读音才能建卡
  const cardRow=!(it.han&&shown&&allRead)?"":card
    ?`<div class="wc-known">已在生词本 · ${card.known?"已认识":esc(SRS.dueLabel(card.srs.due,Date.now()))+"复习"}</div>`
    :`<button class="btn block add-dashed" type="button" data-addcard="1">＋ 加入生词</button>`;
  openSheet(`
    <div class="wc-top${idxs.length>3?" long":""}">
      <div class="wc-square">${idxs.map(i=>{const x=v.items[i];return `<span class="wc-ch" data-say="${esc(x.ch)}"><span class="jp t${toneOf(x.jp)}">${esc(x.jp||"")}</span><span class="hz">${esc(x.ch)}</span></span>`}).join("")}</div>
      <div class="wc-side">
        ${w&&w.zh?`<div class="wc-mean">${esc(w.zh)}</div>`:""}
        <div class="wc-tags">${idxs.map(i=>{const n=toneOf(v.items[i].jp);return n?`<span class="tone-tag" style="--tc:var(--t${n})">第 ${n} 声 · ${TONE_NAMES[n]}</span>`:""}).join("")}</div>
        ${w&&w.oral?'<div><span class="chip">粤语口语字</span></div>':""}
      </div>
    </div>
    ${w&&w.tip?`<div class="wc-tip">${esc(w.tip)}</div>`:""}
    <div class="wc-btns"><button class="btn primary" type="button" data-say="${esc(wordText)}">听标准发音</button><button class="btn soft" type="button" data-orig="${li}">播放原唱这句</button></div>
    ${idxs.length>1?'<div class="note">点上面单个字可以听单字</div>':""}
    ${cardRow}
    ${ttsNote}
    ${!cur.pack?'<div class="note">导入词汇包后，重点词会显示普通话意思和记忆提示。</div>':(!w?'<div class="note">这个字不在词汇包里，读音是自动生成的。可以重新生成词汇包。</div>':"")}
    ${it.han&&cands.length?`<div class="field"><div class="label">「${esc(it.ch)}」读错了？选正确读音</div><div class="cands">${cands.map(c=>`<button class="cand" type="button" data-set="${esc(c)}" aria-pressed="${c===it.jp}"><span class="t${toneOf(c)}">${esc(c)}</span></button>`).join("")}${it.ov?`<button class="cand" type="button" data-reset="1">恢复为 ${esc(orig&&orig.jp||"")}</button>`:""}</div></div>`:""}
  `);
  $("#sheetBody").onclick=async e=>{
    const s=e.target.closest("[data-say]");if(s){speak(s.dataset.say,s.dataset.say.length>1?0.75:0.7);return}
    const o=e.target.closest("[data-orig]");if(o){closeSheet();playLine(li);return}
    if(e.target.closest("[data-addcard]")){
      if(!cards.has(wordText)){
        const c=SRS.newCard({w:wordText,jp:shown,zh:w?.zh,tip:w?.tip,oral:w?.oral},{songId:cur.id,li},Date.now());
        await DB.put(c,"cards");cards.set(c.w,c);toast("已加入生词本");
      }
      openWord(li,ci);return;
    }
    const set=e.target.closest("[data-set]"),rs=e.target.closest("[data-reset]");
    if(set||rs){
      const key=li+":"+ci;
      if(rs||(orig&&set.dataset.set===orig.jp))delete cur.overrides[key];else cur.overrides[key]=set.dataset.set;
      cur.updated=Date.now();await DB.put(cur);rebuildLine(li);if(loopIdx===li)$("#lyrics").children[li].classList.add("loop");openWord(li,ci);toast("读音已修改");
    }
  };
}
function computeLineNoOverride(li){const sv=cur.overrides;cur.overrides={};const r=computeLine(li);cur.overrides=sv;return r}

/* ---------- word pack ---------- */
function openPack(){
  const prompt=PACK.buildPrompt(cur);
  openSheet(`
    <h3>词汇包${cur.pack?' <span class="chip">已导入</span>':""}</h3>
    <p class="note" style="margin:0">词汇包让 Claude 帮你整理这首歌的每个词：正确读音、普通话意思；其中的重点词还有记忆提示，在歌词里显示下划线。再加上整首歌的大意。</p>
    <ol class="steps">
      <li><div><button class="btn primary" type="button" id="cpPrompt">复制提示词</button><div class="note" style="margin-top:6px">提示词里已经放好了这首歌的歌词。</div></div></li>
      <li><div>在 Claude 里新开一个对话，粘贴发送。等它回复完。</div></li>
      <li><div>复制它回复的整段 JSON，粘贴到下面：</div></li>
    </ol>
    <textarea id="promptBox" readonly hidden>${esc(prompt)}</textarea>
    <textarea id="packIn" placeholder='{"summary": …, "words": [ … ]}'></textarea>
    <div id="packMsg" class="msgs"></div>
    <button class="btn primary block" type="button" id="doImport">导入词汇包</button>${cur.pack?'<button class="btn text block danger" type="button" id="rmPack">删除词汇包</button>':""}
  `);
  $("#sheetBody").onclick=null;
  $("#cpPrompt").addEventListener("click",()=>{
    const box=$("#promptBox");
    const fallback=()=>{box.hidden=false;box.focus();box.select();toast("自动复制不可用：已选中提示词，请手动复制")};
    try{navigator.clipboard.writeText(prompt).then(()=>toast("已复制提示词"),fallback)}catch(e){fallback()}
  });
  $("#doImport").addEventListener("click",async()=>{
    const raw=$("#packIn").value;if(!raw.trim()){toast("先粘贴 Claude 的回复");return}
    const r=PACK.parsePack(raw,cur.lines);const msg=$("#packMsg");
    if(r.errs.length){msg.innerHTML=r.errs.slice(0,10).map(x=>`<div class="err">✗ ${esc(x)}</div>`).join("")+(r.errs.length>10?`<div class="err">……还有 ${r.errs.length-10} 个问题</div>`:"")+'<div class="note">可以把这些问题发给 Claude，请它修正后重新输出。</div>';return}
    cur.pack=r.pack;cur.overrides={};cur.updated=Date.now();await DB.put(cur);
    buildLyrics();applyToggles();if(loopIdx!=null)setLoop(loopIdx);if(curIdx>=0)$("#lyrics").children[curIdx]?.classList.add("cur");
    if(r.warns.length){msg.innerHTML=`<div class="ok">✓ 已导入，有 ${r.warns.length} 处小问题已自动处理：</div>`+r.warns.slice(0,8).map(x=>`<div class="note">· ${esc(x)}</div>`).join("");}
    else{closeSheet();toast("词汇包已导入")}
  });
  const rm=$("#rmPack");if(rm)rm.addEventListener("click",async()=>{if(!await confirmSheet({title:"删除词汇包？",body:"重点词的意思、记忆提示和这首歌的大意会被删掉。生词卡片不受影响。"}))return;cur.pack=null;cur.updated=Date.now();await DB.put(cur);buildLyrics();applyToggles();closeSheet();toast("词汇包已删除")});
}

/* ---------- settings：每天新学几句（M4 接上功能）+ 备份与恢复 ---------- */
$("#btnSettings").addEventListener("click",()=>{renderSettings();go("settingsView")});
// 2 / 4 / 6 / 自定义（1–20）；goalCustom 只在这次打开设置页时有效
let goalCustom=false;
function setGoal(g){saveDaily({...getDaily(),goal:Math.min(STUDY.GOAL_MAX,Math.max(STUDY.GOAL_MIN,g))});renderGoal()}
$("#goalSeg").addEventListener("click",e=>{const b=e.target.closest("[data-goal]");if(!b)return;
  if(b.dataset.goal==="custom"){goalCustom=true;renderGoal()}else{goalCustom=false;setGoal(+b.dataset.goal)}});
$("#goalMinus").addEventListener("click",()=>setGoal(STUDY.goalOf(getDaily())-1));
$("#goalPlus").addEventListener("click",()=>setGoal(STUDY.goalOf(getDaily())+1));
function renderGoal(){
  const g=STUDY.goalOf(getDaily());
  const opts=[...STUDY.GOALS.map(n=>({v:String(n),on:!goalCustom&&n===g})),{v:"custom",label:"自定义",on:goalCustom}];
  $("#goalSeg").innerHTML=opts.map(o=>`<button class="btn small ${o.on?"primary":"soft"}" type="button" data-goal="${o.v}" aria-pressed="${o.on}">${o.label||o.v}</button>`).join("");
  $("#goalStep").hidden=!goalCustom;$("#goalNum").textContent=g;
  $("#goalMinus").disabled=g<=STUDY.GOAL_MIN;$("#goalPlus").disabled=g>=STUDY.GOAL_MAX;
}
function renderSettings(){
  goalCustom=!STUDY.GOALS.includes(STUDY.goalOf(getDaily()));renderGoal();
  const data=JSON.stringify({app:"yuechang",v:2,exported:new Date().toISOString(),songs:songs.map(s=>{const o={...s};delete o.audio;return o}),cards:[...cards.values()],meta:[...metaRecs.values()]});
  $("#backupCard").innerHTML=`
    <div class="label">备份与恢复</div>
    <p class="note" style="margin:0">备份包含歌词、时间轴、词汇包、改过的读音和生词卡片，不含音频。把备份文本存到备忘录里就行。</p>
    <div class="row"><button class="btn primary" type="button" id="cpBk">复制备份文本</button><span class="note">${songs.length} 首歌 · ${cards.size} 个生词 · ${Math.round(data.length/1024)} KB</span></div>
    <textarea id="bkOut" readonly hidden>${esc(data)}</textarea>
    <div class="label">恢复</div>
    <textarea id="bkIn" placeholder="粘贴之前复制的备份文本"></textarea>
    <div class="row"><button class="btn soft" type="button" id="doRestore">恢复</button><span id="bkMsg" class="note"></span></div>
  `;
  $("#cpBk").addEventListener("click",()=>{const box=$("#bkOut");const fb=()=>{box.hidden=false;box.focus();box.select();toast("已选中备份文本，请手动复制")};try{navigator.clipboard.writeText(data).then(()=>toast("已复制备份"),fb)}catch(e){fb()}});
  $("#doRestore").addEventListener("click",async()=>{
    await commitDelete(); // 先把还能撤销的删除真正做完，免得稍后把刚恢复的歌又删掉
    let obj;try{obj=JSON.parse($("#bkIn").value)}catch(e){$("#bkMsg").innerHTML='<span class="err">备份文本不完整或格式不对</span>';return}
    if(!obj||obj.app!=="yuechang"||!Array.isArray(obj.songs)){$("#bkMsg").innerHTML='<span class="err">这不是唱学粤语的备份</span>';return}
    let n=0;
    // 同一时间只有一首"正在学"：本机已经有的话，备份里新加的歌不标正在学
    const hasCurrent=songs.some(x=>STUDY.progressOf(x).current);
    for(const s of obj.songs){if(!s||!s.id||!Array.isArray(s.lines))continue;const ex=songs.find(x=>x.id===s.id);const merged={...s,audio:ex?ex.audio:null};
      if(ex)merged.progress=STUDY.mergeProgress(ex.progress,s.progress,merged.lines.length);else if(hasCurrent)merged.progress={...STUDY.progressOf(merged),current:false};
      await DB.put(merged);if(ex)Object.assign(ex,merged);else songs.push(merged);n++}
    const merged=SRS.mergeCards([...cards.values()],obj.cards,Date.now());
    for(const c of merged)await DB.put(c,"cards");
    cards=new Map(merged.map(c=>[c.w,c]));
    // meta：daily 用备份里的每天几句（今天的计数留本机的）；其他只恢复本机还没有的记录
    if(Array.isArray(obj.meta))for(const m of obj.meta){if(!m||typeof m.key!=="string")continue;
      if(m.key==="daily")await saveDaily(STUDY.mergeDaily(metaRecs.get("daily"),m,SRS.today(Date.now())));
      else if(!metaRecs.has(m.key)){await DB.put(m,"meta");metaRecs.set(m.key,m)}}
    renderHome();$("#bkMsg").innerHTML=`<span class="ok">已恢复 ${n} 首歌、${cards.size} 个生词</span>`;
  });
}

/* ---------- 每日学习 ---------- */
function startStudy(){toast("学习页马上就好")}

/* ---------- boot ---------- */
history.replaceState({view:"home"},"");
(async()=>{
  await DB.open();songs=await DB.all();
  cards=new Map((await DB.all("cards")).map(c=>[c.w,c]));
  metaRecs=new Map((await DB.all("meta")).map(m=>[m.key,m]));
  // 「每天新学几句」以前存在 prefs.goal，搬到 meta daily
  if(!metaRecs.has("daily"))await saveDaily({...getDaily(),goal:STUDY.goalOf({goal:prefs.goal})});
  if("goal" in prefs){delete prefs.goal;savePrefs()}
  renderHome();
})();
if("serviceWorker" in navigator&&location.protocol==="https:")navigator.serviceWorker.register("sw.js").catch(()=>{});
})();
</script>
