<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>唱学粤语</title>
<meta name="theme-color" content="#F7F6FB" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#15131F" media="(prefers-color-scheme: dark)">
<!-- 皮肤：开始 -->
<!-- 皮肤（开发规格 7.10）：颜色全部在 skins/<id>.js。这里在第一帧之前把所有皮肤的变量写成样式表，按 localStorage yc-skin 选皮肤，
     所以用夜曲的人打开 App 不会先闪一下丁香色。下面的组件只读 CSS 变量，不认识任何皮肤 -->
<script src="skins/registry.js"></script>
<script src="skins/skin.js"></script>
<script src="skins/unlock-rules.js"></script>
<script>
// 换皮肤：设 <html data-skin>、顶部状态栏颜色（theme-color）、记到 localStorage。animate：颜色 0.3 秒过渡（减弱动态效果时不过渡）
function applySkin(id,opt={}){
  if(typeof SKIN==="undefined"||typeof SKIN_DEFS!=="object")return null; // 皮肤文件没加载到（刚更新时断网）：不报错
  if(!SKIN_DEFS[id])id=SKIN_DEFS.lilac?"lilac":Object.keys(SKIN_DEFS)[0];
  if(!id)return null;
  const root=document.documentElement,d=SKIN_DEFS[id];
  clearTimeout(applySkin.t);root.classList.remove("skin-fade");
  if(opt.animate&&!matchMedia("(prefers-reduced-motion: reduce)").matches){root.classList.add("skin-fade");applySkin.t=setTimeout(()=>root.classList.remove("skin-fade"),300)}
  root.dataset.skin=id;
  const m=document.querySelectorAll('meta[name="theme-color"]');
  if(m.length===2){m[0].content=SKIN.colorsFor(d,false).bg;m[1].content=SKIN.colorsFor(d,true).bg}
  try{localStorage.setItem("yc-skin",id)}catch(e){}
  return id;
}
(()=>{if(typeof SKIN==="undefined"||typeof SKIN_DEFS!=="object")return;
  const st=document.createElement("style");st.id="skinCss";st.textContent=SKIN.stylesheet(SKIN_DEFS);document.head.appendChild(st);
  let id=null;try{id=localStorage.getItem("yc-skin")}catch(e){}
  applySkin(id);
})();
</script>
<!-- 皮肤：结束 -->
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="唱学粤语">
<style>
/* Outfit 字体自带（OFL，见 fonts/OFL.txt），只用于粤拼、数字、时间 */
@font-face{font-family:"Outfit";font-weight:500;font-display:swap;src:url(fonts/outfit-500.woff2) format("woff2")}
@font-face{font-family:"Outfit";font-weight:600;font-display:swap;src:url(fonts/outfit-600.woff2) format("woff2")}
@font-face{font-family:"Outfit";font-weight:700;font-display:swap;src:url(fonts/outfit-700.woff2) format("woff2")}
/* 非颜色的设计变量（docs/设计规范.md）。颜色变量都来自皮肤文件 skins/<id>.js（上面 <head> 里生成），组件里只用变量，不写颜色值 */
:root{
  --font-cjk:-apple-system,"PingFang HK","PingFang SC","Noto Sans CJK TC","Microsoft JhengHei",sans-serif;
  --font-latin:"Outfit",var(--font-cjk);
  --dur-fast:120ms; --dur:220ms; --dur-slow:320ms; --ease:cubic-bezier(.2,.8,.2,1);
  /* 统一的弹簧（设计规范 6.1）：由 gesture.js 的 GESTURE.springLinear() 算出来，改了要一起改（有测试核对） */
  --dur-spring:400ms; --spring:linear(0, 0.043, 0.149, 0.289, 0.441, 0.589, 0.723, 0.836, 0.926, 0.993, 1.039, 1.067, 1.081, 1.083, 1.079, 1.069, 1.057, 1.044, 1.032, 1.021, 1.012, 1.005, 1, 0.996, 0.994, 0.993, 0.993, 0.994, 0.994, 0.995, 0.996, 0.997, 1);
}
/* 换皮肤时颜色 0.3 秒过渡（applySkin 加上 .skin-fade，300ms 后去掉）。底部弹窗本身不加，免得盖掉它滑下去的动画 */
.skin-fade,.skin-fade *:not(.sheet),.skin-fade *::before,.skin-fade *::after{transition:background-color .3s ease,color .3s ease,border-color .3s ease,fill .3s ease,stroke .3s ease,box-shadow .3s ease!important}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;background:var(--bg)}
/* 启动画面（v0.38，设计规范 5.17）：读数据期间盖住页面，颜色是当前皮肤（<head> 里第一帧前就套好了），读完就淡出 0.3 秒，没有最短显示时间 */
.splash{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:var(--bg);color:var(--ink);
  font-size:20px;font-weight:700;transition:opacity .3s ease}
.splash img{width:88px;height:88px;border-radius:20px}
.splash.out{opacity:0;pointer-events:none}
/* 保险：就算哪个元素超出屏幕，页面也不能横着滚（找到超出的元素要先修它） */
html,body{overflow-x:clip}
body{margin:0;min-height:100dvh;background:var(--bg);color:var(--ink);font-family:var(--font-cjk);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:720px;margin:0 auto}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button,a,label,input,textarea,select,[role=button]{touch-action:manipulation}
button:focus-visible,input:focus-visible,textarea:focus-visible,[role=button]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.t1{color:var(--t1)}.t2{color:var(--t2)}.t3{color:var(--t3)}.t4{color:var(--t4)}.t5{color:var(--t5)}.t6{color:var(--t6)}
.num,.jp{font-family:var(--font-latin);font-variant-numeric:tabular-nums}

/* 按钮：白色（默认）/ primary 主色 / inverse 深色 / soft 浅色 / text 文字 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:12px 16px;border-radius:16px;
  background:var(--surface);color:var(--ink);box-shadow:var(--shadow-1);font-size:16px;font-weight:600;line-height:1.2;text-align:center;
  transition:transform var(--dur-fast) var(--ease),background-color var(--dur-fast) var(--ease)}
.btn.is-pressed{transform:scale(.97);background:var(--surface-press)}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.primary.is-pressed{background:var(--accent-press)}
.btn.inverse{background:var(--inverse);color:var(--on-inverse)}
.btn.inverse.is-pressed{background:var(--ink-2)}
.btn.soft{background:var(--accent-soft);color:var(--accent);box-shadow:none}
.btn.soft.is-pressed{background:var(--surface-press)}
.btn.text{background:none;color:var(--muted);box-shadow:none}
.btn.text.is-pressed{background:none}
.btn.danger{color:var(--danger)}
.btn.danger-fill{background:var(--danger);color:var(--on-accent)}
.btn.danger-fill.is-pressed{background:var(--danger);opacity:.85}
.btn.small{min-height:44px;padding:8px 12px;border-radius:12px;font-size:15px}
.btn.block{display:flex;width:100%}
.btn.bottom{min-height:56px;border-radius:18px;font-size:17px}
.btn.icon{width:44px;min-height:44px;padding:0;border-radius:16px}
.btn:disabled{opacity:.45;cursor:default;transform:none}
.muted{color:var(--muted)}
.label{font-size:13px;color:var(--muted);font-weight:600}
/* 输入框（设计规范 5.14，所有皮肤一样）：底色和所在卡片明显不同——卡片里用 --bg，直接放在页面上的用 --surface（.on-page）；
   1px 边框 --field-border（皮肤引擎给，对卡片和 --bg 都 ≥ 3:1，有颜色检查）；点进去边框变 1.5px 主色（1px 边框 + 0.5px 内描边，大小不变） */
input[type=text],input[type=search],textarea{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--field-border);border-radius:14px;
  padding:11px 15px;box-shadow:none;transition:border-color var(--dur-fast) var(--ease)}
input[type=text]:focus,input[type=search]:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:inset 0 0 0 .5px var(--accent)}
.on-page input[type=text],.on-page input[type=search]{background:var(--surface)}
input::placeholder,textarea::placeholder{color:var(--muted);opacity:1}
/* 输入框固定 7 行高，超出的在框里滚动；clip-path 保证文字不会画到框外（iPhone 上见过露出半行） */
textarea{display:block;height:calc(1.6em * 7 + 24px);padding:11px 15px;resize:none;overflow-y:auto;line-height:1.6;clip-path:inset(0 round 14px)}
svg{display:block}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{transition-property:opacity!important;animation:none!important;scroll-behavior:auto!important}
  .is-pressed{transform:none!important}
  #btnSettings.turn svg{transform:none}
  /* 减弱动态效果：播放条只淡入淡出 */
  .player.bar-in,.study-foot.bar-in{animation:barFade var(--dur) var(--ease) both!important}
  /* 弹簧动画都换成简单淡入（学词新卡片、完成页的勾） */
  .st-anim.in,.st-check.pop{animation:barFade var(--dur) var(--ease) both!important}
}

/* Home（首页左右边距 20px） */
.wrap.home{padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.home-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:calc(env(safe-area-inset-top,0px) + 24px);padding-bottom:16px}
/* 首页第一行（v0.37）：日期 20px 粗 + 星期 15px --muted，右边齿轮；高 44px */
.hdate{flex:0 1 auto;min-width:0;margin:0 auto 0 0;font-weight:400;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hd-d{font-size:20px;font-weight:700;color:var(--ink)}
.hd-w{margin-left:4px;font-size:15px;color:var(--muted)}
/* 学习页（规格 5.4–5.6，设计规范 5.8） */
.cells{flex:1;display:flex;gap:4px}
.cells i{flex:1;height:8px;border-radius:4px;background:var(--rule);transition:background-color var(--dur) var(--ease)}
.cells i.done{background:var(--accent)}
.cells i.cur{background:var(--seg-current)}
.st-count{min-width:44px;text-align:right;font-size:14px;font-weight:600;color:var(--muted)}
.st-count.whole{color:var(--accent)}
.study{padding-top:4px;padding-bottom:calc(150px + env(safe-area-inset-bottom,0px))}
.st-line{background:var(--surface);border-radius:18px;padding:12px 16px;margin-bottom:16px;font-size:15px;line-height:1.6;color:var(--ink-2);box-shadow:var(--shadow-1)}
.st-line .hl{background:var(--accent-soft);color:var(--accent);border-radius:6px;padding:1px 2px}
.st-card{background:var(--surface);border-radius:30px;box-shadow:var(--shadow-2);padding:24px 16px;display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center}
.st-chars{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 12px}
.st-ch{display:flex;flex-direction:column;align-items:center}
.st-ch .jp{font-size:20px;font-weight:700}
.st-ch .hz{font-size:72px;font-weight:700;line-height:1.1}
.st-tags{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
.st-mean{font-size:22px;font-weight:600}
.st-mean.none{font-size:17px;color:var(--muted)}
.st-card .wc-tip{align-self:stretch;text-align:left}
.st-btns{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:12px}
.st-say{width:64px;height:64px;min-height:64px;padding:0;border-radius:50%;box-shadow:var(--shadow-3)}
.study-foot{position:fixed;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));bottom:calc(8px + env(safe-area-inset-bottom,0px));z-index:20;max-width:688px;margin:0 auto;display:flex;flex-direction:column;gap:4px}
.st-hint{margin:8px 0 12px;text-align:center;font-size:14px;color:var(--muted)}
.st-whole{padding:24px 16px}
.st-wline{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 8px}
.st-wline .grp{display:inline-flex;gap:4px}
.st-whole .st-ch .jp{font-size:14px}
.st-whole .st-ch .hz{font-size:34px}
.st-two{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0}
.st-big{flex-direction:column;gap:4px;min-height:76px;border-radius:22px}
.st-big small{font-size:12px;font-weight:500;opacity:.85}
.st-done{display:flex;flex-direction:column;align-items:center;text-align:center;padding-top:32px}
.st-check{width:96px;height:96px;border-radius:30px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.st-check.pop{animation:pop var(--dur-spring) var(--spring) both}
@keyframes pop{from{transform:scale(.6);opacity:0}}
.st-done h2{margin:24px 0 8px;font-size:26px;font-weight:700}
.st-fin{margin-top:8px;font-weight:600;color:var(--accent)}
.st-stats{align-self:stretch;display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:24px}
.st-stat{display:flex;flex-direction:column;gap:4px;padding:16px 8px;border-radius:22px;background:var(--surface);box-shadow:var(--shadow-1)}
.st-stat b{font-size:32px;font-weight:700}
.st-stat span{font-size:13px;color:var(--muted)}
.st-preview{align-self:stretch;margin-top:12px;padding:16px;border-radius:22px;background:var(--surface);box-shadow:var(--shadow-1);text-align:left;font-size:14px;line-height:1.6;color:var(--ink-2)}
/* 复习（规格 6.1）：连续进度条、翻面、三个评分按钮 */
.st-bar{flex:1;height:8px;border-radius:4px;background:var(--rule);overflow:hidden}
.st-bar i{display:block;height:100%;border-radius:4px;background:var(--accent);transition:width var(--dur) var(--ease)}
.st-flip{cursor:pointer;min-height:260px;justify-content:center}
.st-src{align-self:stretch;text-align:left;font-size:14px;line-height:1.6;color:var(--ink-2)}
.st-src .lbl{display:block;font-size:12px;color:var(--muted)}
.st-src .hl{background:var(--accent-soft);color:var(--accent);border-radius:6px;padding:1px 2px}
.st-grades{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.st-grades .st-big{min-height:64px;border-radius:18px}
/* 我的生词（规格 6.3） */
/* 底部留白固定（够放下选择模式的操作栏），操作栏出现、消失时列表不变 */
.words-list{display:flex;flex-direction:column;gap:12px;padding:4px 0 calc(112px + env(safe-area-inset-bottom,0px))}
.wtools{display:flex;flex-direction:column;gap:12px;padding:4px 0 16px}
input[type=search]{-webkit-appearance:none;appearance:none}
/* 筛选标签放不下时在这一行里左右滑，不让整页横着滚 */
.wtabs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.wtabs::-webkit-scrollbar{display:none}
.wtabs .btn{flex:none;padding:8px 12px;white-space:nowrap;gap:4px}
.wtabs .btn .num{opacity:.75}
#wSelect,#wSelAll{min-height:44px}
#wSelect,#wSelAll,#wDone{width:60px;padding-inline:0}
.btn.wrow.selected{box-shadow:0 0 0 2px var(--accent),var(--cur-glow)}
/* 选择模式的底部操作栏：三个按钮放在一块不透明的底板上 */
.wact{display:flex;gap:8px;padding:8px;border-radius:24px;background:var(--surface);box-shadow:var(--shadow-3),0 0 0 1px var(--rule)}
.wact .btn{flex:1;min-height:48px;padding:8px;border-radius:16px;font-size:15px}
.btn.wrow{display:flex;align-items:center;justify-content:flex-start;gap:12px;width:100%;min-height:64px;padding:12px 16px;border-radius:22px;text-align:left;font-weight:400}
.btn.wrow.is-pressed{transform:scale(.98)}
.wrow .ww{flex:none;min-width:44px;font-size:22px;font-weight:700}
.wrow .wm{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.wrow .wm .jp{font-size:13px;font-weight:600}
.wrow .wm .zh{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wrow .wd{flex:none;font-size:12px;color:var(--muted)}
.wrow .wd.on{color:var(--accent);font-weight:600}
.wsheet{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.wsheet .st-ch .hz{font-size:56px}
.wsheet .st-ch .jp{font-size:18px;font-weight:700}
.wsheet .row{display:flex;gap:12px;align-self:stretch}
.wsheet .row .btn{flex:1}
.st-anim.out{animation:stOut var(--dur) var(--ease) both}
.st-anim.in{animation:stIn var(--dur-spring) var(--spring) both}
@keyframes stOut{to{transform:translateX(-30%);opacity:0}}
@keyframes stIn{from{transform:translateX(30%);opacity:0}}
@media (prefers-reduced-motion: reduce){@keyframes stOut{to{opacity:0}}@keyframes stIn{from{opacity:0}}@keyframes pop{from{opacity:0}}}
/* 首页「今天的学习」卡片（设计规范 5.4） */
.today{background:var(--accent);color:var(--on-accent);border-radius:28px;padding:16px;margin-bottom:24px;box-shadow:var(--shadow-2)}
.today-head{font-size:17px;font-weight:700;margin-bottom:12px}
/* 打卡（开发规格 7.9.5）：首页标题下面一行。按钮 44px 高，用负 margin 让文字离标题还是 24px */
/* 首页第二行（v0.37，设计图 home-top.png 方案 B）：本周打卡卡片。左边七个小方格（打卡填主色、休息日虚线框、今天没打卡是主色空心框），
   右边细竖线隔开的连续天数（断了显示累计）。整张卡片可点，进打卡日历 */
.streak{display:flex;align-items:center;gap:16px;width:100%;min-height:44px;margin:0 0 16px;padding:12px 16px;border:0;border-radius:20px;background:var(--surface);box-shadow:var(--shadow-1);
  font:inherit;color:var(--ink);text-align:left;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:background-color var(--dur) var(--ease)}
.wk-grid{flex:1;min-width:0;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px 8px;justify-items:center}
.wk-h{font-size:12px;line-height:16px;color:var(--muted)}
.wk-day{display:block;width:100%;max-width:28px;aspect-ratio:1;border-radius:8px;background:var(--rule)}
.wk-day[data-st="done"],.wk-day[data-st="more"]{background:var(--accent)}
.wk-day.rest{background:transparent;border:1.5px dashed var(--muted)}
.wk-day.is-today:not([data-st]){background:transparent;border:2px solid var(--accent)}
.wk-stat{flex:none;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:48px;padding-left:16px;border-left:1px solid var(--rule)}
.wk-lbl{font-size:12px;line-height:16px;color:var(--muted)}
.wk-val{font-size:13px;color:var(--ink);white-space:nowrap}
.wk-num{font-family:var(--font-latin);font-size:22px;font-weight:700;line-height:1;color:var(--accent)}
.streak.is-pressed{background:var(--surface-press)}
#restNote .banner{margin:0 0 16px}
/* 休息卡：三个小卡片，有几张就填满几个，其余是空框，后面写「N/3」 */
.tokens{display:inline-flex;align-items:center;gap:4px;vertical-align:middle;white-space:nowrap}
.tokens svg{flex:none;fill:none;stroke:var(--accent);stroke-width:1.5}
.tokens svg.on{fill:var(--accent)}
.tokens b{margin-left:4px;font-weight:700;color:var(--ink)}
/* 日历格子：首页日历页和完成页的本周共用。颜色深浅 = 当天新学的词 + 复习的词 */
.cal-day{position:relative;aspect-ratio:1;max-width:100%;border-radius:12px;background:var(--rule);display:grid;place-items:center;font-size:13px;color:var(--ink-2);font-variant-numeric:tabular-nums}
/* 打卡的日子都一样用主色填满（不按学习量分深浅）；多学了的日子右上角一颗小星 */
.cal-day[data-st="done"],.cal-day[data-st="more"]{background:var(--accent);color:var(--on-accent)}
.cal-day .star{position:absolute;top:4px;right:4px;width:8px;height:8px;fill:var(--on-accent)}
.cal-day.rest{background:transparent;border:1.5px dashed var(--muted);color:var(--muted)}
.cal-day.is-today{outline:2px solid var(--accent);outline-offset:1px}
.cal-day.fill{animation:calFill var(--dur-spring) var(--spring) both}
@keyframes calFill{from{transform:scale(.6)}to{transform:scale(1)}}
/* 日历页：上面四格统计，下面月历直接放在页面上（不放卡片里，窄屏上每格也能有 44px） */
.cal{display:flex;flex-direction:column;gap:16px;padding-block:8px calc(32px + env(safe-area-inset-bottom,0px))}
/* 统计卡片（2026-10-30 改，设计图 docs/design/calendar-stats.png 方案 B）：上面三列数字，下面一条休息卡横栏。
   分隔线比 --rule 再浅一点（和卡片底色混合），以后换皮肤也跟着变 */
.cal-stats{--cal-line:color-mix(in srgb,var(--rule) 55%,var(--surface));border-radius:24px;background:var(--surface);box-shadow:var(--shadow-1);overflow:hidden}
.cal-nums{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));padding-block:16px}
.cal-num{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0;text-align:center}
.cal-num+.cal-num{border-left:1px solid var(--cal-line)}
.cal-num .lbl{font-size:12px;line-height:1.4;color:var(--muted)}
.cal-num b{font-size:28px;font-weight:700;line-height:1.15;color:var(--ink)}
.cal-num b small{font-family:var(--font-cjk);font-size:13px;font-weight:500;margin-left:4px;color:var(--ink)}
.cal-num.now b{color:var(--accent)}
.cal-tokens{display:flex;align-items:center;flex-wrap:wrap;gap:8px;padding:12px 16px;border-top:1px solid var(--cal-line);font-size:13px}
.cal-tokens .lbl{font-weight:700;color:var(--ink)}
.cal-tokens .tk{display:flex;gap:4px}
.cal-tokens .tk i{width:14px;height:18px;border-radius:4px;border:2px solid color-mix(in srgb,var(--accent) 30%,var(--surface))}
.cal-tokens .tk i.on{background:var(--accent);border-color:var(--accent)}
.cal-tokens .n{color:var(--muted)}
.cal-tokens .sub{margin-left:auto;font-size:12px;color:var(--muted);text-align:right}
.cal-nav{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:8px}
.cal-nav b{font-size:17px}
.cal-nav .btn:disabled{opacity:.35}
.cal-head,.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal-head span{text-align:center;font-size:12px;color:var(--muted)}
.cal-grid .cal-day{min-height:44px;padding:0;border:0;font:inherit;font-size:14px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.cal-grid .cal-day.rest{border:1.5px dashed var(--muted);font-size:12px}
.cal-grid .cal-day:disabled{opacity:.4;cursor:default}
.cal-grid .cal-day.sel{box-shadow:inset 0 0 0 2px var(--ink)}
.cal-grid .cal-day.is-pressed{opacity:.7}
.cal-detail{min-height:24px;font-size:15px;color:var(--ink-2)}
.cal-legend{display:flex;align-items:center;flex-wrap:wrap;gap:8px;font-size:12px;color:var(--muted)}
.cal-legend .cal-day{width:16px;border-radius:4px}
.cal-legend .cal-day .star{top:2px;right:2px;width:6px;height:6px}
.cal-legend .gap{width:8px}
.st-week{align-self:stretch;display:flex;flex-direction:column;gap:8px;margin-top:24px}
.st-week .wk{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.st-week .wk-h{font-size:12px;color:var(--muted);text-align:center}
.st-streak{margin-top:4px;font-size:15px;color:var(--ink-2)}
.st-streak b{font-weight:700;color:var(--ink)}
/* 数字向上翻：两行叠在一起，整列往上移一行 */
.flip{display:inline-block;height:1.5em;line-height:1.5em;overflow:hidden;vertical-align:bottom}
.flip>span{display:flex;flex-direction:column;transition:transform var(--dur) var(--ease)}
.flip.go>span{transform:translateY(-1.5em)}
.today-cell{background:var(--hero-tile);border-radius:20px;padding:12px 16px}
.today-cells{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.today-cells .lbl{margin-bottom:4px}
.today .today-link{width:100%;margin-top:4px;color:var(--on-accent);opacity:.85;text-decoration:underline;text-underline-offset:3px}
/* 只有一格（新学）时不用大方块：紧凑的一行「新学 4 句 · 歌名 第 1–4 句」 */
.today-line{margin:0 0 16px;font-size:15px;font-weight:600;line-height:1.5}
.today-line .big{font-size:30px;margin:0 4px}
.today-line .today-src{font-size:14px;font-weight:500;opacity:.85}
.today-line .done-mark{font-size:20px;font-weight:700}
.today-cell .lbl{display:block;font-size:13px;font-weight:600;opacity:.85}
.today .big{font-size:28px;font-weight:700;margin-right:4px}
.today-sub{font-size:13px;line-height:1.6;margin:12px 0 16px;opacity:.85}
.today .today-btn{width:100%;min-height:48px;background:var(--hero-btn);color:var(--hero-btn-ink);font-size:16px}
.today .today-btn.is-pressed{background:color-mix(in srgb,var(--hero-btn) 88%,var(--hero-btn-ink))}
.today-picks{display:flex;flex-direction:column;gap:8px}
.today-picks .today-btn{justify-content:flex-start;min-height:48px;font-size:15px;color:var(--hero-btn-ink)}
.sec-title{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px;font-size:15px;font-weight:600}
.sec-title .jp{font-weight:600}
.tones{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-bottom:24px}
/* 声调键帽（设计规范 5.2）：像实体按键，两层。底座（声调色）固定不动，平时露出键面下方 4px；
   按下时只有键面往下移 4px 盖住底座。按钮本身不移动，也不用 box-shadow 画底边 */
.tones .key{--tone:var(--muted);position:relative;height:66px;padding:0;border:0;background:none}
.tones .key-base{position:absolute;left:0;right:0;top:4px;bottom:0;border-radius:18px;background:var(--tone)}
.tones .key-face{position:absolute;left:0;right:0;top:0;bottom:4px;border-radius:18px;background:var(--surface);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  transition:transform var(--dur-spring) var(--spring),background-color 100ms var(--ease)}
.tones .key.is-pressed .key-face{transform:translateY(4px);background:var(--surface-press);transition:transform 100ms var(--ease),background-color 100ms var(--ease)}
.tones .key .hz{font-size:22px;font-weight:600;line-height:1.1}
.tones .key .jp{font-size:12px;font-weight:600;color:var(--tone)}
.tones .key .hz,.tones .key .jp{transition:opacity var(--dur) var(--ease)}
.tones .key.fade .hz,.tones .key.fade .jp{opacity:0}
#btnToneNext.spin svg{animation:spin 400ms var(--ease)}
@keyframes spin{to{transform:rotate(360deg)}}
/* 设置齿轮：手指按下就开始转 60 度（0.5 秒，平缓减速，不回弹），抬手后接着转完、同时跳转；
   按下后移开取消，平滑转回原位。齿轮是对称的，转太多看起来像转了好几圈 */
#btnSettings svg{transition:transform 500ms cubic-bezier(.33,1,.68,1)}
#btnSettings.turn svg{transform:rotate(60deg)}
.songs{display:flex;flex-direction:column;gap:12px}
/* 首页底部版本号（连点 3 下开关调试面板），下面留出「＋ 导入新歌」的位置 */
.ver{text-align:center;font-size:12px;color:var(--muted);padding:20px 0 calc(24px + 56px + 24px + env(safe-area-inset-bottom,0px));-webkit-user-select:none;user-select:none}
/* 调试面板（v0.32）：收起时是屏幕边上 44px 的半透明小圆按钮（可拖动，松手吸到最近的左边或右边，不放在屏幕顶部——会染状态栏）；
   展开后占屏幕下半部分，内容能滚动，没有暗幕，上面的页面照常能点 */
.dbg-fab{position:fixed;z-index:62;left:calc(100vw - 52px);top:60vh;width:44px;height:44px;padding:0;border:0;border-radius:50%;display:grid;place-items:center;
  background:var(--inverse);color:var(--on-inverse);opacity:.5;box-shadow:var(--shadow-3);touch-action:none;-webkit-tap-highlight-color:transparent;
  transition:left var(--dur) var(--ease),top var(--dur) var(--ease),opacity var(--dur) var(--ease)}
.dbg-fab.dragging{transition:none;opacity:.8}
.dbg-fab[aria-expanded="true"]{opacity:.85}
.dbg-panel{position:fixed;left:0;right:0;bottom:0;z-index:61;height:50vh;height:50dvh;display:flex;flex-direction:column;background:var(--surface);border-radius:22px 22px 0 0;box-shadow:var(--shadow-sheet)}
.dbg-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 16px;border-bottom:1px solid var(--rule);font-size:15px;color:var(--ink)}
.dbg-body{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;gap:8px;padding:12px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.dbg{flex-shrink:0;padding:8px 12px;border-radius:12px;background:var(--inverse);color:var(--on-inverse);font:10.5px/1.35 ui-monospace,Menlo,monospace;white-space:pre-wrap;word-break:break-all}
.dbg b{font-weight:700}
.dbg-sim{flex-shrink:0;display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:12px 16px;border-radius:18px;background:var(--bg);font-size:13px;color:var(--ink-2)}
.dbg-sim .lbl{flex-basis:100%}
.dbg-err{flex-basis:100%;margin:0;max-height:240px;overflow:auto;white-space:pre-wrap;word-break:break-all;font-size:12px;line-height:1.5;color:var(--ink)}
.dbg-sim input{min-height:44px;font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--field-border);border-radius:12px;padding:8px 12px}
.song{display:flex;align-items:center;gap:12px;padding:16px;border-radius:22px;background:var(--surface);box-shadow:var(--shadow-1);text-align:left;width:100%;
  cursor:pointer;transition:transform var(--dur-fast) var(--ease),background-color var(--dur-fast) var(--ease)}
.song.is-pressed{transform:scale(.98);background:var(--surface-press)}
.song .sq{flex:none;width:56px;height:56px;border-radius:18px;display:grid;place-items:center;font-size:24px;font-weight:700;background:var(--sq-bg);color:var(--sq-ink)}
.song .meta{flex:1;min-width:0}
.song .ttl{font-weight:600;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.song .sub{font-size:13px;color:var(--muted);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* 多选删除：勾选框、选中的卡片、撤销提示条。
   勾选框浮在卡片右边（absolute），不推动卡片里的任何东西：首字方块、歌名、生词都不动（视觉对齐规则 4.4）。
   歌名右边让出勾选框的位置（只是变窄，左边缘不动）；生词右边的「x 天后复习」在选择模式里藏起来，位置给勾选框 */
.song,.btn.wrow{position:relative}
.song .check,.wrow .check{position:absolute;right:16px;top:50%;margin-top:-13px}
.song:has(.check) .meta{padding-right:40px}
.wrow:has(.check) .wd{visibility:hidden}
.song .check,.wrow .check{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;box-shadow:inset 0 0 0 2px var(--rule);color:var(--on-accent);transition:background-color var(--dur-fast) var(--ease)}
.song .check svg,.wrow .check svg{opacity:0}
.song.selected{box-shadow:0 0 0 2px var(--accent),var(--cur-glow)}
.song.selected .check,.wrow.selected .check{background:var(--accent);box-shadow:none}
.song.selected .check svg,.wrow.selected .check svg{opacity:1}
/* 「选择」「完成」宽度固定；「我的歌」这一行固定 24px 高（= 按钮 44px 减去上下 -10px），
   进入选择模式「选择」藏起来时这一行不变矮，下面的歌曲列表和版本号不会往上移 */
#btnSelect{min-height:44px;width:60px;padding-inline:0;margin:-10px -16px -10px 0}
#btnDone{width:60px;padding-inline:0}
.sec-title{min-height:24px}
.snack{position:fixed;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));bottom:calc(96px + env(safe-area-inset-bottom,0px));z-index:21;max-width:520px;margin:0 auto;
  display:flex;align-items:center;justify-content:space-between;gap:12px;padding:4px 8px 4px 16px;border-radius:18px;background:var(--inverse);color:var(--on-inverse);font-size:15px;box-shadow:var(--shadow-3)}
/* 首页左右边距是 20px，首页的删除栏和撤销提示条也对齐 20px */
#btnDelSel,#snack{left:max(20px,env(safe-area-inset-left,0px));right:max(20px,env(safe-area-inset-right,0px))}
.snack .btn.text{color:var(--on-inverse);font-weight:700;text-decoration:underline;text-underline-offset:3px}
.chip{display:inline-block;font-size:12px;font-weight:600;padding:4px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);margin-right:4px}
.empty{padding:16px;border-radius:22px;background:var(--surface);box-shadow:var(--shadow-1)}
.empty ol{margin:12px 0 16px;padding-left:20px;display:grid;gap:8px;color:var(--ink-2);font-size:14px;line-height:1.6}
/* 「我的歌」底部渐进模糊：越往下越模糊。几层 backdrop-filter，每层用 mask-image 只露出一段。
   不能有背景色（iOS 26 Safari 用屏幕边缘 fixed 元素的颜色染浏览器界面，见 7.4），不能点，在「＋ 导入新歌」下面 */
.edge-blur{position:fixed;left:0;right:0;bottom:0;height:calc(80px + env(safe-area-inset-bottom,0px));z-index:19;pointer-events:none}
.edge-blur>i{position:absolute;inset:0;pointer-events:none;-webkit-backdrop-filter:blur(var(--b));backdrop-filter:blur(var(--b));
  -webkit-mask-image:linear-gradient(to bottom,transparent var(--m0),#000 var(--m1),#000 var(--m2),transparent var(--m3));
  mask-image:linear-gradient(to bottom,transparent var(--m0),#000 var(--m1),#000 var(--m2),transparent var(--m3))}
/* 高度由 fitEdgeBlur() 按「＋ 导入新歌」的位置算（上边缘和按钮上边缘对齐），上面的 80px 只是算出来之前的初值。
   上边缘不模糊，往下逐层加强，最强 4px，还能隐约看出下面的卡片 */
.edge-blur>i:nth-child(1){--b:1px;--m0:0%;--m1:25%;--m2:50%;--m3:75%}
.edge-blur>i:nth-child(2){--b:2px;--m0:25%;--m1:50%;--m2:75%;--m3:100%}
.edge-blur>i:nth-child(3){--b:3px;--m0:50%;--m1:75%;--m2:100%;--m3:101%}
.edge-blur>i:nth-child(4){--b:4px;--m0:75%;--m1:100%;--m2:101%;--m3:102%}
.fab{position:fixed;right:max(20px,env(safe-area-inset-right,0px));bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:20;
  min-height:56px;padding:0 24px;border-radius:999px;box-shadow:var(--shadow-3)}

/* 页面切换：前进时新页从右边滑入，旧页往左移并变暗；返回反过来 */
body > section{position:relative;background:var(--bg);min-height:100dvh}
.nav-layer{position:fixed!important;left:0;right:0;pointer-events:none}
.enter-fwd{animation:enterFwd var(--dur-slow) var(--ease) both}
.leave-fwd{animation:leaveFwd var(--dur-slow) var(--ease) both}
.enter-back{animation:enterBack var(--dur-slow) var(--ease) both}
.leave-back{animation:leaveBack var(--dur-slow) var(--ease) both}
@keyframes enterFwd{from{transform:translateX(30%);opacity:0}to{transform:none;opacity:1}}
@keyframes leaveFwd{from{transform:none}to{transform:translateX(-8%)}}
@keyframes enterBack{from{transform:translateX(-8%)}to{transform:none}}
/* 变暗用一层半透明遮罩（不用 filter：iPhone 上 filter 每一帧都要重画整页，会卡） */
.leave-fwd::after,.enter-back::after{content:"";position:absolute;inset:0;z-index:30;background:var(--nav-dim);pointer-events:none;animation:dimIn var(--dur-slow) var(--ease) both}
.enter-back::after{animation-name:dimOut}
@keyframes dimIn{from{opacity:0}to{opacity:1}}
@keyframes dimOut{from{opacity:1}to{opacity:0}}
@keyframes leaveBack{from{transform:none;opacity:1}to{transform:translateX(30%);opacity:0}}
body.navigating .player,body.navigating .bottom-bar:not([data-page]),body.navigating .study-foot{opacity:0;transition:none}
/* 浮动播放条、学习页底部按钮：页面滑入后从下方滑入并淡入（带一点回弹）；离开时没有动画，跟着切页直接隐藏。
   「＋ 导入新歌」和导入页「保存」是常驻按钮（[data-page]），没有动画 */
.player.bar-in,.study-foot.bar-in{animation:barIn var(--dur-slow) var(--ease) both}
@keyframes barIn{0%{transform:translateY(120%);opacity:0}70%{transform:translateY(-6px);opacity:1}100%{transform:none;opacity:1}}
@keyframes barFade{from{opacity:0}to{opacity:1}}
.fab,.bottom-bar{transition:transform var(--dur-fast) var(--ease),background-color var(--dur-fast) var(--ease),opacity var(--dur) var(--ease)}

/* Top bar：不透明，避免 iOS 顶部模糊 */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg)}
.bar .wrap{display:flex;align-items:center;gap:12px;min-height:64px}
.bar .tt{flex:1;min-width:0}
.bar .tt b{display:block;font-size:17px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .tt span{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Lyrics：当前句白卡片 + 紫色描边，其他句 .6 透明度 */
.banner{margin-top:8px;padding:12px 16px;border-radius:18px;background:var(--accent-soft);color:var(--ink-2);font-size:14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.lyrics{padding-block:12px calc(230px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px}
.line{position:relative;padding:24px 16px 12px;border-radius:22px;opacity:.6;
  transition:opacity var(--dur) var(--ease),background-color var(--dur) var(--ease),box-shadow var(--dur) var(--ease)}
.line.cur{opacity:1;background:var(--surface);box-shadow:0 0 0 2px var(--accent),var(--cur-glow)}
.line .ln{position:absolute;left:8px;top:0;height:44px;min-width:44px;padding:4px 8px 0;display:flex;align-items:flex-start;
  font-family:var(--font-latin);font-size:12px;font-weight:500;color:var(--muted);font-variant-numeric:tabular-nums}
.line.cur .ln{color:var(--accent);font-weight:600}
.line.loop .ln::after{content:" ↻";white-space:pre;color:var(--accent)}
.chars{position:relative;z-index:1;display:flex;flex-wrap:wrap;row-gap:8px;align-items:flex-end}
.grp{display:inline-flex;flex-wrap:nowrap;align-items:flex-end}
.c{display:inline-flex;flex-direction:column;align-items:center;padding:0 1px;border-radius:8px;min-width:1.15em}
.c .jp{font-size:12px;font-weight:600;line-height:16px;height:16px;white-space:nowrap}
.c .hz{font-size:22px;font-weight:500;line-height:1.3;transition:font-size var(--dur) var(--ease)}
.line.cur .c .hz{font-size:26px;font-weight:700}
.c.key .hz{text-decoration:underline wavy var(--accent);text-decoration-thickness:1.5px;text-underline-offset:6px}
.c.ov .jp{text-decoration:underline dotted}
.c.sel{background:var(--accent-soft)}
.c.punct .hz{color:var(--muted)}
.sp{width:.7em}
.summary{margin-top:8px;padding:16px;border-radius:22px;background:var(--surface);box-shadow:var(--shadow-1);font-size:14px;line-height:1.6;color:var(--ink-2)}
.summary .label{display:block;margin-bottom:4px}
.hide-jp .c .jp{display:none}

/* 浮动播放条 */
.player{position:fixed;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));bottom:calc(32px + env(safe-area-inset-bottom,0px));
  z-index:25;max-width:700px;margin:0 auto;padding:12px 16px;border-radius:30px;background:var(--surface);box-shadow:var(--player-shadow);
  display:flex;flex-direction:column;gap:8px}
.player .wrap{padding:0;display:flex;flex-direction:column;gap:8px;width:100%}
.prog{display:flex;align-items:center;gap:12px;font-family:var(--font-latin);font-size:12px;font-weight:500;color:var(--muted);font-variant-numeric:tabular-nums}
.prog input{flex:1;min-width:0;height:20px;margin:0;background:transparent;-webkit-appearance:none;appearance:none}
.prog input::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:linear-gradient(to right,var(--accent) var(--p,0%),var(--accent-soft) var(--p,0%))}
.prog input::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;margin-top:-4px;border-radius:50%;background:var(--accent);border:0}
.prog input::-moz-range-track{height:6px;border-radius:3px;background:var(--accent-soft)}
.prog input::-moz-range-progress{height:6px;border-radius:3px;background:var(--accent)}
.prog input::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:var(--accent);border:0}
.ctrls{display:flex;align-items:center;justify-content:space-between;gap:4px}
.ib{width:48px;height:48px;display:grid;place-items:center;border-radius:16px;color:var(--ink);transition:transform var(--dur-fast) var(--ease),background-color var(--dur-fast) var(--ease)}
.ib.is-pressed{transform:scale(.94);background:var(--surface-press)}
.ib.on{color:var(--accent);background:var(--accent-soft)}
.ib.play{width:58px;height:58px;border-radius:20px;background:var(--accent);color:var(--on-accent)}
.ib.play.is-pressed{background:var(--accent-press)}
.ib.rate{width:auto;min-width:56px;padding:0 12px;font-family:var(--font-latin);font-size:16px;font-weight:600;font-variant-numeric:tabular-nums}

/* Import + sync：每一步是一张白卡片，保存按钮固定在底部 */
.form{display:flex;flex-direction:column;gap:12px;padding-block:8px calc(110px + env(safe-area-inset-bottom,0px))}
.card{background:var(--surface);border-radius:22px;box-shadow:var(--shadow-1);padding:16px;scroll-margin-top:calc(env(safe-area-inset-top,0px) + 76px);transition:box-shadow var(--dur) var(--ease)}
.card.need{box-shadow:0 0 0 2px var(--accent),var(--cur-glow)}
.field{display:flex;flex-direction:column;gap:12px}
.seg{display:flex;gap:8px}
.seg .btn{flex:1}
.stepper{display:flex;align-items:center;justify-content:center;gap:16px;margin-top:4px}
.stepper .btn{font-size:22px;font-weight:600}
#goalNum{min-width:48px;text-align:center;font-size:28px;font-weight:700}
.field > textarea + .note{margin-top:4px}
.field > .note:empty{display:none}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row > *{min-width:0}
.filebox{display:flex;align-items:center;gap:12px;padding:12px;border-radius:18px;border:2px dashed var(--rule);cursor:pointer}
/* 看不见的选文件框：钉在所在框的左上角。iPhone 会给选文件框一个最小宽度，不管 width:1px，
   以前它放在「更换音频」按钮文字后面，超出了屏幕右边，把编辑歌曲页撑宽（能左右拖、弹窗右上角被切） */
.filebox,label.btn{position:relative}
label.btn{overflow:hidden}
.filebox input[type=file],label.btn input[type=file]{position:absolute;left:0;top:0;width:1px;height:1px;opacity:0;overflow:hidden;clip-path:inset(50%)}
.filebox .btn{flex:none;white-space:nowrap}
.note{font-size:13px;color:var(--muted);line-height:1.6}
/* 设置页：分组列表（设计规范 5.11） */
.set{padding-block:8px calc(32px + env(safe-area-inset-bottom,0px))}
.sgrp-t{margin:24px 0 8px;padding:0 16px;font-size:12px;font-weight:600;color:var(--muted)}
.set > .sgrp-t:first-child{margin-top:8px}
.sgrp{background:var(--surface);border-radius:22px;box-shadow:var(--shadow-1);overflow:hidden}
.sgrp > * + *{position:relative}
.sgrp > * + *::before{content:"";position:absolute;left:16px;right:0;top:0;height:1px;background:var(--rule)}
.cell,.cell-head{position:relative;display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;height:52px;padding:0 16px;margin:0;border:0;border-radius:0;background:transparent;font:inherit;font-size:16px;color:var(--ink);text-align:left;-webkit-tap-highlight-color:transparent}
.cell{cursor:pointer;overflow:hidden;transition:background-color var(--dur) var(--ease)}
.cell.is-pressed{background:var(--surface-press)}
.cell-n{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell-v{display:flex;align-items:center;gap:8px;flex-shrink:0;font-size:15px;color:var(--muted)}
.cell-v .stale{color:var(--danger);font-weight:600}
.cell input[type=file]{position:absolute;left:0;top:0;width:1px;height:1px;opacity:0;overflow:hidden;clip-path:inset(50%)}
.cell-goal .seg{padding:0 16px 16px}
.cell-goal .seg .btn{flex:1 1 0;min-width:0;height:44px;padding:0}
.cell-goal .stepper{margin:0;padding:0 16px 16px}
.sgrp-note{padding:8px 16px 0;font-size:13px;line-height:1.6;color:var(--muted)}
.tip-link{display:block;width:100%;min-height:44px;margin:0;border:0;background:none;font:inherit;font-size:13px;line-height:1.6;text-align:left;color:var(--accent);cursor:pointer;-webkit-tap-highlight-color:transparent}
/* 添加到主屏幕教程（v0.38，设计规范 5.17）：底部弹窗（只有按钮，没有输入框），左右翻的步骤，每步一张截图 + 一句说明 */
.a2-track{display:flex;gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.a2-track::-webkit-scrollbar{display:none}
.a2-step{flex:0 0 100%;scroll-snap-align:start;display:flex;flex-direction:column;gap:12px}
.a2-shot{position:relative;display:grid;place-items:center;height:240px;border-radius:16px;background:var(--bg);border:1px dashed var(--field-border);overflow:hidden;color:var(--muted);font-size:13px}
.a2-shot img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:var(--bg)}
.a2-text{margin:0;font-size:15px;line-height:1.6;color:var(--ink)}
.a2-nav{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px}
.a2-dots{display:flex;gap:8px}
.a2-dots i{width:8px;height:8px;border-radius:4px;background:var(--rule);transition:width var(--dur) var(--ease),background-color var(--dur) var(--ease)}
.a2-dots i.on{width:20px;background:var(--accent)}
/* 兑换码弹窗（设计规范 5.15）：输入框 + 提示（固定高度，出现提示时按钮不挪动）+ 兑换按钮 */
.rd-msg{min-height:20px;font-size:14px;line-height:20px;color:var(--danger)}
.rd-note{margin:0;padding:0 4px}
/* 开发者模式页面（设计规范 5.15）：开关、模拟日期、危险操作 */
.sw{flex:none;position:relative;width:51px;height:31px;border-radius:16px;background:var(--rule);transition:background-color var(--dur) var(--ease)}
.sw i{position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:var(--surface);box-shadow:0 0 0 1px var(--field-border);transition:transform var(--dur) var(--ease)}
.sw.on{background:var(--accent)}
.sw.on i{transform:translateX(20px);box-shadow:none}
.cell.danger{color:var(--danger)}
.dev-sim{display:flex;flex-direction:column;gap:12px;padding:16px}
.dev-sim .sim-lbl{font-size:15px;color:var(--ink)}
.dev-sim .row{gap:8px}
.dev-sim input{min-height:44px;font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--field-border);border-radius:12px;padding:8px 12px}
.dev-last{margin-top:24px}
/* 设置 › 皮肤（设计规范 5.13）：每个皮肤一张卡片；正在用的主色描边；没解锁的预览半透明 */
.skins{display:flex;flex-direction:column;gap:12px;padding-block:8px calc(32px + env(safe-area-inset-bottom,0px))}
.skins-note{margin:0;padding:0 4px;font-size:15px;line-height:1.6;color:var(--ink-2)}
.skins-list{display:flex;flex-direction:column}
.skins-list > .skins-sec:first-child .sgrp-t{margin-top:4px}
.skins-group{display:flex;flex-direction:column;gap:12px}
.skin-card{display:flex;align-items:center;gap:16px;width:100%;padding:16px;margin:0;border:2px solid transparent;border-radius:22px;background:var(--surface);box-shadow:var(--shadow-1);
  font:inherit;color:var(--ink);text-align:left;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:background-color var(--dur) var(--ease)}
.skin-card.current{border-color:var(--accent)}
.skin-card.is-pressed{background:var(--surface-press)}
.skin-card.locked .skin-prev{opacity:.5}
.skin-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.skin-head{display:flex;align-items:baseline;flex-wrap:wrap;gap:8px}
.skin-name{font-size:17px;font-weight:700}
.skin-mode{font-size:13px;color:var(--muted)}
.skin-cond{font-size:14px;line-height:1.5;color:var(--ink-2)}
.skin-cond.ok{color:var(--accent);font-weight:600}
.skin-prog{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.skin-bar{flex:1;height:6px;border-radius:3px;background:var(--rule);overflow:hidden}
.skin-bar i{display:block;height:100%;border-radius:3px;background:var(--accent)}
.skin-pill{flex:none;display:inline-flex;align-items:center;height:32px;padding:0 12px;border-radius:16px;font-size:14px;font-weight:600;white-space:nowrap;background:var(--accent-soft);color:var(--accent)}
.skin-pill.on{background:var(--accent);color:var(--on-accent)}
.skin-pill.off{background:var(--surface-press);color:var(--muted)}
/* 皮肤预览：颜色来自预览元素上的 --p-* 变量（skinPreview 按皮肤颜色写进去），不用图片 */
/* 解锁弹窗（设计规范 5.13） */
.unlock{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.unlock-why{font-size:13px;font-weight:700;color:var(--accent)}
.sheet .unlock-title{margin:0;font-size:24px;font-weight:700;line-height:1.3;color:var(--ink)}
.unlock .skin-prev{margin:8px 0}
.unlock-intro{margin:0 0 8px;font-size:15px;line-height:1.6;color:var(--ink-2)}
.unlock .btn{width:100%}
.skin-prev{flex:none;display:flex;flex-direction:column;gap:4px;width:64px;height:88px;padding:8px;border-radius:16px;background:var(--p-bg);box-shadow:0 0 0 1px var(--rule)}
.skin-prev i{display:block}
.p-title{width:45%;height:8px;border-radius:4px;background:var(--p-surface)}
.p-hero{height:20px;border-radius:6px;background:var(--p-accent)}
.p-tones{display:flex;justify-content:space-between;gap:2px}
.p-tone{width:6px;height:6px;border-radius:50%;background:var(--p-t)}
.p-card{flex:1;border-radius:4px;background:var(--p-surface)}
.skin-prev.large{width:168px;height:200px;padding:12px;gap:8px;border-radius:28px;box-shadow:var(--shadow-2),0 0 0 1px var(--rule)}
.skin-prev.large .p-hero{height:56px;border-radius:12px}
.skin-prev.large .p-tones{gap:4px}
.skin-prev.large .p-tone{flex:1;width:auto;height:12px;border-radius:4px;background:var(--p-surface);box-shadow:inset 0 -3px 0 var(--p-t)}
.skin-prev.large .p-card{border-radius:10px}
/* 版本记录（CHANGELOG.md）：每个版本一张卡片 */
.cl h3{margin:0;font-size:17px;font-weight:700;color:var(--ink)}
.cl h4{margin:4px 0 0;font-size:15px;font-weight:600;color:var(--ink-2)}
.cl ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px;font-size:15px;line-height:1.6;color:var(--ink)}
.cl p{margin:0;font-size:15px;line-height:1.6;color:var(--ink)}
.cl .cl-warn{color:var(--danger);font-weight:600}
.ok{color:var(--t3);font-weight:600}
.err{color:var(--t1);font-weight:600}
.stale{color:var(--danger);font-weight:600}
.home-note{margin:0 0 12px}
.results{display:flex;flex-direction:column;gap:8px}
.res{display:flex;justify-content:space-between;gap:8px;min-height:56px;padding:12px 16px;border-radius:18px;background:var(--bg);text-align:left;width:100%;
  transition:transform var(--dur-fast) var(--ease),background-color var(--dur-fast) var(--ease)}
.res.is-pressed{transform:scale(.98);background:var(--surface-press)}
.res b{font-weight:600}
.bottom-bar{position:fixed;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:20;max-width:688px;margin:0 auto}
.sync-list{display:flex;flex-direction:column;gap:8px;padding-block:12px calc(240px + env(safe-area-inset-bottom,0px))}
.sl{display:flex;gap:12px;padding:16px;border-radius:22px;font-size:18px;opacity:.6;transition:opacity var(--dur) var(--ease),box-shadow var(--dur) var(--ease)}
.sl .tm{font-family:var(--font-latin);font-size:12px;font-weight:500;color:var(--muted);width:48px;flex:none;padding-top:4px;font-variant-numeric:tabular-nums}
.sl.next{opacity:1;background:var(--surface);box-shadow:0 0 0 2px var(--accent),var(--cur-glow)}
.sl.done{opacity:.6}
.tapbig{flex:1;min-height:56px;font-size:17px;border-radius:18px}

/* 编辑歌曲（原「校对歌词」） */
.proof{display:flex;flex-direction:column;gap:12px;padding-block:8px calc(200px + env(safe-area-inset-bottom,0px))}
.shift-card{display:flex;align-items:center;gap:12px}
.sc-txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.sc-txt b{font-size:15px;font-weight:700}
.sc-ctl{display:flex;align-items:center;gap:8px}
.sc-ctl .btn{font-size:22px;font-weight:600}
#shiftVal{min-width:56px;text-align:center;font-weight:600}
.pl-list{display:flex;flex-direction:column;gap:12px}
.pl{background:var(--surface);border-radius:22px;box-shadow:var(--shadow-1);transition:box-shadow var(--dur) var(--ease)}
.pl.open{box-shadow:0 0 0 2px var(--accent),var(--cur-glow)}
.pl-head{display:flex;gap:16px;align-items:baseline;width:100%;min-height:56px;padding:16px;text-align:left}
.pl-time{flex:none;min-width:48px;font-family:var(--font-latin);font-size:13px;font-weight:500;color:var(--muted);font-variant-numeric:tabular-nums}
.pl.open .pl-time{color:var(--accent);font-weight:600}
.pl-txt{font-size:17px;min-width:0}
.pl-body{padding:0 16px 16px;display:flex;flex-direction:column;gap:12px}
.pl-nudge{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.pl-nudge .btn{padding:8px 0;font-family:var(--font-latin);font-weight:600}
.pl-act,.pl-ops{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.audio-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.audio-row .note{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.audio-row .btn{flex:none}
.ctrls.solo{justify-content:center}
#prPlay .i-pause,#prPlay.playing .i-play{display:none}
#prPlay.playing .i-pause{display:block}

/* Sheet：从下面滑上来，可以往下拖关闭。
   弹出层不使用暗幕（设计规范 5.6）：Safari 的状态栏由它自己画，网页变暗时状态栏跟不上，会闪或者不协调。
   所以弹层后面不变暗，靠更明显的阴影 --shadow-sheet 浮在页面上；点外面关闭（确认类弹窗点外面不关，往下拖等于取消） */
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-width:720px;margin:0 auto;background:var(--surface);border-radius:34px 34px 0 0;
  max-height:88dvh;overflow:auto;overscroll-behavior-y:contain;box-shadow:var(--shadow-sheet);padding-bottom:env(safe-area-inset-bottom,0px);
  transform:translateY(100%);opacity:0;transition:transform var(--dur-slow) var(--ease),opacity var(--dur-slow) var(--ease)}
.sheet.open{transform:none;opacity:1}
.sheet.dragging{transition:none}
/* 弹窗统一间距（设计规范 5.6）：顶部 12px 后是拖动条，拖动条下 20px 是标题，标题和说明 8px，说明到按钮 24px，
   按钮之间 12px，左右 20px，底部 16px + 安全区（.sheet 自己的 padding-bottom） */
.sheet .wrap{padding:12px max(20px,env(safe-area-inset-right,0px)) 16px max(20px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px}
.grab{width:40px;height:5px;border-radius:3px;background:var(--rule);margin:0 auto 8px;flex:none}
.sheet h3{margin:0;font-size:17px;font-weight:700}
.sheet .wrap>p{margin:0}
.sheet .wrap>h3+.note,.sheet .wrap>h3+p{margin-top:-4px}
.sheet .wrap>.note+.btn,.sheet .wrap>p+.btn,.sheet .wrap>h3+.btn{margin-top:12px}
/* 下拉小菜单（设计规范 5.9）：挂在吸顶顶栏里，absolute 不是 fixed（顶部附近不能有带颜色的 fixed 元素，见 7.4），从「⋯」按钮的位置缩放淡入 */
.bar .wrap{position:relative}
.menu{position:absolute;z-index:30;min-width:200px;padding:8px;border-radius:16px;background:var(--surface);box-shadow:var(--shadow-menu);
  display:flex;flex-direction:column;transform-origin:top right;transform:scale(.92);opacity:0;
  transition:transform 180ms var(--ease),opacity 180ms var(--ease)}
.menu.open{transform:none;opacity:1;transition:transform var(--dur-spring) var(--spring),opacity 180ms var(--ease)}
.menu .btn{justify-content:flex-start;min-height:48px;border-radius:12px;background:none;box-shadow:none;font-weight:500}
.menu .btn.is-pressed{transform:none;background:var(--surface-press)}
.wc-top{display:flex;gap:16px;align-items:center}
.wc-top.long{flex-direction:column;align-items:stretch}
.wc-square{flex:none;display:flex;flex-wrap:wrap;max-width:100%;gap:8px;padding:16px;border-radius:28px;background:var(--accent-soft)}
.wc-ch{display:flex;flex-direction:column;align-items:center;cursor:pointer}
.wc-ch .jp{font-size:20px;font-weight:700;line-height:1.2}
.wc-ch .hz{font-size:56px;font-weight:700;line-height:1.1}
.wc-side{display:flex;flex-direction:column;gap:8px;min-width:0}
.wc-mean{font-size:22px;font-weight:600;line-height:1.3}
.wc-tags{display:flex;flex-wrap:wrap;gap:8px}
.tone-tag{display:inline-block;padding:4px 8px;border-radius:999px;font-size:12px;font-weight:600;color:var(--tc);background:color-mix(in srgb,var(--tc) 12%,transparent)}
.wc-tip,.tip{padding:12px 16px;border-radius:18px;background:var(--accent-soft);color:var(--ink-2);font-size:14px;line-height:1.6}
.wc-btns{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.btn.add-dashed{min-height:48px;border-radius:16px;background:none;box-shadow:none;color:var(--accent);border:2px dashed color-mix(in srgb,var(--accent) 40%,transparent)}
.btn.add-dashed.is-pressed{background:var(--accent-soft)}
.wc-known{min-height:48px;display:flex;align-items:center;justify-content:center;border-radius:16px;background:var(--bg);color:var(--muted);font-size:15px;font-weight:600}
.mean{font-size:17px}
.warn{padding:12px 16px;border-radius:18px;background:var(--accent-soft);color:var(--ink-2);font-size:13px;line-height:1.6}
.cands{display:flex;gap:8px;flex-wrap:wrap}
.cand{font-family:var(--font-latin);font-weight:600;font-size:15px;min-height:44px;padding:8px 12px;border-radius:12px;background:var(--bg)}
.cand[aria-pressed="true"]{background:var(--accent-soft);box-shadow:0 0 0 2px var(--accent)}
.steps{display:grid;gap:12px;counter-reset:s;margin:0;padding:0;list-style:none}
.steps li{display:grid;grid-template-columns:24px 1fr;gap:12px;align-items:start}
.steps li::before{counter-increment:s;content:counter(s);width:24px;height:24px;border-radius:50%;background:var(--accent);color:var(--on-accent);font-family:var(--font-latin);display:grid;place-items:center;font-size:13px;font-weight:700}
.msgs{font-size:13px;display:grid;gap:4px;max-height:180px;overflow:auto}

.toast{position:fixed;left:50%;bottom:calc(160px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--inverse);color:var(--on-inverse);padding:12px 16px;border-radius:18px;font-size:14px;max-width:min(90vw,420px);text-align:center;box-shadow:var(--shadow-3)}
</style>
</head>
<body>
<div id="splash" class="splash" aria-hidden="true"><img src="icons/icon-192.png" alt=""><div>唱学粤语</div></div>

<audio id="au" preload="auto" playsinline></audio>

<!-- HOME -->
<section id="home">
  <div class="wrap home">
    <header class="home-head">
      <h1 class="hdate" id="homeDate"></h1>
      <button class="btn soft small" id="btnDone" type="button" hidden>完成</button>
      <button class="btn soft icon" id="btnSettings" type="button" aria-label="设置"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
    </header>
    <button class="streak" id="streak" type="button"></button>
    <div id="restNote"></div>
    <div id="today" hidden></div>
    <div class="sec-title"><span>六个声调 · <span class="jp" id="toneSyl">si</span></span><button class="btn soft small" id="btnToneNext" type="button"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v5h-5"/></svg>换一组</button></div>
    <div class="tones" id="tones"></div>
    <div class="sec-title"><span>我的歌</span><button class="btn text small" id="btnSelect" type="button" hidden>选择</button></div>
    <div id="homeNote"></div>
    <div class="songs" id="songs"></div>
    <div class="ver num" id="appVer"></div>
  </div>
  <button class="btn danger-fill bottom bottom-bar" id="btnDelSel" type="button" hidden>删除（0）</button>
  <div class="snack" id="snack" hidden role="status"><span id="snackMsg"></span><button class="btn text small" id="snackUndo" type="button">撤销</button></div>
</section>

<!-- IMPORT -->
<section id="importView" hidden>
  <div class="bar"><div class="wrap">
    <button class="btn icon back" data-back type="button" aria-label="返回"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
    <div class="tt"><b>导入新歌</b><span>音频 + 歌词</span></div>
  </div></div>
  <div class="wrap form">
    <div class="field card">
      <div class="label">1 · 音频文件</div>
      <label class="filebox" for="fAudio">
        <input id="fAudio" type="file" accept="audio/*,.mp3,.m4a,.aac,.wav">
        <span class="btn soft small">选择音频</span>
        <span id="audioInfo" class="note">mp3 或 m4a。音乐 App 下载的加密文件不能用。</span>
      </label>
    </div>
    <div class="field card">
      <div class="label">2 · 歌名和歌手</div>
      <input id="fTitle" type="text" placeholder="歌名，例如：富士山下" autocomplete="off">
      <input id="fArtist" type="text" placeholder="歌手，例如：陳奕迅" autocomplete="off">
    </div>
    <div class="field card">
      <div class="label">3 · 歌词</div>
      <div class="row">
        <button class="btn soft small" id="btnSearch" type="button">在线搜索歌词</button>
        <label class="btn soft small" for="fLrc">选择 .lrc 文件<input id="fLrc" type="file" accept=".lrc,.txt,text/plain"></label>
      </div>
      <div id="searchOut" class="results"></div>
      <textarea id="fLyrics" placeholder="或者直接粘贴歌词。&#10;带时间轴的 LRC 格式，例如：[00:21.71] 第一句歌词&#10;没有时间轴的纯文本也可以，保存后边听边点来对齐。"></textarea>
      <div id="lyricsInfo" class="note"></div>
    </div>
  </div>
</section>

<!-- TAP SYNC -->
<section id="syncView" hidden>
  <div class="bar"><div class="wrap">
    <button class="btn icon back" data-back type="button" aria-label="返回"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
    <div class="tt"><b>打轴</b><span>每句歌词开始唱时，点一下大按钮</span></div>
  </div></div>
  <div class="wrap"><div class="sync-list" id="syncList"></div></div>
  <div class="player"><div class="wrap">
    <div class="prog"><span id="sCur">0:00</span><input id="sSeek" type="range" min="0" max="1" step="0.01" value="0" aria-label="播放进度"><span id="sDur">0:00</span></div>
    <div class="row" style="flex-wrap:nowrap">
      <button class="btn soft small" id="sPlay" type="button" style="flex:none">播放</button>
      <button class="btn soft small" id="sUndo" type="button" style="flex:none">撤销</button>
      <button class="btn primary tapbig" id="sTap" type="button">第 1 句开始</button>
    </div>
  </div></div>
</section>

<!-- PLAYER -->
<section id="playerView" hidden>
  <div class="bar"><div class="wrap">
    <button class="btn icon back" data-back type="button" aria-label="返回"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
    <div class="tt"><b id="pTitle"></b><span id="pArtist"></span></div>
    <button class="btn soft small" id="togJp" type="button" aria-pressed="true">粤拼 开</button>
    <button class="btn icon" id="btnMenu" type="button" aria-label="更多" aria-haspopup="menu" aria-expanded="false"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg></button>
    <div class="menu" id="songMenu" role="menu" hidden>
      <button class="btn" type="button" role="menuitem" data-menu="current">设为正在学</button>
      <button class="btn" type="button" role="menuitem" data-menu="proof">编辑歌曲</button>
      <button class="btn" type="button" role="menuitem" data-menu="pack">词汇包</button>
      <button class="btn danger" type="button" role="menuitem" data-menu="del">删除</button>
    </div>
  </div></div>
  <div class="wrap">
    <div id="pBanner"></div>
    <div id="pSummary"></div>
    <div class="lyrics" id="lyrics"></div>
  </div>
  <div class="player">
    <div class="prog"><span id="pCur">0:00</span><input id="pSeek" type="range" min="0" max="1" step="0.01" value="0" aria-label="播放进度"><span id="pDur">0:00</span></div>
    <div class="ctrls">
      <button class="ib" id="bLoop" type="button" aria-label="单句循环" title="单句循环"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 2l4 4-4 4"/><path d="M3 11V9a3 3 0 0 1 3-3h15"/><path d="M7 22l-4-4 4-4"/><path d="M21 13v2a3 3 0 0 1-3 3H3"/></svg></button>
      <button class="ib" id="bPrev" type="button" aria-label="上一句"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg></button>
      <button class="ib play" id="bPlay" type="button" aria-label="播放"><svg id="icPlay" width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg><svg id="icPause" width="24" height="24" viewBox="0 0 24 24" fill="currentColor" style="display:none"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg></button>
      <button class="ib" id="bNext" type="button" aria-label="下一句"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg></button>
      <button class="ib rate" id="bRate" type="button" aria-label="播放速度">1×</button>
    </div>
  </div>
</section>

<!-- PROOF -->
<section id="proofView" hidden>
  <div class="bar"><div class="wrap">
    <button class="btn icon back" data-back type="button" aria-label="返回"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
    <div class="tt"><b>编辑歌曲</b><span id="prSong"></span></div>
    <button class="btn primary small" id="proofSave" type="button">保存</button>
  </div></div>
  <div class="wrap proof">
    <div class="card field">
      <div class="label">歌名和歌手</div>
      <input id="prTitle" type="text" placeholder="歌名" autocomplete="off">
      <input id="prArtist" type="text" placeholder="歌手" autocomplete="off">
      <div class="label">音频</div>
      <div class="audio-row"><span id="prAudioInfo" class="note"></span><label class="btn soft small" for="prAudio">更换音频<input id="prAudio" type="file" accept="audio/*,.mp3,.m4a,.aac,.wav"></label></div>
      <div class="note">换音频时歌词、时间轴和学习进度都保留。</div>
    </div>
    <div class="card shift-card">
      <div class="sc-txt"><b>整首歌一起挪</b><span class="note">歌词整体比歌声早或晚时用</span></div>
      <div class="sc-ctl"><button class="btn soft icon" id="shiftMinus" type="button" aria-label="整首往前 0.2 秒">−</button><span id="shiftVal" class="num">0.0s</span><button class="btn soft icon" id="shiftPlus" type="button" aria-label="整首往后 0.2 秒">+</button></div>
    </div>
    <div class="pl-list" id="proofList"></div>
  </div>
  <div class="player">
    <div class="prog"><span id="prCur">0:00</span><input id="prSeek" type="range" min="0" max="1" step="0.01" value="0" aria-label="播放进度"><span id="prDur">0:00</span></div>
    <div class="ctrls solo"><button class="ib play" id="prPlay" type="button" aria-label="播放/暂停"><svg class="i-play" width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg><svg class="i-pause" width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg></button></div>
  </div>
</section>

<!-- SETTINGS -->
<section id="settingsView" hidden>
  <div class="bar"><div class="wrap">
    <button class="btn icon back" data-back type="button" aria-label="返回"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
    <div class="tt"><b>设置</b></div>
  </div></div>
  <!-- 分组列表（设计规范 5.11）：组名在卡片上方；每行 52px，细线分隔；左边名称，右边当前值 + 箭头。
       「开发者模式」在最下面单独一组，只有开启时才显示（renderSettings 里生成） -->
  <div class="wrap set">
    <div class="sgrp-t">学习</div>
    <div class="sgrp">
      <div class="cell-goal">
        <div class="cell-head"><span class="cell-n">每天新学几句</span></div>
        <div class="seg" id="goalSeg"></div>
        <div class="stepper" id="goalStep" hidden><button class="btn soft icon" id="goalMinus" type="button" aria-label="少一句">−</button><span id="goalNum" class="num"></span><span class="note">句</span><button class="btn soft icon" id="goalPlus" type="button" aria-label="多一句">+</button></div>
      </div>
      <button class="cell" type="button" id="wordsRow"><span class="cell-n">我的生词</span><span class="cell-v"><span class="num" id="wordsN"></span><svg class="chev" width="8" height="14" viewBox="0 0 8 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1.5 1.5L6.5 7l-5 5.5"/></svg></span></button>
    </div>
    <div class="sgrp-t">外观</div>
    <div class="sgrp">
      <button class="cell" type="button" id="skinRow"><span class="cell-n">皮肤</span><span class="cell-v"><span id="skinName"></span><svg class="chev" width="8" height="14" viewBox="0 0 8 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1.5 1.5L6.5 7l-5 5.5"/></svg></span></button>
    </div>
    <div class="sgrp-t">数据</div>
    <div class="sgrp">
      <button class="cell" type="button" id="bkExport"><span class="cell-n">导出备份文件</span><span class="cell-v"><span id="bkAge"></span><svg class="chev" width="8" height="14" viewBox="0 0 8 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1.5 1.5L6.5 7l-5 5.5"/></svg></span></button>
      <label class="cell" for="bkFile"><span class="cell-n">从文件恢复</span><span class="cell-v"><svg class="chev" width="8" height="14" viewBox="0 0 8 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1.5 1.5L6.5 7l-5 5.5"/></svg></span><input id="bkFile" type="file" accept=".json,application/json"></label>
    </div>
    <button class="sgrp-note tip-link" type="button" id="bkTip" hidden>建议添加到主屏幕使用，数据更不容易丢失</button>
    <div id="a2hsGroup"></div>
    <div class="sgrp-t">关于</div>
    <div class="sgrp">
      <button class="cell" type="button" id="btnChangelog"><span class="cell-n">版本记录</span><span class="cell-v"><span class="num" id="setVer"></span><svg class="chev" width="8" height="14" viewBox="0 0 8 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1.5 1.5L6.5 7l-5 5.5"/></svg></span></button>
      <button class="cell" type="button" id="btnRedeem"><span class="cell-n">兑换码</span><span class="cell-v"><svg class="chev" width="8" height="14" viewBox="0 0 8 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1.5 1.5L6.5 7l-5 5.5"/></svg></span></button>
    </div>
    <div id="devGroup"></div>
  </div>
</section>

<!-- WORDS：我的生词（设置页进入） -->
<section id="wordsView" hidden>
  <div class="bar"><div class="wrap">
    <button class="btn icon back" data-back type="button" aria-label="返回"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
    <div class="tt"><b>我的生词</b><span id="wordsSub"></span></div>
    <button class="btn text small" id="wSelAll" type="button" hidden>全选</button>
    <button class="btn text small" id="wSelect" type="button" hidden>选择</button>
    <button class="btn soft small" id="wDone" type="button" hidden>完成</button>
  </div></div>
  <div class="wrap">
    <div class="wtools on-page" id="wTools" hidden>
      <input type="search" id="wQ" placeholder="搜汉字、粤拼或意思" enterkeyhint="search" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="搜索生词">
      <div class="wtabs" id="wTabs" role="group" aria-label="筛选"></div>
    </div>
    <div class="words-list" id="wordsList"></div>
  </div>
  <div class="bottom-bar wact" id="wAct" hidden>
    <button class="btn soft" type="button" data-wact="known">标为认识</button>
    <button class="btn soft" type="button" data-wact="unknown">取消认识</button>
    <button class="btn danger-fill" type="button" data-wact="del">删除</button>
  </div>
  <div class="snack" id="wSnack" hidden role="status"><span id="wSnackMsg"></span><button class="btn text small" id="wSnackUndo" type="button">撤销</button></div>
</section>

<section id="calendarView" hidden>
  <div class="bar"><div class="wrap">
    <button class="btn icon back" data-back type="button" aria-label="返回"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
    <div class="tt"><b>打卡日历</b></div>
  </div></div>
  <div class="wrap cal" id="calBody"></div>
</section>

<!-- SKINS：设置 › 皮肤（设计规范 5.13） -->
<section id="skinsView" hidden>
  <div class="bar"><div class="wrap">
    <button class="btn icon back" data-back type="button" aria-label="返回"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
    <div class="tt"><b>皮肤</b></div>
  </div></div>
  <div class="wrap skins">
    <p class="skins-note">皮肤只改变颜色，学习进度和设置都不受影响。</p>
    <div class="skins-list" id="skinsList"></div>
  </div>
</section>

<!-- REDEEM：兑换码（设置 › 关于进入，整页；设计规范 5.15、5.16：要输入文字的界面不放在底部弹窗里） -->
<section id="redeemView" hidden>
  <div class="bar"><div class="wrap">
    <button class="btn icon back" data-back type="button" aria-label="返回"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
    <div class="tt"><b>兑换码</b></div>
  </div></div>
  <div class="wrap form">
    <div class="card field">
      <input type="text" id="rdIn" autocomplete="off" autocapitalize="characters" autocorrect="off" spellcheck="false" enterkeyhint="go" placeholder="CANTO-XXXX-XXXX-XXXX" aria-label="兑换码">
      <div class="rd-msg" id="rdMsg" role="status"></div>
      <button class="btn primary block" type="button" id="rdGo">兑换</button>
    </div>
    <p class="note rd-note">兑换码可以解锁皮肤。不区分大小写，空格和连字符可以不输。</p>
  </div>
</section>

<!-- PACK：词汇包（歌曲页「⋯」进入，整页；粘贴框不能放在底部弹窗里） -->
<section id="packView" hidden>
  <div class="bar"><div class="wrap">
    <button class="btn icon back" data-back type="button" aria-label="返回"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
    <div class="tt"><b>词汇包</b><span id="packSub"></span></div>
  </div></div>
  <div class="wrap form" id="packBody"></div>
</section>

<!-- DEV：开发者模式（设置页最下面进入，开发规格 7.10.5） -->
<section id="devView" hidden>
  <div class="bar"><div class="wrap">
    <button class="btn icon back" data-back type="button" aria-label="返回"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
    <div class="tt"><b>开发者模式</b></div>
  </div></div>
  <div class="wrap set" id="devBody"></div>
</section>

<!-- CHANGELOG：版本记录（设置页进入，内容是 CHANGELOG.md） -->
<section id="changelogView" hidden>
  <div class="bar"><div class="wrap">
    <button class="btn icon back" data-back type="button" aria-label="返回"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
    <div class="tt"><b>版本记录</b><span id="clSub"></span></div>
  </div></div>
  <div class="wrap form cl" id="clBody"></div>
</section>

<!-- STUDY：每日学习（学词、整句、完成） -->
<section id="studyView" hidden>
  <div class="bar"><div class="wrap">
    <button class="btn icon back" data-back type="button" aria-label="关闭"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    <div class="cells" id="stCells"></div>
    <span class="st-count num" id="stCount"></span>
  </div></div>
  <div class="wrap study" id="stBody"></div>
  <div class="study-foot" id="stFoot"></div>
</section>

<!-- 常驻按钮：不放在页面里（切页时页面会滑动），到了对应页面直接显示，离开直接隐藏，没有动画 -->
<div class="edge-blur" data-page="home" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
<button class="btn inverse fab" id="btnAdd" type="button" data-page="home">＋ 导入新歌</button>
<button class="btn primary bottom bottom-bar" id="btnSave" type="button" data-page="importView" hidden>保存</button>
